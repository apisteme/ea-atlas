<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of views + working canvas; a right-hand detail drawer opens for any entity so every view stays one click from traceability. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8FAFC; --ink:#152030; --muted:#5B6879; --line:#DCE2EA;
  --accent:#0D6E6A; --accent-ink:#FFFFFF; --accent-soft:#DDF1EF;
  --invest:#2D7A4E; --tolerate:#A86F12; --migrate:#3C5AA8; --eliminate:#B53A3A;
  --ok:#2D7A4E; --warn:#A86F12; --crit:#B53A3A;
  --c-cust:#2D7A4E; --c-pub:#3C5AA8; --c-part:#A86F12; --c-ill:#7A8595;
  --r:#0D6E6A; --a:#152030; --c:#3C5AA8; --i:#7A8595;
  --shadow:0 8px 30px rgba(21,32,48,.12);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#151C26; --surface-2:#1A2230; --ink:#E5EAF1; --muted:#98A4B4; --line:#2A3443;
  --accent:#4DBDB5; --accent-ink:#0E131A; --accent-soft:#163331;
  --invest:#5DBB84; --tolerate:#E2A94B; --migrate:#8299E3; --eliminate:#E46F6F;
  --ok:#5DBB84; --warn:#E2A94B; --crit:#E46F6F;
  --c-cust:#5DBB84; --c-pub:#8299E3; --c-part:#E2A94B; --c-ill:#8C97A8;
  --r:#4DBDB5; --a:#E5EAF1; --c:#8299E3; --i:#8C97A8;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C26; --surface-2:#1A2230; --ink:#E5EAF1; --muted:#98A4B4; --line:#2A3443;
  --accent:#4DBDB5; --accent-ink:#0E131A; --accent-soft:#163331;
  --invest:#5DBB84; --tolerate:#E2A94B; --migrate:#8299E3; --eliminate:#E46F6F;
  --ok:#5DBB84; --warn:#E2A94B; --crit:#E46F6F;
  --c-cust:#5DBB84; --c-pub:#8299E3; --c-part:#E2A94B; --c-ill:#8C97A8;
  --r:#4DBDB5; --a:#E5EAF1; --c:#8299E3; --i:#8C97A8;
  --shadow:0 8px 30px rgba(0,0,0,.45); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.app{transition:grid-template-columns .18s ease}
.rail{position:relative}
.rail-toggle{all:unset;cursor:pointer;position:absolute;top:14px;right:10px;display:flex;align-items:center;gap:4px;padding:5px 7px;border-radius:7px;color:var(--muted);font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;z-index:2}
.rail-toggle .rt-l{display:none}
.rail-toggle:hover .rt-l,.rail-toggle:focus-visible .rt-l{display:inline}
.rail-toggle:hover,.rail-toggle:focus-visible{background:var(--surface-2);color:var(--ink)}
.rail-toggle:focus-visible,.rail-mini:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rail-mini{display:none}
.app.rail-collapsed{grid-template-columns:52px minmax(0,1fr)}
.app.rail-collapsed .rail{padding:14px 6px;overflow:hidden}
.app.rail-collapsed .brand,.app.rail-collapsed .nav,.app.rail-collapsed .rail-foot{display:none}
.app.rail-collapsed .rail-toggle{position:static;justify-content:center;padding:8px 0;width:100%}
.app.rail-collapsed .rail-toggle svg{transform:rotate(180deg)}
.app.rail-collapsed .rail-toggle .rt-l{display:none}
.app.rail-collapsed .rail-mini{all:unset;cursor:pointer;display:flex;flex:1;justify-content:center;align-items:flex-start;padding-top:10px;border-radius:8px;color:var(--muted);font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.12em}
.app.rail-collapsed .rail-mini span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.app.rail-collapsed .rail-mini:hover{background:var(--surface-2);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.app{transition:none}}
/* rail */
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{font:700 19px/1.1 var(--f-display);letter-spacing:-.01em}
.brand span{font:500 11px/1.3 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 8px 4px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:7px;color:var(--ink);font-weight:500}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav button small{font:500 11px var(--f-mono);color:var(--muted)}
.rail-foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 6px;line-height:1.45}
/* main */
main{padding-block:22px 60px;padding-inline:28px;min-width:0}
.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:700 clamp(22px,3vw,30px)/1.1 var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.search{position:relative;width:min(360px,100%)}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow:auto}
.results button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:8px 12px;width:100%;box-sizing:border-box}
.results button:hover,.results button:focus{background:var(--surface-2)}
.results em{font:500 10.5px var(--f-mono);color:var(--muted);font-style:normal;min-width:62px;text-transform:uppercase}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:12.5px;margin-bottom:18px}
.banner b{color:var(--ink)}
/* generic */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile-bar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:-6px 0 6px;font-size:12px}
.tile-bar[hidden]{display:none}
#kpi-grid .kpi{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#kpi-grid .kpi.dragging{opacity:.5;border:1px dashed var(--accent);pointer-events:none;transform:scale(.98)}
body.tile-dragging,body.tile-dragging *{cursor:grabbing!important}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{font:600 15px/1.3 var(--f-display);margin:0 0 4px;letter-spacing:-.005em}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi label{display:block;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{display:block;font:700 28px/1.15 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.warn b{color:var(--warn)} .kpi.crit b{color:var(--crit)}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font:500 11.5px/1.7 var(--f-body);white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-Invest{color:var(--invest);background:color-mix(in oklab,var(--invest) 12%,var(--surface))}
.t-Tolerate{color:var(--tolerate);background:color-mix(in oklab,var(--tolerate) 13%,var(--surface))}
.t-Migrate{color:var(--migrate);background:color-mix(in oklab,var(--migrate) 12%,var(--surface))}
.t-Eliminate{color:var(--eliminate);background:color-mix(in oklab,var(--eliminate) 12%,var(--surface))}
.s-ok{color:var(--ok);background:color-mix(in oklab,var(--ok) 12%,var(--surface))}
.s-warn{color:var(--warn);background:color-mix(in oklab,var(--warn) 13%,var(--surface))}
.s-crit{color:var(--crit);background:color-mix(in oklab,var(--crit) 12%,var(--surface))}
.s-neutral{color:var(--muted);background:var(--surface-2)}
.conf{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--f-mono);white-space:nowrap}
.conf i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;padding:3px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:12.5px;line-height:1.4;max-width:100%}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip code{font:500 10.5px var(--f-mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
th[data-sort]{cursor:pointer} th[data-sort]:hover{color:var(--ink)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr[data-ent]{cursor:pointer}
tbody tr[data-ent]:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
.filters label{display:flex;flex-direction:column;gap:3px;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.filters select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:13px var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:12.5px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* stacked bar */
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.stack span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
/* attention list */
.att{display:flex;flex-direction:column}
.att > div{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.att > div:last-child{border-bottom:0}
.att .stripe{align-self:stretch;border-radius:2px}
.att .what{min-width:0}
.att .what b{font-weight:600}
.att .what div{font-size:12px;color:var(--muted)}
/* capability map */
.capmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.l1{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.l1 header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:2px 4px 6px}
.l1 header b{font:600 13.5px/1.25 var(--f-display)}
.l1 header code{font:500 10.5px var(--f-mono);color:var(--muted)}
.l2{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 9px;border-radius:7px;font-size:12.5px;line-height:1.3;border:1px solid transparent}
.l2:hover{border-color:var(--ink)}
.l3s{display:flex;flex-direction:column;gap:2px;margin:-2px 0 4px 10px;padding-left:8px;border-left:2px solid var(--line)}
.l3{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 6px;border-radius:5px;font-size:11.5px;line-height:1.3;color:var(--ink)}
.l3:hover,.l3:focus-visible{background:color-mix(in oklab,var(--accent) 10%,var(--surface))}
.l3 small{font:500 10.5px var(--f-mono);color:var(--muted)}
.l3.gap small{color:var(--crit);font-weight:600}
.gd-hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.gd-h{font:600 15px/1.3 var(--f-display);margin:22px 0 10px}
.gd-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gd-card h4{margin:8px 0 6px;font:600 14px var(--f-display)}
.gd-card p{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.5}
.gd-card code,.panel dd code{font:500 11.5px var(--f-mono);background:var(--surface-2);padding:2px 6px;border-radius:5px;word-break:break-all}
.gd-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--surface);font:600 12px var(--f-mono);flex:none}
.gd-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.gd-flow li{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative}
.gd-flow b{font:600 13.5px var(--f-display)}
.gd-flow p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.gd-asks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}
.gd-ask{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:13px;line-height:1.45}
.gd-ask:hover,.gd-ask:focus-visible{border-color:var(--accent)}
.gd-ask small{font:500 10.5px var(--f-mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.gd-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
.gd-dl{margin:0;display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:8px 14px;font-size:13px;line-height:1.5}
.gd-dl dt{font-weight:600}
.gd-dl dd{margin:0;color:var(--muted)}
@media (max-width:560px){.gd-dl{grid-template-columns:1fr}.gd-dl dd{margin-bottom:6px}}
.ft-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.ft-kpis .kpi b{font-size:22px}
.ft-kpis .kpi span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ft-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.ft-h{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 6px}
.ft-ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.ft-flags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ft-flag{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13px;line-height:1.5;padding:7px 10px;border-radius:8px;background:var(--surface-2)}
.ft-flag.crit{background:color-mix(in oklab,var(--crit) 10%,var(--surface))}
.ft-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0;text-transform:none;letter-spacing:0;font:13px var(--f-body);color:var(--ink)}
.ft-row > span{flex:1;min-width:140px}
.ft-row select{font:13px var(--f-body);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.ft-row select#ft-addapps,.ft-row select#ft-addcaps,.ft-row select#ft-addsteps,.ft-row select#ft-adddrivers,.ft-row select#ft-adddepends{flex:1;min-width:200px}
.ft-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
.ft-four{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px}
.ft-road td{vertical-align:top;min-width:86px}
.ft-road td:first-child{min-width:200px}
.ft-pill{all:unset;cursor:pointer;display:inline-block;margin:2px;padding:2px 7px;border-radius:6px;font:600 11px var(--f-mono);border:1px solid var(--line);background:var(--surface)}
.ft-pill:focus-visible{outline:2px solid var(--accent)}
.lv-low{border-left:4px solid var(--ok)} .lv-medium{border-left:4px solid var(--muted)} .lv-high{border-left:4px solid var(--warn)} .lv-critical{border-left:4px solid var(--crit)}
.ft-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.d-low{background:var(--ok)} .d-medium{background:var(--muted)} .d-high{background:var(--warn)} .d-critical{background:var(--crit)}
.sc-f .chips,.sc-f .ft-row,.sc-f .empty{text-transform:none;letter-spacing:0;font:13px var(--f-body);color:var(--ink)}
.ft-row select{width:auto!important}
.ft-row select[id^="ft-add"]:not(#ft-addch){flex:1;min-width:200px}
@media (max-width:820px){#ft-body .sc-main{order:-1} #ft-body .sc-list{max-height:360px}}
.linklike{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.linklike:focus-visible{outline:2px solid var(--accent)}
.drawer-actions{display:flex;gap:8px;flex-wrap:wrap}
.wi-menu{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.wi-menu .k{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wi-opt{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.wi-opt:hover,.wi-opt:focus-visible{border-color:var(--accent)}
.wi-opt b{font:600 13px var(--f-body)} .wi-opt span{grid-column:2;font-size:12px;color:var(--muted)}
.wi-opt i{grid-row:1/3;font-style:normal;font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);align-self:center;min-width:64px}
.l2 small{font:500 11px var(--f-mono);font-variant-numeric:tabular-nums;opacity:.85}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.scale .bar{display:flex;border-radius:4px;overflow:hidden}
.scale .bar span{width:26px;height:10px}
/* value stream */
.vs-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.vs-tabs button{all:unset;cursor:pointer;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:500}
.vs-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;counter-reset:st}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;position:relative}
.step h3{margin:0;font:600 14px/1.3 var(--f-display);display:flex;gap:9px;align-items:baseline}
.step h3 .n{font:500 11px var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px}
.step h3 button{all:unset;cursor:pointer} .step h3 button:hover{color:var(--accent)}
.step .lbl{font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.raci{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:4px;font:600 10px var(--f-mono);color:var(--surface)}
.raci.R{background:var(--r)} .raci.A{background:var(--a)} .raci.C{background:var(--c)} .raci.I{background:var(--i)}
.vs-head{display:flex;flex-wrap:wrap;gap:8px 24px;margin-bottom:14px;font-size:13px}
.vs-head div span{display:block;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
/* process architecture */
.bpa{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.bpa-col{display:flex;flex-direction:column;gap:12px}
.bpa-col > header{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--surface)}
.bpa-col > header b{font:700 17px var(--f-display)} .bpa-col > header span{font-size:12px;opacity:.8}
.bpa-grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px}
.bpa-l1{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:6px 8px 8px;font:600 14px/1.3 var(--f-display);border-bottom:1px solid var(--line);margin-bottom:2px}
.bpa-l1 code,.bpa-l2 code{font:500 10.5px var(--f-mono);color:var(--muted);margin-right:8px}
.bpa-l1 small{font:400 11.5px var(--f-body);color:var(--muted)}
.bpa-l1:hover{color:var(--accent)}
.bpa-l2{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;font-size:13px}
.bpa-l2:hover{background:var(--surface-2);color:var(--accent)}
.bpa-meta{display:flex;align-items:center;gap:8px;white-space:nowrap}
.bpa-meta em{font:500 11px var(--f-mono);font-style:normal;color:var(--muted)}
.map-dot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent)}
/* swimlane */
.swim{display:block;font-family:var(--f-body)}
.swim .lane-t{font:600 12.5px var(--f-body);fill:var(--ink)} .swim .lane-s{font:500 10px var(--f-mono);fill:var(--muted);text-transform:uppercase}
.swim .flow{fill:none;stroke:var(--muted);stroke-width:1.6}
.swim .assoc{stroke:var(--muted);stroke-dasharray:3 3}
.swim .task{cursor:pointer} .swim .task rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.3} .swim .task:hover rect{stroke:var(--accent);stroke-width:2}
.swim .task-t{font:500 12px var(--f-body);fill:var(--ink)} .swim .task-n{font:600 10px var(--f-mono);fill:var(--accent)}
.swim .part{fill:var(--surface);stroke:var(--muted);stroke-dasharray:3 2;cursor:pointer} .swim .part-t{font:500 10px var(--f-mono);fill:var(--muted);pointer-events:none}
.swim .sys{cursor:pointer} .swim .sys rect{fill:var(--surface);stroke:color-mix(in oklab,var(--accent) 35%,var(--line))} .swim .sys:hover rect{stroke:var(--accent)}
.swim .sys-t{font:500 11px var(--f-body);fill:var(--ink)}
/* landscape */
.land{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.land-dom{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.land-dom header{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 8px}
.land-dom header b{font:600 13.5px var(--f-display)} .land-dom header code{font:500 11px var(--f-mono);color:var(--muted)}
.land-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.land-app{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:2px;padding:7px 9px 7px 9px;border:1px solid;border-radius:8px;min-height:44px}
.land-app b{font:600 12px/1.25 var(--f-body);padding-right:10px} .land-app span{font-size:10.5px;color:var(--muted);line-height:1.25}
.land-app i{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%}
.land-app:hover{outline:2px solid var(--accent);outline-offset:-1px}
/* integration map */
.imap{display:block} .imap .ih{font:500 10.5px var(--f-mono);fill:var(--muted);letter-spacing:.08em}
.imap .ie{fill:none;stroke-width:1.4} .imap .ie.hot{stroke-width:2.4}
.imap .in{cursor:pointer} .imap .in rect{fill:var(--surface);stroke:var(--line)} .imap .in:hover rect{stroke:var(--accent)}
.imap .in.focus rect{stroke:var(--accent);stroke-width:2;fill:var(--accent-soft)}
.imap .in text{font:500 11px var(--f-body);fill:var(--ink)}
/* resilience */
.sites{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.site{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.site.live{border-color:var(--ok);background:color-mix(in oklab,var(--ok) 7%,var(--surface))}
.site.standby{border-style:dashed}
.site-h{display:flex;flex-direction:column} .site-h b{font:700 16px var(--f-display)} .site-h span{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.site-n{font-size:12.5px;color:var(--muted)} .site-n b{color:var(--ink);font-variant-numeric:tabular-nums}
.site-arrow{display:flex;flex-direction:column;justify-content:center;align-items:center;font:600 20px var(--f-display);color:var(--muted)}
.site-arrow span{font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;max-width:80px;text-align:center}
@media (max-width:860px){.sites{grid-template-columns:minmax(0,1fr)}.site-arrow{flex-direction:row;gap:8px}}
/* taxonomy */
.tax{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.tax-dom{display:flex;flex-direction:column;gap:6px}
.tax-dom h3{margin:0 0 4px;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.tax-el{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.tax-el:hover{border-color:var(--accent)}
.tax-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tax-top b{font:600 13.5px var(--f-display)}
.tax-meta{display:flex;gap:5px;align-items:baseline;white-space:nowrap}
.tax-meta code{font:500 10px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.tax-meta em{font:600 12px var(--f-mono);font-style:normal;color:var(--accent);min-width:18px;text-align:right}
.tax-def{font-size:12px;color:var(--ink);line-height:1.4} .tax-ex{font-size:11.5px;color:var(--muted)}
.rels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:6px 18px;font-size:12.5px}
.rels div{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.rels b{font-weight:600} .rels span{color:var(--muted);font-style:italic}
/* version and change log */
.ver{all:unset;cursor:pointer;margin-top:6px;align-self:flex-start;font:500 10.5px var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 7px}
.ver:hover{outline:1px solid var(--accent)}
.whatsnew{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px;font-size:13px}
.whatsnew > span:nth-child(2){flex:1;min-width:200px}
.cl{display:flex;flex-direction:column}
.cl-v{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.cl-rail{position:relative;display:flex;justify-content:center}
.cl-rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.cl-v:first-child .cl-rail::before{top:14px}
.cl-v:last-child .cl-rail::before{bottom:calc(100% - 14px)}
.cl-dot{position:relative;margin-top:8px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.cl-v.cur .cl-dot{border-color:var(--accent);background:var(--accent)}
.cl-body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px;min-width:0}
.cl-v.cur .cl-body{border-color:color-mix(in oklab,var(--accent) 50%,var(--line))}
.cl-body header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cl-num{font:700 13px var(--f-mono);color:var(--accent)} .cl-body header b{font:600 15px var(--f-display)}
.cl-body p{margin:6px 0 8px;font-size:13px}
.cl-body ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.cl-diff{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.cl-diff summary{cursor:pointer;font-size:12.5px;color:var(--muted)} .cl-diff summary:hover{color:var(--ink)}
.cl-diff .tbl-wrap{margin-top:8px}
/* strategy */
.sg-theme{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:12px;background:var(--ink);color:var(--surface);margin-bottom:16px}
.sg-theme .k,.sg-strip .k{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.09em;opacity:.75}
.sg-theme b{font:700 clamp(17px,2vw,21px)/1.25 var(--f-display);text-wrap:balance}
.sg-theme a{color:inherit;opacity:.8;font-size:12px}
.sg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.sg-pillar{display:flex;flex-direction:column;gap:8px}
.sg-pillar header{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
.sg-pillar.en header{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.sg-pillar header .k{font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.09em;opacity:.8}
.sg-pillar header b{font:700 16px/1.2 var(--f-display)}
.sg-pillar header .chip{font-size:11.5px;color:var(--ink);background:var(--surface)}
.si-card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.si-card:hover{border-color:var(--accent)}
.si-t{font:600 14px/1.3 var(--f-display)} .si-e{font-size:12.5px;line-height:1.45;color:var(--ink)}
.si-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px;font-size:11.5px}
.sg-strip{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:16px}
.sg-strip > div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0} .sg-strip b{font:600 15px/1.3 var(--f-display)} .sg-strip .k{color:var(--muted);opacity:1}
/* scenarios */
.sc-wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.ed-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;padding:14px 16px;margin-bottom:12px;border:1px solid color-mix(in oklab,var(--accent) 45%,var(--line));border-left:4px solid var(--accent);border-radius:12px;background:var(--accent-soft,var(--surface));scroll-margin-top:12px}
.ed-head:focus{outline:none}
.ed-head .k{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.ed-head.flash{animation:edflash 1.2s ease-out}
@keyframes edflash{0%{box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 35%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.ed-head.flash{animation:none}}
.sc-item.draft{border-style:dashed}
.sc-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);overflow:auto}
.sc-list h4{margin:4px 6px 4px;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;justify-content:space-between}
.sc-item{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.sc-item:hover{background:var(--surface-2)} .sc-item.on{background:var(--accent-soft);border-color:color-mix(in oklab,var(--accent) 40%,transparent)}
.sc-item-t{font:600 13px/1.3 var(--f-body)} .sc-item-m{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor!important;flex:none}
.sc-main{min-width:0}
.sc-head{margin-bottom:16px} .sc-head .k{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sc-head-top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.sc-title{font:700 21px/1.2 var(--f-display);margin:4px 0 8px;text-wrap:balance}
.sc-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed-ready{margin:4px 0 10px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink)}
.ed-ready b{font-weight:600}
.ed-ready ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.ed-ready li{display:flex;gap:8px;align-items:baseline}
.ed-ready li::before{flex:none;width:14px;text-align:center;font-weight:700}
.ed-ready .ed-todo::before{content:'\25CB';color:var(--muted)}
.ed-ready li.ed-ok{color:var(--muted);text-decoration:line-through}
.ed-ready li.ed-ok::before{content:'\2713';color:var(--ok)}
.ed-ready.done{background:color-mix(in oklab,var(--ok) 10%,var(--surface));border-color:color-mix(in oklab,var(--ok) 40%,var(--line))}
.ed-ready.done .ed-ok{color:var(--ok);font-weight:600}
.ed-ready.done .ed-ok::before{content:'\2713  '}
.ed-alert{margin:0 0 10px;padding:10px 12px;border-radius:8px;border-left:3px solid var(--crit);background:color-mix(in oklab,var(--crit) 9%,var(--surface));color:var(--ink);font-size:12.5px;font-weight:500}
.sc-f.invalid input,.sc-f.invalid select{border-color:var(--crit)!important;box-shadow:0 0 0 2px color-mix(in oklab,var(--crit) 25%,transparent)}
.sc-f.invalid > span,.sc-f.invalid{color:var(--crit)}
.sc-desc{margin:10px 0 0;font-size:13.5px;max-width:80ch}
.sc-form .k{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.sc-f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sc-f > span{display:block}
.sc-f input,.sc-f select,.sc-f textarea,#sc-add{font:13.5px var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;box-sizing:border-box}
.sc-f textarea{resize:vertical}
.x-mini{all:unset;cursor:pointer;font-size:10px;color:var(--muted);padding:0 2px} .x-mini:hover{color:var(--crit)}
.sc-reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:2px 16px;text-transform:none;letter-spacing:0}
.sc-req{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font:13px/1.35 var(--f-body);color:var(--ink);cursor:pointer}
.sc-req b{font:600 11px var(--f-mono);color:var(--muted)}
.sc-tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sc-tl div{border-left:3px solid var(--accent);padding:4px 10px;display:flex;flex-direction:column;font-size:12.5px} .sc-tl b{font-size:14px}
.sc-vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.sc-vs h3{margin:0 0 6px;font:600 13.5px var(--f-display)}
.sc-j{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 34px;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-size:12.5px;width:100%;box-sizing:border-box}
.sc-j:hover{background:var(--surface-2)} .sc-j em{font:600 11.5px var(--f-mono);font-style:normal;text-align:right}
.sc-steps{display:flex;gap:2px} .sc-steps i{width:9px;height:14px;border-radius:2px;background:var(--line)} .sc-steps i.h{background:var(--crit)} .sc-steps i.d{background:var(--warn)}
.rm{table-layout:fixed} .rm th,.rm td{border:1px solid var(--line)} .rm-c{min-width:120px;height:58px;vertical-align:top} .rm-c .chip{margin:2px;font-size:11.5px}
@media (max-width:860px){.sc-wrap{grid-template-columns:minmax(0,1fr)}.sc-list{position:static;max-height:360px}.sc-wrap .sc-main{order:-1}}
/* clickable tiles */
.kpi.click{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative}
.kpi.click:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(21,32,48,.06)}
.kpi.click .go{position:absolute;top:12px;right:14px;font-style:normal;color:var(--muted);transition:transform .15s}
.kpi.click:hover .go{color:var(--accent);transform:translateX(2px)}
.kpi.click:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg-click{all:unset;cursor:pointer;height:100%;display:block}
.seg-click:hover{filter:brightness(1.15)}
.leg-click{all:unset;cursor:pointer;border-radius:5px;padding:1px 4px}
.leg-click:hover{background:var(--surface-2);color:var(--ink)}
/* programme */
.ms{position:relative;height:70px;margin:8px 8px 0}
.ms .line{position:absolute;left:0;right:0;top:22px;height:2px;background:var(--line)}
.ms .done-line{position:absolute;left:0;top:22px;height:2px;background:var(--accent)}
.ms .m{position:absolute;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.ms .m i{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);display:grid;place-items:center;font:600 10px var(--f-mono);font-style:normal;color:var(--accent)}
.ms .m.done i{background:var(--accent);color:var(--accent-ink)}
.ms .m.next i{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 4px color-mix(in oklab,var(--warn) 20%,transparent)}
.ms .m span{font:500 10.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.ms .today{position:absolute;top:4px;bottom:24px;width:2px;background:var(--warn)}
.ms-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:6px;font-size:12.5px}
.ms-list div{display:flex;gap:8px}
.ms-list b{font:600 11px var(--f-mono);color:var(--accent);min-width:16px}
.syn input{width:58px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:right;font:13px var(--f-mono)}
.dec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.dec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dec header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dec h3{margin:0;font:600 15px/1.3 var(--f-display)}
.dec h3 button{all:unset;cursor:pointer} .dec h3 button:hover{color:var(--accent)}
.dec .blast{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.dec .blast div{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}

/* role matrix */

.tl{position:relative}

.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:12.5px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.callout{border-left:3px solid var(--warn);background:color-mix(in oklab,var(--warn) 8%,var(--surface));padding:10px 12px;border-radius:0 8px 8px 0;font-size:12.5px}
a{color:var(--accent)}
.empty{color:var(--muted);font-size:12.5px}

}

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const TODAY = new Date(D.meta.as_of+"T00:00:00");
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const by = (arr,k='id')=>Object.fromEntries(arr.map(x=>[x[k],x]));
const GL=by(D.glossary), BP=by(D.business_processes), CVS=by(D.customer_value_streams), CAP=by([...D.capabilities,...(D.capabilities_l3||[])]), VS=by(D.value_streams), ST=by(D.steps), RO=by(D.roles), AP=by(D.apps), SU=by(D.suppliers), K=by(D.contracts);

const L1=D.capabilities.filter(c=>c.level===1), L2=D.capabilities.filter(c=>c.level===2), L3=D.capabilities_l3||[], L3of={}; L3.forEach(c=>(L3of[c.parent]=L3of[c.parent]||[]).push(c));
const P=D.meta.profile||{}, CR=Object.assign({label:'Critical service',short:'Critical service',plural:'critical services',abbr:'CRIT'},P.criticality||{}), TPR=Object.assign({material_label:'Critical supplier',material_abbr:'CS',terms_label:'Required contract terms'},P.third_party||{});
const PG=D.programme||null, ORGS=D.meta.short_name||D.meta.organisation, NOUN=P.org_noun||'organisation', VSL=P.value_stream_label||'Value stream';
const CUR=(D.meta.currency||{}).symbol||'€', CURC=(D.meta.currency||{}).code||'EUR', SKEY=D.meta.storage_key||'atlas';
const CUST=D.meta.customer_role||'';
const CRN=n=>n===1?(CR.short||'critical service').toLowerCase():CR.plural;
const CRB=()=>` <span class="mono muted" title="${esc(CR.label)}">${esc(CR.abbr)}</span>`;
const fmtM = v=>CUR+(v>=1?v.toFixed(1)+'m':(v*1000).toFixed(0)+'k');
const months = d=>Math.round((new Date(d+"T00:00:00")-TODAY)/(864e5*30.44));
const isDate = s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');

// ---- derived indexes
const appCost = id => (LIC[id]?.annual_cost_m||0)+(SUP[id]?.annual_support_cost_m||0);
const capApps={}, capSteps={}, appSteps={}, roleSteps={}, appSups={}, supApps={};
L2.forEach(c=>{capApps[c.id]=[];capSteps[c.id]=[]});
D.apps.forEach(a=>{a.capabilities.forEach(c=>capApps[c].push(a.id)); appSteps[a.id]=[]; appSups[a.id]=[]});
D.steps.forEach(s=>{
  s.capabilities.forEach(c=>capSteps[c].push(s.id));
  s.apps.forEach(a=>appSteps[a].push(s.id));
  const add=(r,l)=>{(roleSteps[r]=roleSteps[r]||[]).push({step:s.id,raci:l})};
  s.R.forEach(r=>add(r,'R')); add(s.A,'A'); s.C.forEach(r=>add(r,'C')); s.I.forEach(r=>add(r,'I'));
});
D.app_supplier.forEach(x=>{appSups[x.app].push(x); (supApps[x.supplier]=supApps[x.supplier]||[]).push(x)});
const supSpend = sid => (supApps[sid]||[]).filter(x=>AP[x.app].vendor===sid).reduce((t,x)=>t+appCost(x.app),0);
const supCaps = sid => [...new Set((supApps[sid]||[]).flatMap(x=>AP[x.app].capabilities))];
const supSteps = sid => [...new Set((supApps[sid]||[]).flatMap(x=>appSteps[x.app]))];
const appRoles = aid => [...new Set(appSteps[aid].flatMap(s=>{const t=ST[s];return [...t.R,t.A,...t.C]}))];
const contractOf = sid => D.contracts.find(k=>k.supplier===sid);
const LENS_ORDER=(PG&&PG.lens_order)||['Likely converge','Key decision','Assess','Replace / decommission','Retain'];
const LENS_VAR=Object.assign({'Likely converge':'--migrate','Key decision':'--crit','Assess':'--warn','Replace / decommission':'--eliminate','Retain':'--ok'},(PG&&PG.lens_colours)||{});
const lensKey = l => {l=l||''; const k=LENS_ORDER.find(k=>l.toLowerCase().startsWith(k.split(/[ /]/)[0].toLowerCase())); return k||(l?LENS_ORDER[LENS_ORDER.length-1]:'Not assessed')};
const PLABEL=(PG&&PG.lens_label)||'Programme lens', PNAME=(PG&&PG.name)||'Programme', PDEC=(PG&&PG.decision_label)||'Programme decision';

const CONF_VAR={'Customer-provided':'--c-cust','Public':'--c-pub','Partly confirmed':'--c-part','Illustrative':'--c-ill'};
const conf = c=>`<span class="conf" title="Data confidence"><i style="background:var(${CONF_VAR[c]})"></i>${esc(c)}</span>`;
const time = t=>`<span class="pill t-${t}">${t}</span>`;
const pill = (txt,s)=>`<span class="pill s-${s}">${esc(txt)}</span>`;
const chip = (type,id,label,code=true)=>`<button class="chip" data-ent="${type}:${id}">${code?`<code>${id}</code>`:''}${esc(label)}</button>`;
const nameOf = (type,id)=>({si:Object.fromEntries(D.strategy.initiatives.map(i=>[i.id,{name:i.title}])),term:Object.fromEntries(D.glossary.map(g=>[g.id,{name:g.term}])),bp:BP,cvs:CVS,cap:CAP,vs:VS,step:ST,role:RO,app:AP,sup:SU,feat:Object.fromEntries((D.features||[]).map(f=>[f.id,f])),epic:Object.fromEntries((D.epics||[]).map(e=>[e.id,e]))}[type][id]?.name||id);
const cvsSteps = cid => D.steps.filter(s=>VS[s.vs].parent===cid);
const cvsFoot = cid => {const st=cvsSteps(cid);const apps=[...new Set(st.flatMap(s=>s.apps))];return {journeys:D.value_streams.filter(v=>v.parent===cid),steps:st,apps,caps:[...new Set(st.flatMap(s=>s.capabilities))],roles:[...new Set(st.flatMap(s=>[...s.R,s.A,...s.C,...s.I]))],cost:apps.reduce((t,a)=>t+appCost(a),0),crit:apps.filter(a=>AP[a].crit).length,ill:apps.filter(a=>AP[a].confidence==='Illustrative').length}};
const CVS_ORDER=[...D.customer_value_streams.filter(c=>!c.cross_cutting),...D.customer_value_streams.filter(c=>c.cross_cutting)].map(c=>c.id);
const isXC=cid=>!!(CVS[cid]&&CVS[cid].cross_cutting), NVS=D.customer_value_streams.filter(c=>!c.cross_cutting).length;
const shortCvs=cid=>CVS[cid].short||CVS[cid].name;

// ---- views
const STD=(P.capability_standard||{}).name||'a reference capability model', PF=P.process_framework||'APQC PCF';
const DCP=D.data_centres.find(d=>d.kind==='primary')||D.data_centres[0], DCS=D.data_centres.find(d=>d.kind==='secondary')||D.data_centres[1];
const DCMODEL=D.meta.dc_model||'single';
const dcSentence=()=>DCMODEL==='active-passive'&&DCP&&DCS?`active-passive model: ${DCP.name} live, ${DCS.name} standby`:DCMODEL==='active-active'&&DCP&&DCS?`active-active model: ${DCP.name} and ${DCS.name} both live`:DCP?`single site: ${DCP.name}`:'no in-house data centre recorded';
const RREG=((P.resilience||{}).regime)||'';
const VIEWS = [
 {id:'overview',grp:'Summary',name:'Overview',sub:'Portfolio health, data confidence and where attention is needed.'},
 {id:'strategy',grp:'Strategy',name:'Strategic priorities',sub:`${ORGS} strategy: ${D.strategy.pillars.length} pillars, each initiative traced to the journeys, processes, capabilities and applications it depends on.`,n:()=>D.strategy.initiatives.length},
 ...(PG?[{id:'programme',grp:'Strategy',name:PNAME,sub:PG.view_sub||`What the ${PG.noun||'programme'} means for the architecture: stated commitments, the addressable cost pool, contract exposure and the key platform decisions.`}]:[]),
 {id:'change',grp:'Strategy',name:'Change impact',sub:`Epics and features in the change portfolio. Pick what a feature changes and see the impact on integrations, journeys, people, data, suppliers, resilience, regulation${PG?', '+PNAME:''} and other work in flight. For failures and outside events, use What if?.`,n:()=>D.features.length},
 {id:'scenarios',grp:'Strategy',name:'What if?',sub:'What happens if an application, platform, supplier or data centre fails, a supplier changes its prices, a system is retired or a new regulation arrives. See the impact across value streams, journeys, processes, capabilities, applications and suppliers. For planned work, use Change impact.'},
 {id:'capabilities',grp:'Business',name:'Capability map',sub:`${L1.length} L1 domains, their L2 capabilities and the L3 capabilities inside them, aligned to ${STD}. Choose a lens to colour the map, and Show L3 for the detail inside each L2.`,n:()=>L2.length},
 {id:'bpa',grp:'Business',name:'Process architecture',sub:`Business process hierarchy in three tiers: Operate (the customer value streams), Manage and Support. Aligned to ${PF}.`,n:()=>D.business_processes.filter(p=>p.level===2).length},
 {id:'pmap',grp:'Business',name:'Process maps',sub:'Swimlane map for each journey: who does each step, in what order, and which systems they use.',n:()=>D.value_streams.length},
 {id:'processes',grp:'Business',name:VSL+'s',sub:`${ORGS}'s ${VSL.toLowerCase()}s, the journeys within each, and the L3 steps with their roles (RACI) and applications.`,n:()=>NVS},
 {id:'roles',grp:'Business',name:'Roles',sub:'Who does what: RACI across every value stream, and the applications each role touches.',n:()=>D.roles.length},
 {id:'apps',grp:'Technology',name:'Applications',sub:'Portfolio by TIME rating, functional fit and technical health.',n:()=>D.apps.length},
 {id:'landscape',grp:'Technology',name:'Landscape map',sub:'Every application placed in its primary capability domain. Choose what the colour shows.'},
 {id:'integration',grp:'Technology',name:'Integration map',sub:'Data flows between applications, grouped by architecture layer and coloured by integration type. Select an application to isolate its flows.',n:()=>D.interfaces.length},
 {id:'resilience',grp:'Technology',name:'Resilience',sub:`Data centre dependency and recovery readiness under the ${dcSentence()}.${RREG?' Supports the '+RREG+' operational resilience view.':''}`},
 {id:'suppliers',grp:'Commercial',name:'Suppliers',sub:`Spend, dependency and concentration by supplier. Open one to see what the ${NOUN} cannot do without it.`,n:()=>D.suppliers.length},
 {id:'licensing',grp:'Commercial',name:'Contracts & licences',sub:'Renewals over the next 24 months and licence utilisation against entitlement.'},
 {id:'support',grp:'Commercial',name:'Support & lifecycle',sub:'Vendor end-of-support exposure and whether support cover matches criticality.'},
 {id:'risk',grp:'Commercial',name:'Third-party risk',sub:TPR.view_sub||`${TPR.material_label} and suppliers behind ${CR.plural}.`},
 {id:'glossary',grp:'Explore',name:'Taxonomy & glossary',sub:'The element types used in this atlas, how they relate, and what each term means.',n:()=>D.glossary.length},
 {id:'guide',grp:'Explore',name:'How to update',sub:'How to send new information in, what happens on a refresh, and how each release is recorded and shared.'},
 {id:'changes',grp:'Explore',name:'Change log',sub:'Every release of the atlas: what changed, why and where it came from. Each release is compared field by field with the previous one.',n:()=>D.changelog.length},
 {id:'trace',grp:'Explore',name:'Traceability',sub:'Pick any element and follow it across roles, process steps, capabilities, applications and suppliers.'},
];
const FIRST={cvs:CVS_ORDER[0]||'',vs:(D.value_streams[0]||{}).id||'',feat:(D.features[0]||{}).id||'',sc:(D.example_scenarios[0]||{}).id||'',
  app:([...D.apps].sort((a,b)=>a.tier_n-b.tier_n||appSteps[b.id].length-appSteps[a.id].length)[0]||{}).id||''};
let state={ftTab:'backlog',ftSel:FIRST.feat,scTab:'library',scSel:FIRST.sc,gq:'',gcat:'',resF:'',pmapVs:FIRST.vs,landMode:'time',intFocus:'',intFam:{},intAll:false,progLens:'',syn:null,view:'overview',capLens:'coverage',capCvs:'',cvs:FIRST.cvs,vs:FIRST.vs,appF:{time:'',tier:'',conf:'',cat:'',crit:''},appSort:['id',1],supSort:['spend',-1],trace:'app:'+FIRST.app,regSel:''};
try{const s=localStorage.getItem(SKEY+'-atlas'); if(s) Object.assign(state,JSON.parse(s))}catch(e){}
if(!CVS[state.cvs]) state.cvs=FIRST.cvs; if(!VS[state.pmapVs]) state.pmapVs=FIRST.vs; if(!state.intFam) state.intFam={}; if(state.appF.crit===undefined) state.appF.crit=''; if(!state.syn&&PG) state.syn={...(PG.synergy_defaults||{})}; if(!VS[state.vs]) state.vs=FIRST.vs;
if(!PG&&state.landMode==='lens') state.landMode='time';

// ---------- Process maps (swimlanes)
function wrap(t,n){const w=t.split(' '),out=[];let l='';w.forEach(x=>{if((l+' '+x).trim().length>n){out.push(l.trim());l=x}else l+=' '+x});if(l.trim())out.push(l.trim());return out}
function pmap(){
  const v=VS[state.pmapVs], steps=D.steps.filter(s=>s.vs===v.id);
  const laneOf=s=>s.R.length?s.R[0]:s.A;
  const lanes=[];const add=r=>{if(!lanes.includes(r))lanes.push(r)};
  if(CUST&&steps.some(s=>[...s.R].includes(CUST))) add(CUST);
  steps.forEach(s=>{add(laneOf(s));s.R.forEach(add)});
  const LW=176,CW=200,BW=166,BH=60,LH=84,T=8;
  const maxApps=Math.max(...steps.map(s=>s.apps.length)), SH=24+maxApps*20;
  const W=LW+CW*(steps.length+1)+20, H=T+lanes.length*LH+SH+16;
  const cx=i=>LW+CW*(i+0.5)+CW/2, ly=r=>T+lanes.indexOf(r)*LH+LH/2;
  let g='';
  lanes.forEach((r,i)=>{const y=T+i*LH;g+=`<rect x="0" y="${y}" width="${W}" height="${LH}" fill="${i%2?'var(--surface-2)':'var(--surface)'}"/><line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/>
    <g data-ent="role:${r}" style="cursor:pointer">${wrap(RO[r].name,20).slice(0,2).map((t,j,a)=>`<text x="14" y="${y+LH/2+(j-(a.length-1)/2)*15+4}" class="lane-t">${esc(t)}</text>`).join('')}<text x="14" y="${y+LH/2+ (wrap(RO[r].name,20).length>1?26:18)}" class="lane-s">${esc(RO[r].family)}</text></g>`});
  const sy=T+lanes.length*LH;
  g+=`<rect x="0" y="${sy}" width="${W}" height="${SH}" fill="var(--accent-soft)"/><line x1="0" x2="${W}" y1="${sy}" y2="${sy}" stroke="var(--line)"/><text x="14" y="${sy+22}" class="lane-t">Systems</text>`;
  g+=`<line x1="${LW}" x2="${LW}" y1="${T}" y2="${sy+SH}" stroke="var(--line)"/>`;
  // start / end events
  const s0=steps[0], sl=steps[steps.length-1];
  g+=`<circle cx="${LW+CW*0.5-30}" cy="${ly(laneOf(s0))}" r="11" fill="var(--surface)" stroke="var(--ok)" stroke-width="2"><title>Start: ${esc(v.trigger)}</title></circle>`;
  g+=`<path d="M${LW+CW*0.5-19},${ly(laneOf(s0))} H${cx(0)-BW/2-2}" class="flow" marker-end="url(#arr)"/>`;
  const ex=cx(steps.length-1)+BW/2+34;
  g+=`<circle cx="${ex}" cy="${ly(laneOf(sl))}" r="11" fill="var(--surface)" stroke="var(--crit)" stroke-width="3.5"><title>End: ${esc(v.outcome)}</title></circle>`;
  g+=`<path d="M${cx(steps.length-1)+BW/2},${ly(laneOf(sl))} H${ex-13}" class="flow" marker-end="url(#arr)"/>`;
  let handoffs=0;
  steps.forEach((s,i)=>{
    const x=cx(i), y=ly(laneOf(s));
    if(i<steps.length-1){const n=steps[i+1],x2=cx(i+1),y2=ly(laneOf(n));
      if(y2===y) g+=`<path d="M${x+BW/2},${y} H${x2-BW/2-2}" class="flow" marker-end="url(#arr)"/>`;
      else {handoffs++;const mx=x+BW/2+(CW-BW)/2;g+=`<path d="M${x+BW/2},${y} H${mx} V${y2} H${x2-BW/2-2}" class="flow" marker-end="url(#arr)"/>`}}
    // other responsible lanes
    s.R.slice(1).forEach(r=>{const yy=ly(r);g+=`<line x1="${x}" x2="${x}" y1="${y+(yy>y?BH/2:-BH/2)}" y2="${yy+(yy>y?-14:14)}" class="assoc"/><rect x="${x-46}" y="${yy-14}" width="92" height="28" rx="14" class="part" data-ent="step:${s.id}"><title>Also responsible: ${esc(RO[r].name)}</title></rect><text x="${x}" y="${yy+4}" text-anchor="middle" class="part-t">also R</text>`});
    const lines=wrap(s.name,24).slice(0,3);
    g+=`<g class="task" data-ent="step:${s.id}"><rect x="${x-BW/2}" y="${y-BH/2}" width="${BW}" height="${BH}" rx="8"/><text x="${x-BW/2+8}" y="${y-BH/2+14}" class="task-n">${s.seq}</text>
      ${lines.map((t,j)=>`<text x="${x}" y="${y+(j-(lines.length-1)/2)*14+4}" text-anchor="middle" class="task-t">${esc(t)}</text>`).join('')}<title>${esc(s.name)} · Accountable: ${esc(RO[s.A].name)}</title></g>`;
    // systems
    g+=`<line x1="${x}" x2="${x}" y1="${sy}" y2="${sy+6}" stroke="var(--accent)"/>`;
    s.apps.forEach((a,j)=>{g+=`<g class="sys" data-ent="app:${a}"><rect x="${x-BW/2}" y="${sy+10+j*20}" width="${BW}" height="17" rx="4"/><circle cx="${x-BW/2+8}" cy="${sy+18.5+j*20}" r="3.5" fill="var(--${AP[a].time.toLowerCase()})"/><text x="${x-BW/2+16}" y="${sy+22.5+j*20}" class="sys-t">${esc(AP[a].name.length>24?AP[a].name.slice(0,23)+'…':AP[a].name)}</text><title>${esc(AP[a].name)} · ${esc(AP[a].product)} · ${AP[a].time}</title></g>`});
  });
  const apps=[...new Set(steps.flatMap(s=>s.apps))], bpOf=D.business_processes.find(b=>b.journeys.includes(v.id));
  const opts=CVS_ORDER.map(c=>`<optgroup label="${esc(CVS[c].name)}">${D.value_streams.filter(x=>x.parent===c).map(x=>`<option value="${x.id}" ${x.id===v.id?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`).join('');
  $('#view').innerHTML=`<div class="filters"><label>Journey <select id="pmap-sel" data-pmapsel="1">${opts}</select></label>
    <div class="chips" style="align-self:flex-end">${chip('cvs',v.parent,CVS[v.parent].name,false)}${bpOf?chip('bp',bpOf.id,bpOf.name):''}${chip('role',v.owner,'Owner: '+RO[v.owner].name,false)}</div></div>
   <div class="grid g-kpi" style="margin-bottom:14px">
     <div class="kpi"><label>Steps</label><b>${steps.length}</b><span>${esc(v.trigger)}</span></div>
     <div class="kpi"><label>Lanes</label><b>${lanes.length}</b><span>roles doing the work</span></div>
     <div class="kpi ${handoffs>=4?'warn':''}"><label>Handoffs</label><b>${handoffs}</b><span>changes of lane between steps</span></div>
     <div class="kpi"><label>Systems touched</label><b>${apps.length}</b><span>${apps.filter(a=>AP[a].time==='Migrate'||AP[a].time==='Eliminate').length} rated Migrate or Eliminate</span></div>
   </div>
   <div class="tbl-wrap" style="padding:0"><svg class="swim" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Swimlane process map for ${esc(v.name)}">
     <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>${g}</svg></div>
   <div class="legend"><span><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--ok)" stroke-width="2"/></svg> Start: ${esc(v.trigger)}</span><span><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--crit)" stroke-width="3"/></svg> End: ${esc(v.outcome)}</span><span>Lane = first responsible role. "also R" marks other responsible roles. Dot colour on a system = TIME rating. Click any step, role or system for detail.</span></div>`;
}

// ---------- Integration map
const IFAMS=(P.interface_families||[{name:'Events',match:'kafka|event|stream',var:'--accent'},{name:'Messaging',match:'\\bMQ\\b|JMS|queue',var:'--migrate'},{name:'API',match:'API|REST|SOAP|SCIM|LDAP|Platform|Native',var:'--invest'},{name:'File / batch',match:'File|Manual|Syslog|CDC|SFTP|batch',var:'--c-ill'},{name:'Network / scheme',match:'.',var:'--warn'}]).map(f=>({name:f.name,re:new RegExp(f.match,'i'),var:f.var}));
const IFAM=p=>(IFAMS.find(f=>f.re.test(p||''))||IFAMS[IFAMS.length-1]).name;
const IFAM_VAR=Object.fromEntries(IFAMS.map(f=>[f.name,f.var]));
const LAYERS=(()=>{const L=(P.layers||[]).map(l=>[l[0],[...l[1]]]); if(!L.length) L.push(['Applications',[]]); const known=new Set(L.flatMap(l=>l[1])); D.apps.forEach(a=>{if(!known.has(a.category)){L[L.length-1][1].push(a.category);known.add(a.category)}}); return L.filter(l=>D.apps.some(a=>l[1].includes(a.category)))})();
const layerOf=a=>{const i=LAYERS.findIndex(l=>l[1].includes(AP[a].category));return i<0?LAYERS.length-1:i};
function integration(){
  const fams=Object.keys(IFAM_VAR), off=state.intFam||{};
  const ifs=D.interfaces.filter(i=>!off[IFAM(i.protocol)]);
  const used=new Set(D.interfaces.flatMap(i=>[i.source_app,i.target_app]));
  const apps=D.apps.filter(a=>state.intAll||used.has(a.id)).map(a=>a.id);
  const cols=LAYERS.map((_,i)=>apps.filter(a=>layerOf(a)===i).sort((x,y)=>AP[x].name.localeCompare(AP[y].name)));
  const NW=136,NH=26,GAP=34,CW=160,TOP=40;
  const W=CW*LAYERS.length+10, H=TOP+Math.max(...cols.map(c=>c.length))*GAP+20;
  const pos={}; cols.forEach((c,i)=>c.forEach((a,j)=>pos[a]={x:10+i*CW,y:TOP+j*GAP}));
  const f=state.intFocus&&pos[state.intFocus]?state.intFocus:'';
  const linked=new Set(f?ifs.filter(i=>i.source_app===f||i.target_app===f).flatMap(i=>[i.source_app,i.target_app]):[]);
  let edges='';
  ifs.forEach(i=>{const a=pos[i.source_app],b=pos[i.target_app];if(!a||!b)return;
    const fam=IFAM(i.protocol), hot=f&&(i.source_app===f||i.target_app===f), dim=f&&!hot;
    let x1,x2,y1=a.y+NH/2,y2=b.y+NH/2,d;
    if(b.x>a.x){x1=a.x+NW;x2=b.x;d=`M${x1},${y1} C${x1+40},${y1} ${x2-40},${y2} ${x2},${y2}`}
    else if(b.x<a.x){x1=a.x;x2=b.x+NW;d=`M${x1},${y1} C${x1-40},${y1} ${x2+40},${y2} ${x2},${y2}`}
    else {x1=a.x+NW;x2=b.x+NW;const bulge=x1+30+Math.abs(y2-y1)*0.15;d=`M${x1},${y1} C${bulge},${y1} ${bulge},${y2} ${x2},${y2}`}
    edges+=`<path d="${d}" class="ie ${hot?'hot':''}" style="stroke:var(${IFAM_VAR[fam]});opacity:${dim?0.08:hot?1:0.5}" marker-end="url(#ia-${fams.indexOf(fam)})"><title>${esc(AP[i.source_app].name)} → ${esc(AP[i.target_app].name)}: ${esc(i.data)} (${esc(i.protocol)}, ${esc(i.frequency)})</title></path>`});
  const nodes=apps.map(a=>{const p=pos[a],on=!f||a===f||linked.has(a);return `<g class="in ${a===f?'focus':''}" data-ifocus="${a}" style="opacity:${on?1:0.3}"><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="6"/><circle cx="${p.x+10}" cy="${p.y+NH/2}" r="4" fill="var(--${AP[a].time.toLowerCase()})"/><text x="${p.x+20}" y="${p.y+NH/2+4}">${esc(AP[a].name.length>19?AP[a].name.slice(0,18)+'…':AP[a].name)}</text><title>${esc(AP[a].name)} · ${esc(AP[a].product)}. Click to isolate, click again for detail.</title></g>`}).join('');
  const heads=LAYERS.map((l,i)=>`<text x="${10+i*CW}" y="20" class="ih">${esc(l[0].toUpperCase())}</text>`).join('');
  const markers=fams.map((fm,i)=>`<marker id="ia-${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(${IFAM_VAR[fm]})"/></marker>`).join('');
  const fl=f?D.interfaces.filter(i=>i.source_app===f||i.target_app===f):[];
  const famCount=fm=>D.interfaces.filter(i=>IFAM(i.protocol)===fm).length;
  $('#view').innerHTML=`<div class="filters">${fams.map(fm=>`<button class="chip" data-ifam="${fm}" aria-pressed="${!off[fm]}" style="${off[fm]?'opacity:.45;text-decoration:line-through':''}"><i style="display:inline-block;width:14px;height:3px;border-radius:2px;background:var(${IFAM_VAR[fm]});vertical-align:middle"></i>${fm} <code>${famCount(fm)}</code></button>`).join('')}
     <button class="chip" data-iall="1">${state.intAll?'Hide applications without interfaces':'Show all applications'}</button>${f?`<button class="chip" data-ifocus="">Clear selection</button>`:''}</div>
   <div class="tbl-wrap" style="padding:0"><svg class="imap" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Integration map"><defs>${markers}</defs>${heads}${edges}${nodes}</svg></div>
   ${f?`<section class="panel" style="margin-top:14px"><h2>${esc(AP[f].name)}: ${fl.length} interfaces</h2><p class="sub">${esc(AP[f].product)}. <button class="chip" data-ent="app:${f}">Open application detail</button></p>
     <div class="tbl-wrap"><table><thead><tr><th>Direction</th><th>Other application</th><th>Data</th><th>Type</th><th>Frequency</th></tr></thead><tbody>
     ${fl.map(i=>{const out=i.source_app===f,o=out?i.target_app:i.source_app;return `<tr data-ent="app:${o}"><td class="mono">${out?'Outbound':'Inbound'}</td><td>${esc(AP[o].name)}</td><td style="font-size:12.5px">${esc(i.data)}</td><td><span class="pill" style="color:var(${IFAM_VAR[IFAM(i.protocol)]});background:color-mix(in oklab,var(${IFAM_VAR[IFAM(i.protocol)]}) 12%,var(--surface))">${esc(i.protocol)}</span></td><td class="mono" style="font-size:12px">${esc(i.frequency)}</td></tr>`}).join('')}</tbody></table></div></section>`
   :`<p class="sub muted" style="font-size:12.5px;margin-top:10px">Click an application to isolate its flows; click it again for full detail. Hover a line for what flows over it. Interfaces may be partly illustrative; check their source in the Excel.</p>`}`;
}


// ---------- Resilience
function resilience(){
  const R0=D.resilience.map(r=>({...r,a:AP[r.app],m:r.last_dr_test?months(r.last_dr_test):null}));
  const inh=R0.filter(r=>r.site==='internal'), ven=R0.filter(r=>r.site==='vendor'), thp=R0.filter(r=>r.site!=='internal'&&r.site!=='vendor');
  const bad=r=>/Failed|issues|Not tested/.test(r.dr_result)||(r.m!==null&&-r.m>12);
  const att=R0.filter(bad);
  const critInh=inh.filter(r=>r.a.crit), critOut=[...ven,...thp].filter(r=>r.a.crit);
  const resPill=r=>pill(r.dr_result,r.dr_result==='Passed'?'ok':r.dr_result==='Failed'?'crit':r.dr_result==='Vendor attestation'?'neutral':'warn');
  const site=(title,sub,rows,cls)=>`<div class="site ${cls}"><div class="site-h"><b>${esc(title)}</b><span>${esc(sub)}</span></div><div class="site-n"><b>${rows.length}</b> apps · <b>${rows.filter(r=>r.a.crit).length}</b> ${esc(CRN(rows.filter(r=>r.a.crit).length))}</div><div class="chips">${rows.filter(r=>r.a.tier_n===0).map(r=>chip('app',r.app,r.a.name,false)).join('')}</div></div>`;
  const sev={Failed:0,'Passed with issues':1,'Not tested':2,'Vendor attestation':3,Passed:4};
  const jrows=CVS_ORDER.flatMap(c=>D.value_streams.filter(v=>v.parent===c)).map(v=>{const apps=[...new Set(D.steps.filter(s=>s.vs===v.id).flatMap(s=>s.apps))].map(a=>RES[a]);
    if(!apps.length) return null;
    const worst=apps.reduce((w,r)=>sev[r.dr_result]<sev[w.dr_result]?r:w,apps[0]); const crit=apps.filter(r=>AP[r.app].tier_n<=1), pool=crit.length?crit:apps; const slow=pool.reduce((w,r)=>r.rto_hours>w.rto_hours?r:w,pool[0]);
    return {v,n:apps.length,inh:apps.filter(r=>r.site==='internal').length,out:apps.filter(r=>r.site!=='internal').length,slow,worst}}).filter(Boolean);
  const f=state.resF;
  const list=R0.filter(r=>!f||(f==='site'&&r.site==='internal')||(f==='vendor'&&r.site!=='internal')||(f==='att'&&bad(r))).sort((x,y)=>x.a.tier_n-y.a.tier_n||sev[x.dr_result]-sev[y.dr_result]);
  const kp=(l,v,s,cls,rf)=>`<button class="kpi click ${cls||''}" data-resf="${rf}"><label>${l}</label><b>${v}</b><span>${s}</span><i class="go">→</i></button>`;
  const callout=DCMODEL==='active-passive'&&DCP&&DCS?`<b>Active-passive.</b> ${esc(DCP.name)} runs live and ${esc(DCS.name)} is standby. Losing ${esc(DCP.name)} needs a site failover for every in-house application, so recovery time is set by the failover runbooks and the slowest critical dependency in each journey.`
    :DCMODEL==='active-active'&&DCP&&DCS?`<b>Active-active.</b> ${esc(DCP.name)} and ${esc(DCS.name)} both run live. Losing one site reduces capacity and resilience but in-house applications keep running if they are deployed across both.`
    :DCP?`<b>Single site.</b> In-house applications run in ${esc(DCP.name)} with no second site, so a site loss means restoring from backup.`:`<b>No in-house data centre recorded.</b> Resilience depends on vendors and third parties.`;
  const sitesHtml=DCMODEL==='active-passive'&&DCP&&DCS?`${site(DCP.name,'Primary · live',inh,'live')}<div class="site-arrow"><span>Site failover</span>→</div>${site(DCS.name,'Secondary · standby',inh,'standby')}`
    :DCMODEL==='active-active'&&DCP&&DCS?`${site(DCP.name,'Live',inh,'live')}<div class="site-arrow"><span>Shared load</span>↔</div>${site(DCS.name,'Live',inh,'live')}`
    :`${site(DCP?DCP.name:'In-house',DCP?'Single site':'',inh,'live')}`;
  $('#view').innerHTML=`<div class="callout" style="margin-bottom:16px;border-left-color:var(--accent);background:color-mix(in oklab,var(--accent) 7%,var(--surface))">${callout} ${esc(((P.resilience||{}).note)||'Recovery targets and DR test history are illustrative until replaced with real data.')}</div>
   <div class="grid g-kpi" style="margin-bottom:16px">
     ${kp(DCMODEL==='active-passive'?'Depend on site failover':'Run in own data centres',inh.length,`${critInh.length} support ${CRN(critInh.length)}`,'','site')}
     ${kp(`Outside ${ORGS} data centres`,ven.length+thp.length,`${critOut.length} ${CRN(critOut.length)}; vendor or third-party resilience`,'','vendor')}
     ${kp('Need attention',att.length,'failed, with issues, untested or test over 12 months old','crit','att')}
     ${kp('All applications',R0.length,'clear the filter','', '')}
   </div>
   <section class="panel" style="margin-bottom:16px"><h2>Where the estate runs</h2><p class="sub">Tier 0 applications listed in each location. Click one for detail.</p>
    <div class="sites">${sitesHtml}${site('Vendor and third-party','Resilience managed by suppliers',[...ven,...thp],'ext')}</div></section>
   <section class="panel" style="margin-bottom:16px"><h2>Journey recovery</h2><p class="sub">A journey cannot recover faster than its slowest Tier 0 or Tier 1 application, and is only as tested as its weakest DR result. Click a journey for its process map.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Journey</th><th>${esc(VSL)}</th><th class="num">Apps</th><th class="num">In own DCs</th><th class="num">Outside DCs</th><th>Slowest critical RTO</th><th>Weakest DR result</th></tr></thead><tbody>
    ${jrows.map(j=>`<tr data-pmap="${j.v.id}" style="cursor:pointer"><td><b style="font-weight:600">${esc(j.v.name)}</b></td><td style="font-size:12.5px">${esc(shortCvs(j.v.parent))}</td><td class="num mono">${j.n}</td><td class="num mono">${j.inh}</td><td class="num mono">${j.out}</td><td style="font-size:12.5px"><b class="mono">${j.slow.rto_hours}h</b> ${esc(AP[j.slow.app].name)}</td><td>${resPill(j.worst)} <span style="font-size:12px">${esc(AP[j.worst.app].name)}</span></td></tr>`).join('')}
    </tbody></table></div></section>
   <section><div class="filters" style="align-items:center"><h2 style="font:600 17px var(--f-display);margin:0">Applications</h2><div class="seg" role="group" aria-label="Filter">${[['','All'],['site','Own data centres'],['vendor','Outside DCs'],['att','Needs attention']].map(([k,l])=>`<button data-resf="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div><span class="muted" style="font-size:12.5px">${list.length} shown</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Application</th><th>Tier</th><th>Mode</th><th class="num">RTO</th><th class="num">RPO</th><th>Last DR test</th><th>Result</th></tr></thead><tbody>
    ${list.map(r=>`<tr data-ent="app:${r.app}"><td><b style="font-weight:600">${esc(r.a.name)}</b>${r.a.crit?CRB():''}<div class="muted" style="font-size:12px">${esc(r.a.product)}</div></td><td class="mono">${r.a.tier.replace('Tier ','T')}</td><td style="font-size:12.5px">${esc(r.mode)}</td><td class="num mono">${r.rto_hours}h</td><td class="num mono">${r.rpo_minutes>=60?(r.rpo_minutes/60)+'h':r.rpo_minutes+'m'}</td><td class="mono" style="color:${r.m!==null&&-r.m>12?'var(--crit)':'inherit'}">${r.last_dr_test||'None'}</td><td>${resPill(r)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}

 'Platform application':()=>new Set(D.apps.flatMap(a=>(a.runs_on||[]).map(x=>x.app))).size,'Interface':()=>D.interfaces.length,'Data domain':()=>D.data_domains.length,

// ---------- Capability map
const LENSES={
  coverage:{name:'App coverage',val:c=>capApps[c.id].length,fmt:v=>v,scale:v=>v===0?'crit':v>=3?'warn':'ok',legend:'0 apps = gap · 1-2 = covered · 3+ = possible overlap'},
  importance:{name:'Importance',val:c=>({Critical:4,High:3,Medium:2,Low:1})[c.importance],fmt:(v,c)=>c.importance,legend:'Lighter = lower strategic importance'},
  maturity:{name:'Maturity',val:c=>c.maturity,fmt:v=>v+'/5',legend:'Illustrative maturity assessment, 1 (initial) to 5 (optimised)'},
  risk:{name:'Tech risk',val:c=>{const a=capApps[c.id];return a.length?a.reduce((t,x)=>t+(5-AP[x].tech_health),0)/a.length:0},fmt:v=>v.toFixed(1),warn:true,legend:'Average technical weakness of supporting apps; darker = riskier'},
  cost:{name:'Run cost',val:c=>capApps[c.id].reduce((t,x)=>t+appCost(x)/AP[x].capabilities.length,0),fmt:v=>fmtM(v),legend:'Application run cost allocated evenly across the capabilities each app supports'},
  strategy:{name:'Strategic focus',val:c=>c.strategic_initiatives||0,fmt:v=>v||'',legend:`Number of ${ORGS} strategic initiatives that rely on the capability`},
  ...(rdRegs().length?{rd:{name:'Readiness',val:c=>rdCap(c.id).rank,fmt:(v,c)=>{const n=rdCap(c.id).n;return n?n+' req':''},scale:v=>[null,'ok','c-pub','warn','crit'][v],
    scaleLegend:[['crit','Not planned'],['warn','Late'],['c-pub','On track'],['ok','Done'],[null,'Not in scope']],
    legend:()=>{const s=rdSummary(),r=rdReg();return `Readiness for ${esc(r.name)}, worst requirement per capability, from the change backlog. ${s['Not planned']} of ${s.total} requirements have no feature planned, ${s['Late']} are planned to land after the deadline, ${s['On track']} are on track and ${s['Done']} are done. Readiness is only as good as the backlog; deadlines may be estimates and article references may be unconfirmed`}}}:{}),
  confidence:{name:'Data confidence',val:c=>{const a=capApps[c.id];return a.length?a.filter(x=>AP[x].confidence!=='Illustrative').length/a.length:0},fmt:v=>Math.round(v*100)+'%',legend:'Share of supporting apps confirmed (customer-provided, public or partly confirmed)'},
};
function heat(lensId,c){
  const L=LENSES[lensId], v=L.val(c);
  if(L.scale){const s=L.scale(v);if(!s) return {bg:'var(--surface-2)',fg:'var(--muted)',v};return {bg:`color-mix(in oklab,var(--${s}) 22%,var(--surface))`,fg:'var(--ink)',v}}
  const all=L2.map(L.val), mx=Math.max(...all), mn=Math.min(...all), t=mx===mn?0:(v-mn)/(mx-mn);
  const base=L.warn?'--crit':'--accent', pct=Math.round(8+t*72);
  return {bg:`color-mix(in oklab,var(${base}) ${pct}%,var(--surface))`,fg:t>0.55?'var(--surface)':'var(--ink)',v};
}

    <p class="sub muted" style="margin:-4px 0 14px;font-size:12.5px">${typeof L.legend==='function'?L.legend():L.legend}.${used?` Faded tiles are not used by ${esc(CVS[state.capCvs].name)}.`:''} Click a capability for its applications, steps and roles.${state.capL3?` L3 rows show the number of supporting applications; <b style="color:var(--crit)">gap</b> means none. ${L3.length} L3 capabilities, ${L3.filter(x=>!x.apps.length).length} gaps.`:''}</p>

      ${L2.filter(c=>c.parent===l1.id).map(c=>{const hm=heat(state.capLens,c);return `<button class="l2" data-ent="cap:${c.id}" style="background:${hm.bg};color:${hm.fg};opacity:${used&&!used.has(c.id)?.22:1}" title="${esc(c.description)}"><span>${esc(c.name)}</span><small>${L.fmt(hm.v,c)}</small></button>${state.capL3&&L3of[c.id]?`<div class="l3s" style="opacity:${used&&!used.has(c.id)?.22:1}">${L3of[c.id].map(x=>`<button class="l3${x.apps.length?'':' gap'}" data-ent="cap:${x.id}" title="${esc(x.description)}"><span>${esc(x.name)}</span><small>${x.apps.length||'gap'}</small></button>`).join('')}</div>`:''}`}).join('')}
    </section>`).join('')}</div>`;
}

// ---------- Traceability
function related(type,id){
  const S={role:new Set(),step:new Set(),cap:new Set(),app:new Set(),sup:new Set()};
  const addStep=s=>{S.step.add(s);const t=ST[s];[...t.R,t.A,...t.C,...t.I].forEach(r=>S.role.add(r));t.capabilities.forEach(c=>S.cap.add(c));t.apps.forEach(a=>S.app.add(a))};
  const addSupOfApps=()=>[...S.app].forEach(a=>appSups[a].forEach(x=>S.sup.add(x.supplier)));
  if(type==='role'){(roleSteps[id]||[]).forEach(x=>addStep(x.step));S.role=new Set([id]);addSupOfApps()}
  if(type==='step'){addStep(id);addSupOfApps()}
  if(type==='vs'){D.steps.filter(s=>s.vs===id).forEach(s=>addStep(s.id));addSupOfApps()}
  if(type==='cvs'){cvsSteps(id).forEach(s=>addStep(s.id));addSupOfApps()}
  if(type==='si'){const it=D.strategy.initiatives.find(x=>x.id===id);it.journeys.forEach(v=>D.steps.filter(s=>s.vs===v).forEach(s=>{S.step.add(s.id);const t=ST[s.id];[...t.R,t.A].forEach(r=>S.role.add(r))}));it.caps.forEach(c=>S.cap.add(c));it.apps.forEach(a=>S.app.add(a));addSupOfApps()}
  if(type==='cap'){const cid=CAP[id].level===3?CAP[id].parent:id;capSteps[cid].forEach(s=>{S.step.add(s);const t=ST[s];[...t.R,t.A].forEach(r=>S.role.add(r))});(CAP[id].level===3?CAP[id].apps:capApps[cid]).forEach(a=>S.app.add(a));S.cap=new Set([cid]);addSupOfApps()}
  if(type==='app'){appSteps[id].forEach(s=>{S.step.add(s);const t=ST[s];[...t.R,t.A].forEach(r=>S.role.add(r))});AP[id].capabilities.forEach(c=>S.cap.add(c));S.app=new Set([id]);addSupOfApps()}
  if(type==='sup'){(supApps[id]||[]).forEach(x=>S.app.add(x.app));[...S.app].forEach(a=>{AP[a].capabilities.forEach(c=>S.cap.add(c));appSteps[a].forEach(s=>{S.step.add(s);const t=ST[s];[...t.R,t.A].forEach(r=>S.role.add(r))})});S.sup=new Set([id])}
  return S;
}
function traceSuggest(){
  const out=[]; CVS_ORDER.filter(c=>!isXC(c)).slice(0,2).forEach(c=>out.push('cvs:'+c));
  if(FIRST.app) out.push('app:'+FIRST.app);
  const sp=D.suppliers.filter(s=>!s.internal).map(s=>[s.id,(supApps[s.id]||[]).length]).sort((a,b)=>b[1]-a[1])[0]; if(sp) out.push('sup:'+sp[0]);
  const rl=Object.entries(roleSteps).filter(([r])=>r!==CUST).sort((a,b)=>b[1].length-a[1].length)[0]; if(rl) out.push('role:'+rl[0]);
  return out;
}
function trace(){

  $('#view').innerHTML=`<div class="filters"><label style="flex:1;min-width:220px">Focus <input id="tq" list="tlist" placeholder="Type to pick an application, supplier, capability, role or value stream" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:13px var(--f-body);text-transform:none;letter-spacing:0;width:100%"></label>
     <datalist id="tlist">${allEntities().map(e=>`<option value="${esc(e.type)}:${esc(e.id)} | ${esc(e.name)}">`).join('')}</datalist>
     <div class="chips" style="align-self:flex-end">${traceSuggest().map(k=>{const[t,i]=k.split(':');return `<button class="chip" data-trace="${k}">${esc(nameOf(t,i))}</button>`}).join('')}</div></div>

   <div class="trace-wrap"><div class="trace" id="trace"><svg class="lines" id="tlines"></svg>
   ${cols.map(([t,l])=>{const ids=[...S[t]].sort();return `<div class="tcol"><h4>${l} · ${ids.length}</h4>${ids.slice(0,LIM).map(i=>`<button class="tnode ${t===type&&i===id?'focus':''}" data-node="${t}:${i}" data-trace="${t}:${i}"><code>${esc(sub(t,i))}</code>${esc(label(t,i))}</button>`).join('')}${ids.length>LIM?`<div class="tmore">+${ids.length-LIM} more</div>`:''}</div>`}).join('')}
   </div></div>`;
  $('#tq').addEventListener('change',e=>{const k=e.target.value.split(' | ')[0];const[t,i]=k.split(':');if(t&&i&&({si:SI,cvs:CVS,cap:CAP,vs:VS,step:ST,role:RO,app:AP,sup:SU}[t]||{})[i]){state.trace=k;save();trace()}});
  requestAnimationFrame(()=>drawLines(S));
}
function drawLines(S){
  const host=$('#trace'), svg=$('#tlines'); if(!host) return;
  const hb=host.getBoundingClientRect(); const node=k=>host.querySelector(`[data-node="${k}"]`);
  const pt=(el,side)=>{const b=el.getBoundingClientRect();return [side==='r'?b.right-hb.left:b.left-hb.left,b.top-hb.top+b.height/2]};
  const links=[];
  [...S.step].forEach(s=>{const t=ST[s];[...t.R,t.A,...t.C,...t.I].forEach(r=>S.role.has(r)&&links.push(['role:'+r,'step:'+s]));t.capabilities.forEach(c=>S.cap.has(c)&&links.push(['step:'+s,'cap:'+c]))});
  [...S.app].forEach(a=>{AP[a].capabilities.forEach(c=>S.cap.has(c)&&links.push(['cap:'+c,'app:'+a]));appSups[a].forEach(x=>S.sup.has(x.supplier)&&links.push(['app:'+a,'sup:'+x.supplier]))});
  const f=state.trace;
  svg.innerHTML=links.map(([a,b])=>{const ea=node(a),eb=node(b);if(!ea||!eb)return'';const[x1,y1]=pt(ea,'r'),[x2,y2]=pt(eb,'l'),mx=(x1+x2)/2;
    return `<path class="${a===f||b===f?'hot':''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`}).join('');
}
window.addEventListener('resize',()=>{if(state.view==='trace'){const[t,i]=state.trace.split(':');drawLines(related(t,i))}});

// bring a just-opened editor into view and put the cursor in its first field
function edFocus(main,fieldId){
  if(!main) return;
  const head=main.querySelector('.ed-head')||main;
  const go=()=>{try{const rail=document.querySelector('.rail'); let off=12; if(rail&&rail.offsetWidth>innerWidth*0.6){const cs=getComputedStyle(rail); if(cs.position==='sticky'||cs.position==='fixed') off+=rail.offsetHeight}
      const top=head.getBoundingClientRect().top+window.scrollY-off; window.scrollTo({top:Math.max(0,top),behavior:'smooth'})}catch(e){try{head.scrollIntoView()}catch(e2){}}
    const f=document.getElementById(fieldId); if(f){try{f.focus({preventScroll:true})}catch(e){f.focus()} if(!f.value) return; try{f.select()}catch(e){}}
    head.classList.remove('flash'); void head.offsetWidth; head.classList.add('flash')};
  (window.requestAnimationFrame||setTimeout)(go);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-gcat],[data-tax],[data-pmap],[data-land],[data-ifocus],[data-ifam],[data-iall],[data-nav],[data-dec],[data-blens],[data-cvs],[data-cvs-go],[data-view],[data-ent],[data-lens],[data-capl3],[data-vs],[data-af],[data-sort],[data-ssort],[data-trace],[data-trace-go],[data-view-vs],#dclose,#scrim');
  if(!t){ if(!e.target.closest('.search')) $('#results').hidden=true; return }
  if(t.id==='dclose'||t.id==='scrim') return closeDrawer();
  if(t.dataset.nav!==undefined&&t.dataset.nav!==''){closeDrawer();return navTo(t.dataset.nav)}
  if(t.dataset.dec) return openDec(t.dataset.dec);
  if(t.dataset.gcat!==undefined){state.gcat=t.dataset.gcat;save();return glossary()}
  if(t.dataset.tax){closeDrawer();return go(t.dataset.tax)}
  if(t.dataset.resf!==undefined){state.resF=t.dataset.resf;save();return resilience()}
  if(t.dataset.pmap){state.pmapVs=t.dataset.pmap;save();closeDrawer();return go('pmap')}
  if(t.dataset.land){state.landMode=t.dataset.land;save();return landscape()}
  if(t.dataset.ifocus!==undefined){const k=t.dataset.ifocus; if(k&&state.intFocus===k) return openEnt('app',k); state.intFocus=k;save();return integration()}
  if(t.dataset.ifam){state.intFam[t.dataset.ifam]=!state.intFam[t.dataset.ifam];save();return integration()}
  if(t.dataset.iall!==undefined){state.intAll=!state.intAll;save();return integration()}
  if(t.dataset.blens!==undefined){state.progLens=state.progLens===t.dataset.blens?'':t.dataset.blens;save();return programme()}
  if(t.dataset.cvsGo){state.cvs=t.dataset.cvsGo;closeDrawer();return go('processes')}
  if(t.dataset.cvs){state.cvs=t.dataset.cvs;save();return processes()}
  if(t.dataset.view) return go(t.dataset.view);
  if(t.dataset.lens){state.capLens=t.dataset.lens;save();return capabilities()}
  if(t.dataset.capl3!==undefined){state.capL3=t.dataset.capl3==='1';save();return capabilities()}
  if(t.dataset.vs){state.vs=t.dataset.vs;save();return processes()}
  if(t.dataset.sort){const k=t.dataset.sort;state.appSort=[k,state.appSort[0]===k?-state.appSort[1]:1];save();return apps()}
  if(t.dataset.ssort){const k=t.dataset.ssort;state.supSort=[k,state.supSort[0]===k?-state.supSort[1]:-1];save();return suppliers()}
  if(t.dataset.traceGo){state.trace=t.dataset.traceGo;closeDrawer();return go('trace')}
  if(t.dataset.viewVs){state.vs=t.dataset.viewVs;state.cvs=VS[t.dataset.viewVs].parent;closeDrawer();return go('processes')}
  if(t.dataset.trace){
    if(t.dataset.trace===state.trace&&t.classList.contains('tnode')){const[ty,i]=t.dataset.trace.split(':');return openEnt(ty,i)}
    state.trace=t.dataset.trace;save();return trace()}
  if(t.dataset.ent){$('#results').hidden=true;const[ty,i]=t.dataset.ent.split(':');return openEnt(ty,i)}
});
document.addEventListener('input',e=>{if(e.target.id==='gq'){state.gq=e.target.value;glossaryList();return}if(e.target.dataset.syn){state.syn[e.target.dataset.syn]=Math.max(0,Math.min(100,+e.target.value||0));save();synCalc()}});
document.addEventListener('change',e=>{if(e.target.dataset.pmapsel){state.pmapVs=e.target.value;save();return pmap()} if(e.target.dataset.capcvs){state.capCvs=e.target.value;save();return capabilities()} if(e.target.dataset.af!==undefined){state.appF[e.target.dataset.af]=e.target.value;save();apps()}});

// ---------- chrome
$('#banner').innerHTML=`<span>ⓘ</span><div><b>Reference model for ${esc(D.meta.organisation)}</b>, as of ${D.meta.as_of}. Each application and supplier shows its data confidence: ${Object.entries(CONF_VAR).map(([k,v])=>`<span class="conf" style="margin-left:6px"><i style="background:var(${v})"></i>${k}</span>`).join('')}. ${esc(D.meta.disclaimer||'')}</div>`;
$('#brandname').textContent=D.meta.dashboard_title||(ORGS+' Atlas');
$('#verbadge').textContent=`v${D.meta.version} · ${D.meta.release_date}`;
$('#railfoot').innerHTML=D.meta.context.map(c=>`<p style="margin:0 0 8px">${esc(c)}</p>`).join('');
render();
</script>
