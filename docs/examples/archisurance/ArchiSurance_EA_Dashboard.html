     <div class="kpi"><label>Lanes</label><b>${lanes.length}</b><span>roles doing the work</span></div>
     <div class="kpi ${handoffs>=4?'warn':''}"><label>Handoffs</label><b>${handoffs}</b><span>changes of lane between steps</span></div>
     <div class="kpi"><label>Systems touched</label><b>${apps.length}</b><span>${apps.filter(a=>AP[a].time==='Migrate'||AP[a].time==='Eliminate').length} rated Migrate or Eliminate</span></div>
   </div>
   <div class="tbl-wrap" style="padding:0"><svg class="swim" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Swimlane process map for ${esc(v.name)}">
     <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>${g}</svg></div>
   <div class="legend"><span><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--ok)" stroke-width="2"/></svg> Start: ${esc(v.trigger)}</span><span><svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--crit)" stroke-width="3"/></svg> End: ${esc(v.outcome)}</span><span>Lane = first responsible role. "also R" marks other responsible roles. Dot colour on a system = TIME rating. Click any step, role or system for detail.</span></div>`;

// ---------- Integration map
const IFAMS=(P.interface_families||[{name:'Events',match:'kafka|event|stream',var:'--accent'},{name:'Messaging',match:'\\bMQ\\b|JMS|queue',var:'--migrate'},{name:'API',match:'API|REST|SOAP|SCIM|LDAP|Platform|Native',var:'--invest'},{name:'File / batch',match:'File|Manual|Syslog|CDC|SFTP|batch',var:'--c-ill'},{name:'Network / scheme',match:'.',var:'--warn'}]).map(f=>({name:f.name,re:new RegExp(f.match,'i'),var:f.var}));
const IFAM=p=>(IFAMS.find(f=>f.re.test(p||''))||IFAMS[IFAMS.length-1]).name;
const IFAM_VAR=Object.fromEntries(IFAMS.map(f=>[f.name,f.var]));
const LAYERS=(()=>{const L=(P.layers||[]).map(l=>[l[0],[...l[1]]]); if(!L.length) L.push(['Applications',[]]); const known=new Set(L.flatMap(l=>l[1])); D.apps.forEach(a=>{if(!known.has(a.category)){L[L.length-1][1].push(a.category);known.add(a.category)}}); return L.filter(l=>D.apps.some(a=>l[1].includes(a.category)))})();
const layerOf=a=>{const i=LAYERS.findIndex(l=>l[1].includes(AP[a].category));return i<0?LAYERS.length-1:i};
function integration(){
  const fams=Object.keys(IFAM_VAR), off=state.intFam||{};
  const ifs=D.interfaces.filter(i=>!off[IFAM(i.protocol)]);
  const used=new Set(D.interfaces.flatMap(i=>[i.source_app,i.target_app]));
  const apps=D.apps.filter(a=>state.intAll||used.has(a.id)).map(a=>a.id);
  const cols=LAYERS.map((_,i)=>apps.filter(a=>layerOf(a)===i).sort((x,y)=>AP[x].name.localeCompare(AP[y].name)));
  const NW=136,NH=26,GAP=34,CW=160,TOP=40;
  const W=CW*LAYERS.length+10, H=TOP+Math.max(...cols.map(c=>c.length))*GAP+20;
  const pos={}; cols.forEach((c,i)=>c.forEach((a,j)=>pos[a]={x:10+i*CW,y:TOP+j*GAP}));
  const f=state.intFocus&&pos[state.intFocus]?state.intFocus:'';
  const linked=new Set(f?ifs.filter(i=>i.source_app===f||i.target_app===f).flatMap(i=>[i.source_app,i.target_app]):[]);
  let edges='';
  ifs.forEach(i=>{const a=pos[i.source_app],b=pos[i.target_app];if(!a||!b)return;
    const fam=IFAM(i.protocol), hot=f&&(i.source_app===f||i.target_app===f), dim=f&&!hot;
    let x1,x2,y1=a.y+NH/2,y2=b.y+NH/2,d;
    if(b.x>a.x){x1=a.x+NW;x2=b.x;d=`M${x1},${y1} C${x1+40},${y1} ${x2-40},${y2} ${x2},${y2}`}
    else if(b.x<a.x){x1=a.x;x2=b.x+NW;d=`M${x1},${y1} C${x1-40},${y1} ${x2+40},${y2} ${x2},${y2}`}
    else {x1=a.x+NW;x2=b.x+NW;const bulge=x1+30+Math.abs(y2-y1)*0.15;d=`M${x1},${y1} C${bulge},${y1} ${bulge},${y2} ${x2},${y2}`}
    edges+=`<path d="${d}" class="ie ${hot?'hot':''}" style="stroke:var(${IFAM_VAR[fam]});opacity:${dim?0.08:hot?1:0.5}" marker-end="url(#ia-${fams.indexOf(fam)})"><title>${esc(AP[i.source_app].name)} → ${esc(AP[i.target_app].name)}: ${esc(i.data)} (${esc(i.protocol)}, ${esc(i.frequency)})</title></path>`});
  const nodes=apps.map(a=>{const p=pos[a],on=!f||a===f||linked.has(a);return `<g class="in ${a===f?'focus':''}" data-ifocus="${a}" style="opacity:${on?1:0.3}"><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="6"/><circle cx="${p.x+10}" cy="${p.y+NH/2}" r="4" fill="var(--${AP[a].time.toLowerCase()})"/><text x="${p.x+20}" y="${p.y+NH/2+4}">${esc(AP[a].name.length>19?AP[a].name.slice(0,18)+'…':AP[a].name)}</text><title>${esc(AP[a].name)} · ${esc(AP[a].product)}. Click to isolate, click again for detail.</title></g>`}).join('');
  const heads=LAYERS.map((l,i)=>`<text x="${10+i*CW}" y="20" class="ih">${esc(l[0].toUpperCase())}</text>`).join('');
  const markers=fams.map((fm,i)=>`<marker id="ia-${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(${IFAM_VAR[fm]})"/></marker>`).join('');
  const fl=f?D.interfaces.filter(i=>i.source_app===f||i.target_app===f):[];
  const famCount=fm=>D.interfaces.filter(i=>IFAM(i.protocol)===fm).length;
  $('#view').innerHTML=`<div class="filters">${fams.map(fm=>`<button class="chip" data-ifam="${fm}" aria-pressed="${!off[fm]}" style="${off[fm]?'opacity:.45;text-decoration:line-through':''}"><i style="display:inline-block;width:14px;height:3px;border-radius:2px;background:var(${IFAM_VAR[fm]});vertical-align:middle"></i>${fm} <code>${famCount(fm)}</code></button>`).join('')}
     <button class="chip" data-iall="1">${state.intAll?'Hide applications without interfaces':'Show all applications'}</button>${f?`<button class="chip" data-ifocus="">Clear selection</button>`:''}</div>
   <div class="tbl-wrap" style="padding:0"><svg class="imap" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Integration map"><defs>${markers}</defs>${heads}${edges}${nodes}</svg></div>
   ${f?`<section class="panel" style="margin-top:14px"><h2>${esc(AP[f].name)}: ${fl.length} interfaces</h2><p class="sub">${esc(AP[f].product)}. <button class="chip" data-ent="app:${f}">Open application detail</button></p>
     <div class="tbl-wrap"><table><thead><tr><th>Direction</th><th>Other application</th><th>Data</th><th>Type</th><th>Frequency</th></tr></thead><tbody>
     ${fl.map(i=>{const out=i.source_app===f,o=out?i.target_app:i.source_app;return `<tr data-ent="app:${o}"><td class="mono">${out?'Outbound':'Inbound'}</td><td>${esc(AP[o].name)}</td><td style="font-size:12.5px">${esc(i.data)}</td><td><span class="pill" style="color:var(${IFAM_VAR[IFAM(i.protocol)]});background:color-mix(in oklab,var(${IFAM_VAR[IFAM(i.protocol)]}) 12%,var(--surface))">${esc(i.protocol)}</span></td><td class="mono" style="font-size:12px">${esc(i.frequency)}</td></tr>`}).join('')}</tbody></table></div></section>`
   :`<p class="sub muted" style="font-size:12.5px;margin-top:10px">Click an application to isolate its flows; click it again for full detail. Hover a line for what flows over it. Interfaces may be partly illustrative; check their source in the Excel.</p>`}`;
}


// ---------- Resilience
function resilience(){
  const R0=D.resilience.map(r=>({...r,a:AP[r.app],m:r.last_dr_test?months(r.last_dr_test):null}));
  const inh=R0.filter(r=>r.site==='internal'), ven=R0.filter(r=>r.site==='vendor'), thp=R0.filter(r=>r.site!=='internal'&&r.site!=='vendor');
  const bad=r=>/Failed|issues|Not tested/.test(r.dr_result)||(r.m!==null&&-r.m>12);
  const att=R0.filter(bad);
  const critInh=inh.filter(r=>r.a.crit), critOut=[...ven,...thp].filter(r=>r.a.crit);
  const resPill=r=>pill(r.dr_result,r.dr_result==='Passed'?'ok':r.dr_result==='Failed'?'crit':r.dr_result==='Vendor attestation'?'neutral':'warn');
  const site=(title,sub,rows,cls)=>`<div class="site ${cls}"><div class="site-h"><b>${esc(title)}</b><span>${esc(sub)}</span></div><div class="site-n"><b>${rows.length}</b> apps · <b>${rows.filter(r=>r.a.crit).length}</b> ${esc(CRN(rows.filter(r=>r.a.crit).length))}</div><div class="chips">${rows.filter(r=>r.a.tier_n===0).map(r=>chip('app',r.app,r.a.name,false)).join('')}</div></div>`;
  const sev={Failed:0,'Passed with issues':1,'Not tested':2,'Vendor attestation':3,Passed:4};
  const jrows=CVS_ORDER.flatMap(c=>D.value_streams.filter(v=>v.parent===c)).map(v=>{const apps=[...new Set(D.steps.filter(s=>s.vs===v.id).flatMap(s=>s.apps))].map(a=>RES[a]);
    if(!apps.length) return null;
    const worst=apps.reduce((w,r)=>sev[r.dr_result]<sev[w.dr_result]?r:w,apps[0]); const crit=apps.filter(r=>AP[r.app].tier_n<=1), pool=crit.length?crit:apps; const slow=pool.reduce((w,r)=>r.rto_hours>w.rto_hours?r:w,pool[0]);
    return {v,n:apps.length,inh:apps.filter(r=>r.site==='internal').length,out:apps.filter(r=>r.site!=='internal').length,slow,worst}}).filter(Boolean);
  const f=state.resF;
  const list=R0.filter(r=>!f||(f==='site'&&r.site==='internal')||(f==='vendor'&&r.site!=='internal')||(f==='att'&&bad(r))).sort((x,y)=>x.a.tier_n-y.a.tier_n||sev[x.dr_result]-sev[y.dr_result]);
  const kp=(l,v,s,cls,rf)=>`<button class="kpi click ${cls||''}" data-resf="${rf}"><label>${l}</label><b>${v}</b><span>${s}</span><i class="go">→</i></button>`;
  const callout=DCMODEL==='active-passive'&&DCP&&DCS?`<b>Active-passive.</b> ${esc(DCP.name)} runs live and ${esc(DCS.name)} is standby. Losing ${esc(DCP.name)} needs a site failover for every in-house application, so recovery time is set by the failover runbooks and the slowest critical dependency in each journey.`
    :DCMODEL==='active-active'&&DCP&&DCS?`<b>Active-active.</b> ${esc(DCP.name)} and ${esc(DCS.name)} both run live. Losing one site reduces capacity and resilience but in-house applications keep running if they are deployed across both.`
    :DCP?`<b>Single site.</b> In-house applications run in ${esc(DCP.name)} with no second site, so a site loss means restoring from backup.`:`<b>No in-house data centre recorded.</b> Resilience depends on vendors and third parties.`;
  const sitesHtml=DCMODEL==='active-passive'&&DCP&&DCS?`${site(DCP.name,'Primary · live',inh,'live')}<div class="site-arrow"><span>Site failover</span>→</div>${site(DCS.name,'Secondary · standby',inh,'standby')}`
    :DCMODEL==='active-active'&&DCP&&DCS?`${site(DCP.name,'Live',inh,'live')}<div class="site-arrow"><span>Shared load</span>↔</div>${site(DCS.name,'Live',inh,'live')}`
    :`${site(DCP?DCP.name:'In-house',DCP?'Single site':'',inh,'live')}`;
  $('#view').innerHTML=`<div class="callout" style="margin-bottom:16px;border-left-color:var(--accent);background:color-mix(in oklab,var(--accent) 7%,var(--surface))">${callout} ${esc(((P.resilience||{}).note)||'Recovery targets and DR test history are illustrative until replaced with real data.')}</div>
   <div class="grid g-kpi" style="margin-bottom:16px">
     ${kp(DCMODEL==='active-passive'?'Depend on site failover':'Run in own data centres',inh.length,`${critInh.length} support ${CRN(critInh.length)}`,'','site')}
     ${kp(`Outside ${ORGS} data centres`,ven.length+thp.length,`${critOut.length} ${CRN(critOut.length)}; vendor or third-party resilience`,'','vendor')}
     ${kp('Need attention',att.length,'failed, with issues, untested or test over 12 months old','crit','att')}
     ${kp('All applications',R0.length,'clear the filter','', '')}
   </div>
   <section class="panel" style="margin-bottom:16px"><h2>Where the estate runs</h2><p class="sub">Tier 0 applications listed in each location. Click one for detail.</p>
    <div class="sites">${sitesHtml}${site('Vendor and third-party','Resilience managed by suppliers',[...ven,...thp],'ext')}</div></section>
   <section class="panel" style="margin-bottom:16px"><h2>Journey recovery</h2><p class="sub">A journey cannot recover faster than its slowest Tier 0 or Tier 1 application, and is only as tested as its weakest DR result. Click a journey for its process map.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Journey</th><th>${esc(VSL)}</th><th class="num">Apps</th><th class="num">In own DCs</th><th class="num">Outside DCs</th><th>Slowest critical RTO</th><th>Weakest DR result</th></tr></thead><tbody>
    ${jrows.map(j=>`<tr data-pmap="${j.v.id}" style="cursor:pointer"><td><b style="font-weight:600">${esc(j.v.name)}</b></td><td style="font-size:12.5px">${esc(shortCvs(j.v.parent))}</td><td class="num mono">${j.n}</td><td class="num mono">${j.inh}</td><td class="num mono">${j.out}</td><td style="font-size:12.5px"><b class="mono">${j.slow.rto_hours}h</b> ${esc(AP[j.slow.app].name)}</td><td>${resPill(j.worst)} <span style="font-size:12px">${esc(AP[j.worst.app].name)}</span></td></tr>`).join('')}
    </tbody></table></div></section>
   <section><div class="filters" style="align-items:center"><h2 style="font:600 17px var(--f-display);margin:0">Applications</h2><div class="seg" role="group" aria-label="Filter">${[['','All'],['site','Own data centres'],['vendor','Outside DCs'],['att','Needs attention']].map(([k,l])=>`<button data-resf="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div><span class="muted" style="font-size:12.5px">${list.length} shown</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Application</th><th>Tier</th><th>Mode</th><th class="num">RTO</th><th class="num">RPO</th><th>Last DR test</th><th>Result</th></tr></thead><tbody>
    ${list.map(r=>`<tr data-ent="app:${r.app}"><td><b style="font-weight:600">${esc(r.a.name)}</b>${r.a.crit?CRB():''}<div class="muted" style="font-size:12px">${esc(r.a.product)}</div></td><td class="mono">${r.a.tier.replace('Tier ','T')}</td><td style="font-size:12.5px">${esc(r.mode)}</td><td class="num mono">${r.rto_hours}h</td><td class="num mono">${r.rpo_minutes>=60?(r.rpo_minutes/60)+'h':r.rpo_minutes+'m'}</td><td class="mono" style="color:${r.m!==null&&-r.m>12?'var(--crit)':'inherit'}">${r.last_dr_test||'None'}</td><td>${resPill(r)}</td></tr>`).join('')}
    </tbody></table></div></section>`;

// ---------- Taxonomy & glossary
const TAX_COUNT={[VSL]:()=>NVS,'Journey':()=>D.value_streams.length,'Process step':()=>D.steps.length,
 'Process category':()=>3,'Process group':()=>D.business_processes.filter(p=>p.level===1).length,'Process':()=>D.business_processes.filter(p=>p.level===2).length,
 'Capability domain':()=>L1.length,'Capability':()=>L2.length,'Capability (L3)':()=>L3.length,'Role':()=>D.roles.length,'Application':()=>D.apps.length,
 'Platform application':()=>new Set(D.apps.flatMap(a=>(a.runs_on||[]).map(x=>x.app))).size,'Interface':()=>D.interfaces.length,'Data domain':()=>D.data_domains.length,
 'Data centre':()=>D.data_centres.length,'Supplier':()=>D.suppliers.length,'Contract':()=>D.contracts.length,'Licence':()=>D.licences.length,'Support agreement':()=>D.support.length,
 ...(PG?{[PDEC]:()=>(PG.decisions||[]).length,[PG.commitment_label||'Programme commitment']:()=>(PG.commitments||[]).length}:{}),'Scenario':()=>D.example_scenarios.length+ScStore.items.length,'Strategic pillar':()=>D.strategy.pillars.length,'Strategic initiative':()=>D.strategy.initiatives.length,'Regulatory requirement':()=>D.regulations.reduce((t,r)=>t+r.requirements.length,0)};

/* Atlas scenario impact engine. Pure functions over the repository data; nothing here is specific to an organisation.
   Used inline by the dashboard and by node to compute Excel results. */
var ScenarioEngine = (function(){
  var TYPES = {
    app_outage:      {label:'Application outage', target:'app', disruptive:true,  help:'One or more applications become unavailable.'},
    platform_failure:{label:'Platform failure',   target:'platform', disruptive:true, help:'A shared platform fails: hosting, virtualisation, container, messaging, events, API gateway or database.'},
    supplier_failure:{label:'Supplier failure or exit', target:'sup', disruptive:true, help:'A supplier stops providing service, through failure, dispute or forced exit.'},
    dc_loss:         {label:'Data centre loss',   target:'dc', disruptive:true,  help:'A data centre becomes unavailable.'},
    decommission:    {label:'Replace or decommission', target:'app', disruptive:false, help:'Applications are retired or replaced. Shows what must be redesigned, re-integrated and migrated.'},
    price_change:    {label:'Supplier price change', target:'sup', disruptive:false, help:'A supplier changes its prices. Shows the cost effect and what is exposed.'},
    regulatory_change:{label:'Regulatory change', target:'requirement', disruptive:false, help:'A new regulation or rule. Each requirement is mapped to the applications, capabilities and processes that must change.'}
  };
  function platformIds(D){ return D.apps.filter(function(a){return a.platform}).map(function(a){return a.id}) }
  var LIKELIHOOD = ['','Rare','Unlikely','Possible','Likely','Almost certain'];
  var LEVELS = ['Low','Medium','High','Critical'];
  var SIZE_POINTS = {S:1, M:3, L:8};

  function idx(D){
    if (D.__idx) return D.__idx;
    var I = {AP:{},ST:{},VS:{},CVS:{},SU:{},RES:{},LIC:{},SUP:{},K:{}};
    D.apps.forEach(function(a){I.AP[a.id]=a});
    D.steps.forEach(function(s){I.ST[s.id]=s});
    D.value_streams.forEach(function(v){I.VS[v.id]=v});
    D.customer_value_streams.forEach(function(c){I.CVS[c.id]=c});
    D.suppliers.forEach(function(s){I.SU[s.id]=s});
    (D.resilience||[]).forEach(function(r){I.RES[r.app]=r});
    D.licences.forEach(function(l){I.LIC[l.app]=l});
    D.support.forEach(function(s){I.SUP[s.app]=s});
    D.contracts.forEach(function(k){I.K[k.supplier]=k});
    I.appSteps={}; D.apps.forEach(function(a){I.appSteps[a.id]=[]});
    D.steps.forEach(function(s){s.apps.forEach(function(a){I.appSteps[a].push(s.id)})});
    I.appSups={}; D.apps.forEach(function(a){I.appSups[a.id]=[]});
    D.app_supplier.forEach(function(x){I.appSups[x.app].push(x)});
    Object.defineProperty(D,'__idx',{value:I,enumerable:false});
    return I;
  }
  function cost(I,id){return ((I.LIC[id]||{}).annual_cost_m||0)+((I.SUP[id]||{}).annual_support_cost_m||0)}
  function uniq(a){var o=[];a.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});return o}

  function run(D, sc){
    var I = idx(D), T = TYPES[sc.type] || TYPES.app_outage;
    var targets = sc.targets || [];
    var down = {}, degraded = {}, atRisk = {}, changed = {}, notes = [];
    function mark(map, id, why){ if(!I.AP[id]) return false; if(down[id]||changed[id]) return false; if(map===degraded&&(atRisk[id])) {} if(map[id]) return false; map[id]=why; return true; }

    if (sc.type==='app_outage' || sc.type==='platform_failure') {
      targets.forEach(function(id){ mark(down,id,'Directly affected') });
    }
    if (sc.type==='supplier_failure') {
      targets.forEach(function(sid){
        D.app_supplier.filter(function(x){return x.supplier===sid}).forEach(function(x){
          if (/AMS|SI|Integration|Agency/i.test(x.role) && !/Product|In-house|Hosting|Virtualisation|Container|Platform|Scheme/i.test(x.role)) mark(degraded,x.app,(I.SU[sid]||{}).name+' provides '+x.role+'; change and support at risk');
          else mark(down,x.app,(I.SU[sid]||{}).name+' is '+x.role.toLowerCase());
        });
      });
    }
    if (sc.type==='dc_loss') {
      var DCS = D.data_centres||[], model = (D.meta||{}).dc_model||'single';
      var P1 = DCS.filter(function(d){return d.kind==='primary'})[0]||DCS[0], P2 = DCS.filter(function(d){return d.kind==='secondary'})[0]||DCS[1];
      var lostP = P1 && targets.indexOf(P1.id)>=0, lostS = P2 && targets.indexOf(P2.id)>=0;
      D.apps.forEach(function(a){
        if (a.site!=='internal') return;
        if (model==='active-active') {
          if (lostP && lostS) mark(down,a.id,'Both sites lost');
          else if (lostP || lostS) mark(atRisk,a.id,'Runs on one site only until '+(lostP?P1.name:P2.name)+' is restored');
        } else if (model==='active-passive' && P2) {
          if (lostP) mark(down,a.id,'Runs live in '+P1.name+'; needs site failover to '+P2.name);
          else if (lostS) mark(atRisk,a.id,'Loses its '+P2.name+' standby; no site failover available');
        } else if (lostP) mark(down,a.id,'Runs in '+P1.name+'; restore from backup');
      });
      if (model==='active-passive' && P2) {
        if (lostP) notes.push('Active-passive: every in-house application is down until the site failover to '+P2.name+' completes. Recovery time is set by the failover runbook and the slowest critical application.');
        if (lostS && !lostP) notes.push('No immediate outage. '+P1.name+' keeps running, but there is no secondary site until '+P2.name+' is restored, so any failure in that window has no recovery path.');
      } else if (model==='active-active' && (lostP||lostS)) notes.push('Active-active: the remaining site carries the load. Check capacity and that every critical application is deployed on both sites.');
      else if (lostP) notes.push('Single site: in-house applications must be rebuilt and restored from backup elsewhere. Recovery is likely to exceed most recovery targets.');
    }
    if (sc.type==='decommission') {
      targets.forEach(function(id){ if(I.AP[id]) changed[id]='Retired or replaced' });
    }
    if (sc.type==='price_change') {
      targets.forEach(function(sid){
        D.apps.filter(function(a){return a.vendor===sid}).forEach(function(a){ changed[a.id]='Licence and support repriced' });
      });
    }

    // dependency propagation (outage types only)
    if (T.disruptive && sc.type!=='dc_loss') {
      var grew = true, guard = 0;
      while (grew && guard++ < 10) {
        grew = false;
        Object.keys(down).forEach(function(p){
          D.apps.forEach(function(a){
            (a.runs_on||[]).forEach(function(r){ if (r.app===p && mark(down,a.id,'Runs on '+I.AP[p].name)) grew = true; });
          });
          var hosts = ((I.AP[p].platform||{}).hosts)||[];
          if (hosts.length) D.apps.forEach(function(a){
            if (hosts.some(function(h){return (a.hosting||'').indexOf(h)===0}) && a.id!==p && mark(down,a.id,'Hosted on '+I.AP[p].name)) grew = true;
          });
        });
      }
      D.apps.forEach(function(pa){
        var c = (pa.platform||{}).carries; if (!c || !down[pa.id]) return;
        var re = new RegExp(c,'i');
        D.interfaces.forEach(function(i){
          if (re.test(i.protocol)) [i.source_app,i.target_app].forEach(function(x){ mark(degraded,x,'Loses '+pa.name+' flow: '+i.data) });
        });
      });
      D.apps.forEach(function(pa){ var n=(pa.platform||{}).note; if (n && down[pa.id]) notes.push(n); });
      // one hop of interface impact
      D.interfaces.forEach(function(i){
        if (down[i.source_app] && !down[i.target_app]) mark(degraded,i.target_app,'No data from '+I.AP[i.source_app].name+' ('+i.data+')');
        if (down[i.target_app] && !down[i.source_app]) mark(degraded,i.source_app,'Cannot reach '+I.AP[i.target_app].name+' ('+i.data+')');
      });
    }
    if (sc.type==='decommission') {
      D.apps.forEach(function(a){ (a.runs_on||[]).forEach(function(r){ if(changed[r.app]) mark(atRisk,a.id,'Must be re-hosted: runs on '+I.AP[r.app].name) }) });
      D.interfaces.forEach(function(i){
        if (changed[i.source_app] && !changed[i.target_app]) mark(degraded,i.target_app,'Interface to rework: '+i.data);
        if (changed[i.target_app] && !changed[i.source_app]) mark(degraded,i.source_app,'Interface to rework: '+i.data);
      });
    }

    var reqs = [], reqCaps = [], reqProcs = [], effort = 0, reg = null;
    if (sc.type==='regulatory_change') {
      reg = (D.regulations||[]).filter(function(r){return r.id===sc.regulation})[0] || (D.regulations||[])[0];
      if (reg) {
        reqs = reg.requirements.filter(function(q){return !targets.length || targets.indexOf(q.id)>=0});
        reqs.forEach(function(q){
          q.apps.forEach(function(a){ if(!I.AP[a]) return; changed[a] = changed[a] ? changed[a]+'; '+q.id : q.id+' '+q.short });
          reqCaps = reqCaps.concat(q.caps); reqProcs = reqProcs.concat(q.procs); effort += SIZE_POINTS[q.size]||0;
        });
      }
    }
    var primary = Object.keys(down).concat(Object.keys(changed));
    var all = uniq(primary.concat(Object.keys(degraded)).concat(Object.keys(atRisk)));
    var stepsHit = uniq(primary.reduce(function(acc,a){return acc.concat(I.appSteps[a]||[])},[]));
    var stepsDeg = uniq(Object.keys(degraded).concat(Object.keys(atRisk)).reduce(function(acc,a){return acc.concat(I.appSteps[a]||[])},[])).filter(function(s){return stepsHit.indexOf(s)<0});
    var steps = stepsHit.concat(stepsDeg);
    var journeys = uniq(steps.map(function(s){return I.ST[s].vs}));
    var cvs = uniq(journeys.map(function(v){return I.VS[v].parent}));
    var caps = sc.type==='regulatory_change' ? uniq(reqCaps) : uniq(all.reduce(function(acc,a){return acc.concat(I.AP[a].capabilities)},[]));
    var procs = sc.type==='regulatory_change' ? uniq(reqProcs) : D.business_processes.filter(function(b){return b.level===2 && b.apps.some(function(a){return all.indexOf(a)>=0})}).map(function(b){return b.id});
    var roles = uniq(stepsHit.reduce(function(acc,s){var t=I.ST[s];return acc.concat(t.R,[t.A],t.C)},[]));
    var ifs = D.interfaces.filter(function(i){return primary.indexOf(i.source_app)>=0||primary.indexOf(i.target_app)>=0}).map(function(i){return i.id});
    var sups = uniq(all.reduce(function(acc,a){return acc.concat(I.appSups[a].map(function(x){return x.supplier}))},[]));
    var critical = primary.filter(function(a){return I.AP[a].tier_n<=1});
    var rtoPool = (sc.type==='dc_loss'||sc.type==='app_outage'||sc.type==='platform_failure'||sc.type==='supplier_failure') ? primary.filter(function(a){return I.AP[a].tier_n<=1 && I.RES[a]}) : [];
    var slow = rtoPool.reduce(function(w,a){return !w||I.RES[a].rto_hours>I.RES[w].rto_hours?a:w},null);
    var drIssues = primary.filter(function(a){return I.RES[a] && /Failed|issues|Not tested/.test(I.RES[a].dr_result)});
    var costAtStake = primary.reduce(function(t,a){return t+cost(I,a)},0);
    var costDelta = 0;
    if (sc.type==='price_change') costDelta = costAtStake * (Number(sc.pct)||0)/100;
    if (sc.type==='decommission') costDelta = -costAtStake;

    var crit = primary.filter(function(a){return I.AP[a].crit}).length;
    var cifDeg = Object.keys(degraded).concat(Object.keys(atRisk)).filter(function(a){return I.AP[a].crit}).length;
    var tier0 = primary.filter(function(a){return I.AP[a].tier_n===0}).length;
    var vsCount = cvs.filter(function(c){return !(I.CVS[c]||{}).cross_cutting}).length;
    var score, level;
    if (sc.type==='price_change') {
      var total = D.apps.reduce(function(t,a){return t+cost(I,a.id)},0)||1, m = Math.abs(costDelta)/total;
      level = m>=0.05?'Critical':m>=0.025?'High':m>=0.006?'Medium':'Low'; score = Math.round(m*1000);
    } else {
      var tier0Deg = Object.keys(degraded).filter(function(a){return I.AP[a].tier_n===0}).length;
      score = tier0*12 + crit*2 + cifDeg + tier0Deg*3 + vsCount*3 + journeys.length;
      if (sc.type==='dc_loss' && Object.keys(down).length===0) score = Math.round(score/3);
      level = score>=45?'Critical':score>=22?'High':score>=9?'Medium':'Low';
    }
    return {
      type:sc.type, typeLabel:T.label, disruptive:T.disruptive,
      down:down, degraded:degraded, atRisk:atRisk, changed:changed,
      primary:primary, all:all, steps:steps, stepsHit:stepsHit, journeys:journeys, cvs:cvs, caps:caps, procs:procs, roles:roles,
      ifs:ifs, sups:sups, critical:critical, crit:crit, critDegraded:cifDeg, tier0:tier0, valueStreams:vsCount,
      slowestRto: slow ? {app:slow, hours:I.RES[slow].rto_hours} : null, drIssues:drIssues,
      costAtStake:costAtStake, costDelta:costDelta, score:score, level:level, notes:notes,
      reqs:reqs.map(function(q){return q.id}), effort:effort, regulation:reg?reg.id:null
    };
  }
  function riskRating(level, likelihood){
    var l = Number(likelihood)||0, i = LEVELS.indexOf(level)+1;
    var r = l*i; return r>=12?'Critical':r>=8?'High':r>=4?'Medium':'Low';
  }
  return {TYPES:TYPES, platformIds:platformIds, LIKELIHOOD:LIKELIHOOD, LEVELS:LEVELS, run:run, riskRating:riskRating, cost:function(D,id){return cost(idx(D),id)}};
})();

function scKpis(sc,r){

    return k('Requirements',r.reqs.length,`${[...new Set(r.reqs.map(i=>reg.requirements.find(q=>q.id===i).area))].length} areas`)+

  if(sc.type==='price_change') return k('Annual cost change',(r.costDelta>=0?'+':'')+fmtM(Math.abs(r.costDelta)),`on ${fmtM(r.costAtStake)} current spend`,r.costDelta>0?'crit':'')+k('Applications repriced',r.primary.length,`${r.crit} support ${CR.plural}`)+k('Journeys exposed',r.journeys.length,`${r.valueStreams} value streams`)+k('Contract',(()=>{const kk=D.contracts.find(x=>(sc.targets||[]).includes(x.supplier));return kk?kk.end:'n/a'})(),'term end; notice applies');
  if(sc.type==='dc_loss'&&!(sc.targets||[]).includes(DCP?DCP.id:'')) return k('Lose standby',risk,'in-house applications with no failover site','warn')+k(CR.short+'s exposed',r.critDegraded,`no recovery path while ${(sc.targets||[]).map(x=>(D.data_centres.find(d=>d.id===x)||{}).name||x).join(', ')} is down`,'crit')+k('Journeys exposed',r.journeys.length,`${r.valueStreams} value streams`);

function scImpactHTML(sc,r){
  const reg=sc.type==='regulatory_change'?D.regulations.find(x=>x.id===r.regulation):null;

    <div class="grid g-2" style="margin-bottom:16px">

    </div>`;
  }
  // value streams and journeys
  const byCvs=CVS_ORDER.map(c=>({c,js:D.value_streams.filter(v=>v.parent===c&&r.journeys.includes(v.id))})).filter(x=>x.js.length);
  if(byCvs.length) html+=`<section class="panel" style="margin-bottom:16px"><h2>Value streams and journeys</h2><p class="sub">Steps affected out of the journey's total. Click a journey for its process map.</p>
    <div class="sc-vs">${byCvs.map(x=>`<div><h3>${esc(CVS[x.c].name)}</h3>${x.js.map(v=>{const all=D.steps.filter(s=>s.vs===v.id);const hit=all.filter(s=>r.steps.includes(s.id));const dir=all.filter(s=>r.stepsHit.includes(s.id));

  // capabilities / processes / roles
  const capBy={}; r.caps.forEach(c=>{const p=CAP[c].parent;(capBy[p]=capBy[p]||[]).push(c)});
  html+=`<div class="grid g-2" style="margin-bottom:16px"><section class="panel"><h2>Capabilities · ${r.caps.length}</h2><p class="sub">Grouped by capability domain.</p>
    ${L1.filter(l=>capBy[l.id]).map(l=>`<div style="margin-bottom:8px"><div class="mono muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px">${esc(l.name)}</div><div class="chips">${capBy[l.id].map(c=>chip('cap',c,CAP[c].name)).join('')}</div></div>`).join('')}</section>
    <section class="panel"><h2>Processes · ${r.procs.length}</h2><div class="chips" style="margin-bottom:14px">${r.procs.map(p=>chip('bp',p,BP[p].name)).join('')||'<span class="empty">None</span>'}</div>
      <h2>Roles in affected steps · ${r.roles.length}</h2><div class="chips" style="margin-bottom:14px">${r.roles.map(x=>chip('role',x,RO[x].name,false)).join('')||'<span class="empty">None</span>'}</div>
      <h2>Suppliers involved · ${r.sups.length}</h2><div class="chips">${r.sups.map(x=>chip('sup',x,SU[x].name,false)).join('')}</div></section></div>`;
  if(reg&&(reg.sources||[]).length) html+=`<p class="muted" style="font-size:12px">Sources: ${reg.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(' · ')}</p>`;
  return html;
}

// ---------- Save readiness for the What if? and Change impact editors
// Shows, above the Save button, what still has to be filled in, ticks items off as the user works, and on an early
// Save explains what is missing next to the button and takes the user to the first field that needs attention.
function edReady(px,items,noun){
  const el=document.getElementById(px+'-ready'); if(!el) return;
  const todo=items.filter(x=>!x.ok);
  el.classList.toggle('done',!todo.length); if(!todo.length) el.classList.remove('blocked');
  el.innerHTML=!todo.length?`<span class="ed-ok">Ready to save.</span>`
    :`<b>To save this ${noun}:</b><ul>${items.map(x=>`<li class="${x.ok?'ed-ok':'ed-todo'}">${esc(x.label)}</li>`).join('')}</ul>`;
  items.forEach(x=>{if(x.ok){const w=document.getElementById(px+'-f-'+x.f); if(w) w.classList.remove('invalid')}});
  const a=document.getElementById(px+'-formmsg'); if(a&&!todo.length&&a.dataset.kind==='check') a.hidden=true;
}
function edAlert(px,text,kind){const a=document.getElementById(px+'-formmsg'); if(!a) return; a.textContent=text||''; a.dataset.kind=kind||'error'; a.hidden=!text}
function edBlockSave(px,items,noun,focusIds){
  const todo=items.filter(x=>!x.ok); if(!todo.length) return true;
  edReady(px,items,noun);
  const rb=document.getElementById(px+'-ready'); if(rb) rb.classList.add('blocked');
  edAlert(px,`This ${noun} cannot be saved yet. ${todo.map(x=>x.label).join('. ')}.`,'check');
  todo.forEach(x=>{const w=document.getElementById(px+'-f-'+x.f); if(w) w.classList.add('invalid')});
  const w=document.getElementById(px+'-f-'+todo[0].f), f=document.getElementById(focusIds[todo[0].f]);
  try{(w||f).scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}catch(e){}
  if(f) try{f.focus({preventScroll:true})}catch(e){f.focus()}
  return false;
}
// What still has to be filled in before a scenario can be saved, shown above the Save button as the user works.
function scReadyItems(d){
  const reg=d.type==='regulatory_change';
  return [{f:'name',label:'Give the scenario a name',ok:!!String(d.name||'').trim()},

function scCopy(id){
  const sc=scFind(id); if(!sc) return; const r=scRun(sc);
  const lines=[sc.name,`Type: ${(ScenarioEngine.TYPES[sc.type]||{}).label}. Affects: ${scTargetLabel(sc)}.`,
    (ScenarioEngine.TYPES[sc.type]||{}).disruptive?`Impact: ${r.level}${sc.likelihood?`. Likelihood: ${ScenarioEngine.LIKELIHOOD[sc.likelihood]}. Risk: ${ScenarioEngine.riskRating(r.level,sc.likelihood)}`:''}.`:`Change size: ${SC_SIZE[r.level]}.`,
    `Applications directly affected: ${r.primary.length} (${r.crit} support ${CR.plural}). Degraded or at risk: ${Object.keys(r.degraded).length+Object.keys(r.atRisk).length}.`,
    `Journeys: ${r.journeys.map(v=>VS[v].name).join('; ')}.`,

    r.reqs.length?`Requirements in scope: ${r.reqs.length}. Effort points: ${r.effort}.`:'',

    sc.mitigation?`Response: ${sc.mitigation}`:'',`Source: ${D.meta.dashboard_title||ORGS+' Atlas'} reference model; figures are illustrative unless confirmed.`].filter(Boolean).join('\n');
  const done=()=>{ScStore.msg='Summary copied to the clipboard.'; scRefresh(true); setTimeout(()=>{if(ScStore.msg==='Summary copied to the clipboard.'){ScStore.msg='';scRefresh(true)}},2500)};
  try{navigator.clipboard.writeText(lines).then(done,()=>scCopyFallback(lines))}catch(e){scCopyFallback(lines)}

function scCompare(){
  const body=document.getElementById('sc-body'); if(!body) return;
  const all=scAll().map(sc=>({sc,r:scRun(sc)}));
  const dis=all.filter(x=>(ScenarioEngine.TYPES[x.sc.type]||{}).disruptive&&x.sc.likelihood);
  const chg=all.filter(x=>!(ScenarioEngine.TYPES[x.sc.type]||{}).disruptive);
  const L=ScenarioEngine.LEVELS;
  const cell=(lk,lv)=>{const rr=ScenarioEngine.riskRating(lv,lk);const xs=dis.filter(x=>Number(x.sc.likelihood)===lk&&x.r.level===lv);
    const bg={Low:['ok',10],Medium:['warn',12],High:['warn',26],Critical:['crit',24]}[rr];return `<td class="rm-c" style="background:color-mix(in oklab,var(--${bg[0]}) ${bg[1]}%,var(--surface))">${xs.map(x=>`<button class="chip" data-scgo="${esc(x.sc.id)}" title="${esc(x.sc.name)}">${esc(x.sc.name.length>26?x.sc.name.slice(0,25)+'…':x.sc.name)}</button>`).join('')}</td>`};
  body.innerHTML=`<section class="panel" style="margin-bottom:16px"><h2>Risk matrix</h2><p class="sub">Disruption scenarios placed by likelihood and computed impact. Cell colour is the risk rating. Click a scenario to open it.</p>
    <div class="tbl-wrap"><table class="rm"><thead><tr><th style="width:170px">Likelihood</th>${L.map(l=>`<th style="text-align:center">${l}</th>`).join('')}</tr></thead><tbody>
    ${[5,4,3,2,1].map(lk=>`<tr><th style="text-align:left;white-space:nowrap">${lk} · ${ScenarioEngine.LIKELIHOOD[lk]}</th>${L.map(lv=>cell(lk,lv)).join('')}</tr>`).join('')}</tbody></table></div></section>

/* Atlas change impact engine. Traces what a change feature (or an epic) touches across the atlas.
   Pure functions over the repository data; used inline by the dashboard and by node for the Excel. */
var FeatureImpact = (function(){
  var CHANGE_W = {Retire:2, Replace:2, New:1.5, Integrate:1.5, Enhance:1, Configure:0.5};
  var CHANGE_TYPES = ['New','Enhance','Configure','Integrate','Replace','Retire'];
  var TIER_W = [8,5,3,1];
  var STATUS = ['Idea','Discovery','Ready','In delivery','Done'];
  function q2n(q){var m=/^(\d{4})-Q([1-4])$/.exec(q||'');return m?(+m[1])*4+(+m[2]-1):null}
  function dateQ(d){var m=/^(\d{4})-(\d{2})/.exec(d||'');return m?m[1]+'-Q'+(Math.floor((+m[2]-1)/3)+1):null}
  function uniq(a){var o=[];a.forEach(function(x){if(x!=null&&o.indexOf(x)<0)o.push(x)});return o}
  function idx(D){
    if (D.__fidx) return D.__fidx;
    var I={AP:{},ST:{},VS:{},RES:{},K:{},SU:{},REQ:{},BD:{},SI:{},C3:{}};
    D.apps.forEach(function(a){I.AP[a.id]=a});
    D.steps.forEach(function(s){I.ST[s.id]=s});
    D.value_streams.forEach(function(v){I.VS[v.id]=v});
    (D.resilience||[]).forEach(function(r){I.RES[r.app]=r});
    D.contracts.forEach(function(k){I.K[k.supplier]=k});
    D.suppliers.forEach(function(s){I.SU[s.id]=s});
    (D.regulations||[]).forEach(function(r){r.requirements.forEach(function(q){I.REQ[q.id]={q:q,reg:r}})});
    ((D.programme||{}).decisions||[]).forEach(function(b){I.BD[b.id]=b});
    I.PH=((D.programme||{}).phases||[]).filter(function(p){return typeof p==='object'&&p.start}).map(function(p){return [p.name,p.start]});
    I.CUST=(D.meta||{}).customer_role||'';
    I.PROF=(D.meta||{}).profile||{};
    ((D.strategy||{}).initiatives||[]).forEach(function(s){I.SI[s.id]=s});
    (D.capabilities_l3||[]).forEach(function(c){I.C3[c.id]=c});
    I.appSteps={}; D.apps.forEach(function(a){I.appSteps[a.id]=[]});
    D.steps.forEach(function(s){s.apps.forEach(function(a){if(I.appSteps[a])I.appSteps[a].push(s.id)})});
    I.appSups={}; D.apps.forEach(function(a){I.appSups[a.id]=[]});
    D.app_supplier.forEach(function(x){if(I.appSups[x.app])I.appSups[x.app].push(x)});
    Object.defineProperty(D,'__fidx',{value:I,enumerable:false});
    return I;
  }
  function run(D, f, others){

function ftRoadmap(rs){

function ftCanModel(type,id){ // kept for compatibility
  if(!FtStore.canWrite||FT_MODEL_TYPES.indexOf(type)<0) return false;
  const s=ftSeed(type,id); return !!s&&(Object.keys(s.apps).length>0||s.steps.length>0);
}
function ftSeed(type,id){
  const f=ftBlank(), add=(a,c)=>{if(AP[a]&&!f.apps[a]) f.apps[a]=c||'Enhance'};
  if(type==='app'){if(!AP[id])return null; add(id); f.name='Change to '+AP[id].name; f.owner=AP[id].tech_owner||f.owner; f.seededFrom='application '+AP[id].name}
  else if(type==='sup'){if(!SU[id])return null; D.apps.filter(a=>a.vendor===id).forEach(a=>add(a.id)); f.name='Change with '+SU[id].name; f.seededFrom='supplier '+SU[id].name+' (its products)'}
  else if(type==='cap'){const c=CAP[id]; if(!c)return null;
    if(c.level===3){f.caps=[id]; c.apps.forEach(a=>add(a)); f.seededFrom='L3 capability '+c.name}
    else {(capApps[id]||[]).forEach(a=>add(a)); f.seededFrom='capability '+c.name+' (its applications)'}
    f.name='Change to '+c.name}
  else if(type==='step'){const t=ST[id]; if(!t)return null; f.steps=[id]; t.apps.forEach(a=>add(a)); f.name='Change to '+t.name; f.seededFrom='journey step '+t.name}
  else if(type==='vs'){const v=VS[id]; if(!v)return null; const ss=D.steps.filter(x=>x.vs===id); f.steps=ss.map(x=>x.id); ss.forEach(x=>x.apps.forEach(a=>add(a,'Configure'))); f.name='Change to '+v.name; f.seededFrom='journey '+v.name+' (all steps; applications set to Configure)'}
  else if(type==='bp'){const b=BP[id]; if(!b)return null; const kids=D.business_processes.filter(x=>x.parent===id); (b.level===1?[...new Set(kids.flatMap(x=>x.apps))]:b.apps).forEach(a=>add(a)); f.name='Change to '+b.name; f.owner=b.owner; f.seededFrom='process '+b.name+' (its applications)'}
  else if(type==='si'){const i=SI[id]; if(!i)return null; f.drivers=[id]; i.apps.forEach(a=>add(a)); f.name='Deliver '+i.title; f.seededFrom='strategic initiative '+i.title}
  else return null;
  return f;
}
// What if menu: a change (Change impact) or an event (What if? view), depending on the item
function wiOptions(type,id){
  const o=[], seed=ftSeed(type,id), apps=seed?Object.keys(seed.apps):[];

  const canSc=typeof ScStore!=='undefined'&&ScStore.canWrite;
  if(!canSc) return o;
  if(type==='app'){
    const plat=!!AP[id].platform;
    o.push({k:plat?'platform_failure':'app_outage',tag:'Event',t:'It becomes unavailable',d:`Outage: what goes down or degrades, ${CR.plural}, recovery time and DR issues. Opens in What if?`});
    o.push({k:'decommission',tag:'Decision',t:'We retire or replace it',d:'What must be re-hosted, re-integrated and migrated, and the run cost released. Opens in What if?'});

}

// ---------- Regulatory readiness, derived from the change backlog (features that list a requirement as a driver)
const RD_RANK={'Done':1,'On track':2,'Late':3,'Not planned':4};
const RD_CLS={'Done':'ok','On track':'neutral','Late':'warn','Not planned':'crit'};
function rdRegs(){return (D.regulations||[]).filter(r=>r.readiness!==false&&r.requirements.length&&Object.values(r.dates||{}).some(isDate))}
function rdReg(){const rs=rdRegs(); return rs.find(r=>r.id===state.regSel)||rs[0]}
function rdPicker(){const rs=rdRegs(), cur=rdReg(); return `<label style="align-self:flex-end">Regulation <select data-regsel="1">${rs.map(r=>`<option value="${esc(r.id)}" ${r.id===cur.id?'selected':''}>${esc(r.short||r.name)}</option>`).join('')}</select></label>`}
function rdQs(reg){return (reg?[reg]:[]).flatMap(r=>r.requirements.map(q=>Object.assign({reg:r},q)))}
function rdDeadline(q){const d=q.reg.dates||{}; return d[q.deadline]||d[q.reg.main_date||'general']||Object.values(d).filter(isDate).sort().pop()||''}
function rdStatus(q){
  const fs=ftAll().filter(f=>(f.drivers||[]).includes(q.id)), dl=rdDeadline(q);
  if(!fs.length) return {status:'Not planned',fs,dl};
  if(fs.every(f=>f.status==='Done')) return {status:'Done',fs,dl};
  const last=fs.map(f=>f.target).filter(Boolean).sort((a,b)=>FeatureImpact.q2n(a)-FeatureImpact.q2n(b)).pop();
  const dq=dl?FeatureImpact.q2n(dl.slice(0,4)+'-Q'+(Math.floor((+dl.slice(5,7)-1)/3)+1)):null;
  return {status:dq!=null&&last&&FeatureImpact.q2n(last)>dq?'Late':'On track',fs,dl,last};
}
function rdSummary(){const o={total:0,'Done':0,'On track':0,'Late':0,'Not planned':0}; rdQs(rdReg()).forEach(q=>{o.total++;o[rdStatus(q).status]++}); return o}
function rdWorst(qs){let w=null; qs.forEach(q=>{const st=rdStatus(q).status; if(!w||RD_RANK[st]>RD_RANK[w]) w=st}); return w}
function rdCap(id){const qs=rdQs(rdReg()).filter(q=>q.caps.includes(id)); const w=rdWorst(qs); return {n:qs.length,rank:w?RD_RANK[w]:0,status:w||'Not in scope'}}
function rdApp(id){const qs=rdQs(rdReg()).filter(q=>q.apps.includes(id)); const w=rdWorst(qs); return {n:qs.length,status:w||'Not in scope'}}
function rdSec(pred){
  return rdRegs().map(reg=>{const qs=rdQs(reg).filter(pred); if(!qs.length) return '';
  return sec(`${esc(reg.short||reg.name)} requirements · ${qs.length}`,`<div class="tbl-wrap"><table><tbody>${qs.map(q=>{const r=rdStatus(q);
    return `<tr><td><span class="mono muted" style="font-size:11px">${q.id}</span> ${esc(q.short)}<div class="muted" style="font-size:12px">Deadline ${esc(r.dl||'to confirm')}${r.fs.length?' · '+r.fs.map(f=>`<button class="linklike" data-ent="feat:${esc(f.id)}">${esc(f.saved?'modelled':f.id)}</button> ${esc(f.target)}`).join(', '):''}</div></td><td style="text-align:right">${pill(r.status,RD_CLS[r.status])}</td></tr>`}).join('')}</tbody></table></div><p class="muted" style="font-size:12px;margin:6px 0 0">Readiness comes from the change backlog: a requirement is planned when a feature lists it as a driver.</p>`)}).join('');
}

function heat(lensId,c){

   <div class="grid g-2">

     <div class="hbars">${(()=>{const m={};D.licences.forEach(l=>m[l.model]=(m[l.model]||0)+l.annual_cost_m);const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),mx=e[0][1];return e.map(([k,v])=>`<div class="hbar" style="cursor:default"><span class="nm" title="${esc(k)}">${esc(k)}</span><span class="trk"><span class="fil" style="display:block;width:${v/mx*100}%"></span></span><span class="v">${fmtM(v)}</span></div>`).join('')})()}</div>

// ---------- Traceability
function related(type,id){
  const S={role:new Set(),step:new Set(),cap:new Set(),app:new Set(),sup:new Set()};
  const addStep=s=>{S.step.add(s);const t=ST[s];[...t.R,t.A,...t.C,...t.I].forEach(r=>S.role.add(r));t.capabilities.forEach(c=>S.cap.add(c));t.apps.forEach(a=>S.app.add(a))};
  const addSupOfApps=()=>[...S.app].forEach(a=>appSups[a].forEach(x=>S.sup.add(x.supplier)));
  if(type==='role'){(roleSteps[id]||[]).forEach(x=>addStep(x.step));S.role=new Set([id]);addSupOfApps()}
  if(type==='step'){addStep(id);addSupOfApps()}
  if(type==='vs'){D.steps.filter(s=>s.vs===id).forEach(s=>addStep(s.id));addSupOfApps()}
  if(type==='cvs'){cvsSteps(id).forEach(s=>addStep(s.id));addSupOfApps()}
  if(type==='si'){const it=D.strategy.initiatives.find(x=>x.id===id);it.journeys.forEach(v=>D.steps.filter(s=>s.vs===v).forEach(s=>{S.step.add(s.id);const t=ST[s.id];[...t.R,t.A].forEach(r=>S.role.add(r))}));it.caps.forEach(c=>S.cap.add(c));it.apps.forEach(a=>S.app.add(a));addSupOfApps()}
  if(type==='cap'){const cid=CAP[id].level===3?CAP[id].parent:id;capSteps[cid].forEach(s=>{S.step.add(s);const t=ST[s];[...t.R,t.A].forEach(r=>S.role.add(r))});(CAP[id].level===3?CAP[id].apps:capApps[cid]).forEach(a=>S.app.add(a));S.cap=new Set([cid]);addSupOfApps()}
  if(type==='app'){appSteps[id].forEach(s=>{S.step.add(s);const t=ST[s];[...t.R,t.A].forEach(r=>S.role.add(r))});AP[id].capabilities.forEach(c=>S.cap.add(c));S.app=new Set([id]);addSupOfApps()}
  if(type==='sup'){(supApps[id]||[]).forEach(x=>S.app.add(x.app));[...S.app].forEach(a=>{AP[a].capabilities.forEach(c=>S.cap.add(c));appSteps[a].forEach(s=>{S.step.add(s);const t=ST[s];[...t.R,t.A].forEach(r=>S.role.add(r))})});S.sup=new Set([id])}
  return S;
}
function traceSuggest(){
  const out=[]; CVS_ORDER.filter(c=>!isXC(c)).slice(0,2).forEach(c=>out.push('cvs:'+c));
  if(FIRST.app) out.push('app:'+FIRST.app);
  const sp=D.suppliers.filter(s=>!s.internal).map(s=>[s.id,(supApps[s.id]||[]).length]).sort((a,b)=>b[1]-a[1])[0]; if(sp) out.push('sup:'+sp[0]);
  const rl=Object.entries(roleSteps).filter(([r])=>r!==CUST).sort((a,b)=>b[1].length-a[1].length)[0]; if(rl) out.push('role:'+rl[0]);
  return out;
}

function drawLines(S){
  const host=$('#trace'), svg=$('#tlines'); if(!host) return;
  const hb=host.getBoundingClientRect(); const node=k=>host.querySelector(`[data-node="${k}"]`);
  const pt=(el,side)=>{const b=el.getBoundingClientRect();return [side==='r'?b.right-hb.left:b.left-hb.left,b.top-hb.top+b.height/2]};
  const links=[];
  [...S.step].forEach(s=>{const t=ST[s];[...t.R,t.A,...t.C,...t.I].forEach(r=>S.role.has(r)&&links.push(['role:'+r,'step:'+s]));t.capabilities.forEach(c=>S.cap.has(c)&&links.push(['step:'+s,'cap:'+c]))});
  [...S.app].forEach(a=>{AP[a].capabilities.forEach(c=>S.cap.has(c)&&links.push(['cap:'+c,'app:'+a]));appSups[a].forEach(x=>S.sup.has(x.supplier)&&links.push(['app:'+a,'sup:'+x.supplier]))});
  const f=state.trace;
  svg.innerHTML=links.map(([a,b])=>{const ea=node(a),eb=node(b);if(!ea||!eb)return'';const[x1,y1]=pt(ea,'r'),[x2,y2]=pt(eb,'l'),mx=(x1+x2)/2;

}

  if(type==='cvs'){const c=CVS[id],f=cvsFoot(id);k=VSL+' · '+id;title=c.name;
    head=`<div class="chips">${conf(/^Customer-provided/.test(c.source)?'Customer-provided':c.source==='Public'?'Public':'Illustrative')}</div>`;
    body=dl([['Scope',esc(c.scope)],['Owner',chip('role',c.owner,RO[c.owner].name,false)],['Footprint',`${f.steps.length} steps · ${f.apps.length} apps · ${f.caps.length} capabilities · ${f.roles.length} roles`],['App run cost',fmtM(f.cost)+' (illustrative)'],['Source',c.ref?`<a href="${esc(c.ref)}" target="_blank" rel="noopener">${esc(c.ref_title||c.source||'Source')}</a>`:esc(c.source||'EA grouping')]])
     +sec('Journeys',`<div class="chips">${f.journeys.map(v=>chip('vs',v.id,v.name)).join('')}</div>`)
     +sec('Applications',appChips(f.apps))
     +sec('Capabilities',`<div class="chips">${f.caps.sort().map(c=>chip('cap',c,CAP[c].name)).join('')}</div>`)
     +`<div><button class="btn" data-cvs-go="${id}">Open in Value streams</button></div>`;
  }
  if(type==='vs'){const v=VS[id];k='Journey · '+id;title=v.name;
    head=`<div class="chips">${chip('cvs',v.parent,CVS[v.parent].name,false)}</div>`;
    body=dl([['Process owner',chip('role',v.owner,RO[v.owner].name,false)],['Trigger',esc(v.trigger)],['Outcome',esc(v.outcome)]])+sec('Steps',stepChips(D.steps.filter(s=>s.vs===id).map(s=>s.id)))
     +`<div class="chips"><button class="btn" data-pmap="${id}">Open process map</button><button class="btn ghost" data-view-vs="${id}">Open journey</button></div>`;
  }
  if(type==='role'){const r=RO[id];k='Role · '+id;title=r.name;
    const rs=roleSteps[id]||[]; const apps=[...new Set(rs.filter(x=>x.raci!=='I').flatMap(x=>ST[x.step].apps))];
    head=`<div class="chips"><span class="pill s-neutral">${esc(r.unit)}</span><span class="pill s-neutral">${esc(r.family)}</span></div>`;
    body=sec(`Process involvement · ${rs.length} steps`,rs.length?`<div class="tbl-wrap"><table><tbody>${rs.map(x=>`<tr data-ent="step:${x.step}"><td><span class="raci ${x.raci}">${x.raci}</span></td><td>${esc(ST[x.step].name)}<div class="muted" style="font-size:12px">${esc(VS[ST[x.step].vs].name)}</div></td></tr>`).join('')}</tbody></table></div>`:(D.business_processes.some(b=>b.owner===id||(b.roles||[]).includes(id))||D.apps.some(a=>a.tech_owner===id||a.business_owner===id))?'<p class="muted">Not part of customer journey RACI. See the business processes and applications below.</p>':'<p class="empty">No process steps mapped. Candidate for review.</p>')
     +(apps.length?sec('Applications used',appChips(apps)):'')
     +sec('Business processes',(()=>{const o=D.business_processes.filter(b=>b.owner===id),p=D.business_processes.filter(b=>(b.roles||[]).includes(id)&&b.owner!==id);return (o.length||p.length)?`<div class="chips">${o.map(b=>`<button class="chip" data-ent="bp:${b.id}"><span class="raci A">O</span>${esc(b.name)}</button>`).join('')}${p.map(b=>chip('bp',b.id,b.name)).join('')}</div><p class="muted" style="font-size:12px;margin:6px 0 0">O marks processes this role owns.</p>`:'<p class="empty">No business processes mapped.</p>'})())
     +sec('Applications owned (business)',appChips(D.apps.filter(a=>a.business_owner===id).map(a=>a.id)))
     +sec('Applications owned (technology)',appChips(D.apps.filter(a=>a.tech_owner===id).map(a=>a.id)))
     +(()=>{const rows=ftFeaturesFor(f=>f.owner===id);return rows?sec('Change features owned',`<div class="tbl-wrap"><table><tbody>${rows}</tbody></table></div>`):''})();
  }
  if(type==='sup'){const s=SU[id],kk=contractOf(id),apps=supApps[id]||[];k='Supplier · '+id;title=s.name;
    const caps=supCaps(id), steps=supSteps(id), vss=[...new Set(steps.map(x=>ST[x].vs))];
    head=`<div class="chips"><span class="pill s-neutral">${esc(s.tier)}</span>${pill('Risk: '+s.risk,s.risk==='High'?'crit':s.risk==='Medium'?'warn':'ok')}${s.material?pill(TPR.material_label,'warn'):''}${conf(s.confidence)}</div>`;
    body=dl([['Type',esc(s.type)],['HQ / delivery',esc(s.hq)+' · '+esc(s.location)],['Exit plan',esc(s.exit_plan)],['Annual spend (primary)',fmtM(supSpend(id))],['Source',esc(s.source)+(s.ref?` · <a href="${esc(s.ref)}" target="_blank" rel="noopener">reference</a>`:'')]])
     +(kk?sec('Contract',dl([['Reference',kk.id],['Term',`${kk.start} → ${kk.end}`],['Notice',kk.notice_months+' months'],['Auto-renew',kk.auto_renew?'Yes':'No'],['Change of control',kk.change_of_control_clause?pill('Clause present','warn'):'No'],[esc(TPR.terms_label),esc(kk.regulatory_terms)],['Annual value',fmtM(kk.annual_value||0)]])):'')
     +sec(`Applications · ${apps.length}`,apps.length?`<div class="chips">${apps.map(x=>`<button class="chip" data-ent="app:${x.app}">${esc(AP[x.app].name)} <code>${esc(x.role)}</code></button>`).join('')}</div>`:'<p class="empty">No applications mapped.</p>')
     +(apps.length?`<div class="callout"><b>If ${esc(s.name)} were unavailable:</b> ${caps.length} capabilities, ${steps.length} process steps across ${vss.length} value streams would be affected.</div>`:'')
     +sec('Value streams affected',vss.length?`<div class="chips">${vss.map(v=>chip('vs',v,VS[v].name,false)).join('')}</div>`:'')
     +sec('Capabilities dependent',caps.length?`<div class="chips">${caps.map(c=>chip('cap',c,CAP[c].name)).join('')}</div>`:'');
  }
  $('#drawer').innerHTML=`<header><div class="t"><div class="k">${esc(k)}</div><h2>${esc(title)}</h2>${head}</div><button class="x" id="dclose" aria-label="Close">✕</button></header><div class="body">${body}${traceBtn}</div>`;
  $('#drawer').hidden=false; $('#scrim').hidden=false; $('#drawer').querySelector('.body').scrollTop=0; $('#dclose').focus();
}
// bring a just-opened editor into view and put the cursor in its first field
function edFocus(main,fieldId){
  if(!main) return;
  const head=main.querySelector('.ed-head')||main;
  const go=()=>{try{const rail=document.querySelector('.rail'); let off=12; if(rail&&rail.offsetWidth>innerWidth*0.6){const cs=getComputedStyle(rail); if(cs.position==='sticky'||cs.position==='fixed') off+=rail.offsetHeight}
      const top=head.getBoundingClientRect().top+window.scrollY-off; window.scrollTo({top:Math.max(0,top),behavior:'smooth'})}catch(e){try{head.scrollIntoView()}catch(e2){}}
    const f=document.getElementById(fieldId); if(f){try{f.focus({preventScroll:true})}catch(e){f.focus()} if(!f.value) return; try{f.select()}catch(e){}}
    head.classList.remove('flash'); void head.offsetWidth; head.classList.add('flash')};
  (window.requestAnimationFrame||setTimeout)(go);
}
function closeDrawer(){$('#drawer').hidden=true;$('#scrim').hidden=true}

// ---------- search
function allEntities(){return [
  ...D.apps.map(a=>({type:'app',id:a.id,name:a.name,extra:a.product+' '+SU[a.vendor].name})),
  ...D.suppliers.map(s=>({type:'sup',id:s.id,name:s.name,extra:s.type})),
  ...L2.map(c=>({type:'cap',id:c.id,name:c.name,extra:c.description})),
  ...(D.features||[]).map(f=>({type:'feat',id:f.id,name:f.name,extra:'Change feature · '+f.description})),
  ...(D.epics||[]).map(e=>({type:'epic',id:e.id,name:e.name,extra:'Epic · '+e.summary})),
  ...L3.map(c=>({type:'cap',id:c.id,name:c.name,extra:'L3 · '+CAP[c.parent].name+' · '+c.description})),
  ...D.roles.map(r=>({type:'role',id:r.id,name:r.name,extra:r.unit})),
  ...D.strategy.initiatives.map(i=>({type:'si',id:i.id,name:i.title,extra:i.evidence+' '+D.strategy.pillars.find(p=>p.id===i.pillar).name})),
  ...D.glossary.map(g=>({type:'term',id:g.id,name:g.term,extra:g.category+' '+g.definition})),
  ...D.business_processes.map(b=>({type:'bp',id:b.id,name:b.name,extra:b.category+' process'})),
  ...D.customer_value_streams.map(c=>({type:'cvs',id:c.id,name:c.name,extra:c.scope})),
  ...D.value_streams.map(v=>({type:'vs',id:v.id,name:v.name,extra:CVS[v.parent].name})),
  ...D.steps.map(s=>({type:'step',id:s.id,name:s.name,extra:VS[s.vs].name}))]}
const ENT=allEntities(), TYPE_LABEL={feat:'Feature',epic:'Epic',si:'Initiative',term:'Glossary',bp:'Process',app:'App',sup:'Supplier',cap:'Capability',role:'Role',cvs:'Value stream',vs:'Journey',step:'Step'};
$('#q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(); const r=$('#results');
  if(q.length<2){r.hidden=true;return}
  const m=ENT.filter(x=>(x.id+' '+x.name+' '+x.extra).toLowerCase().includes(q)).slice(0,14);
  r.innerHTML=m.length?m.map(x=>`<button data-ent="${x.type}:${x.id}"><em>${TYPE_LABEL[x.type]}</em><span>${esc(x.name)} <span class="muted mono">${x.id}</span></span></button>`).join(''):'<div style="padding:10px 12px" class="muted">No matches. Try a vendor or product name.</div>';
  r.hidden=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('#results').hidden=true}});

// ---------- delegation
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-gcat],[data-tax],[data-pmap],[data-land],[data-ifocus],[data-ifam],[data-iall],[data-nav],[data-dec],[data-blens],[data-cvs],[data-cvs-go],[data-view],[data-ent],[data-lens],[data-capl3],[data-vs],[data-af],[data-sort],[data-ssort],[data-trace],[data-trace-go],[data-view-vs],#dclose,#scrim');
  if(!t){ if(!e.target.closest('.search')) $('#results').hidden=true; return }
  if(t.id==='dclose'||t.id==='scrim') return closeDrawer();
  if(t.dataset.nav!==undefined&&t.dataset.nav!==''){closeDrawer();return navTo(t.dataset.nav)}
  if(t.dataset.dec) return openDec(t.dataset.dec);
  if(t.dataset.gcat!==undefined){state.gcat=t.dataset.gcat;save();return glossary()}
  if(t.dataset.tax){closeDrawer();return go(t.dataset.tax)}
  if(t.dataset.resf!==undefined){state.resF=t.dataset.resf;save();return resilience()}
  if(t.dataset.pmap){state.pmapVs=t.dataset.pmap;save();closeDrawer();return go('pmap')}
  if(t.dataset.land){state.landMode=t.dataset.land;save();return landscape()}
  if(t.dataset.ifocus!==undefined){const k=t.dataset.ifocus; if(k&&state.intFocus===k) return openEnt('app',k); state.intFocus=k;save();return integration()}
  if(t.dataset.ifam){state.intFam[t.dataset.ifam]=!state.intFam[t.dataset.ifam];save();return integration()}
  if(t.dataset.iall!==undefined){state.intAll=!state.intAll;save();return integration()}
  if(t.dataset.blens!==undefined){state.progLens=state.progLens===t.dataset.blens?'':t.dataset.blens;save();return programme()}
  if(t.dataset.cvsGo){state.cvs=t.dataset.cvsGo;closeDrawer();return go('processes')}
  if(t.dataset.cvs){state.cvs=t.dataset.cvs;save();return processes()}
  if(t.dataset.view) return go(t.dataset.view);
  if(t.dataset.lens){state.capLens=t.dataset.lens;save();return capabilities()}
  if(t.dataset.capl3!==undefined){state.capL3=t.dataset.capl3==='1';save();return capabilities()}
  if(t.dataset.vs){state.vs=t.dataset.vs;save();return processes()}
  if(t.dataset.sort){const k=t.dataset.sort;state.appSort=[k,state.appSort[0]===k?-state.appSort[1]:1];save();return apps()}
  if(t.dataset.ssort){const k=t.dataset.ssort;state.supSort=[k,state.supSort[0]===k?-state.supSort[1]:-1];save();return suppliers()}
  if(t.dataset.traceGo){state.trace=t.dataset.traceGo;closeDrawer();return go('trace')}
  if(t.dataset.viewVs){state.vs=t.dataset.viewVs;state.cvs=VS[t.dataset.viewVs].parent;closeDrawer();return go('processes')}
  if(t.dataset.trace){
    if(t.dataset.trace===state.trace&&t.classList.contains('tnode')){const[ty,i]=t.dataset.trace.split(':');return openEnt(ty,i)}
    state.trace=t.dataset.trace;save();return trace()}
  if(t.dataset.ent){$('#results').hidden=true;const[ty,i]=t.dataset.ent.split(':');return openEnt(ty,i)}
});
document.addEventListener('input',e=>{if(e.target.id==='gq'){state.gq=e.target.value;glossaryList();return}if(e.target.dataset.syn){state.syn[e.target.dataset.syn]=Math.max(0,Math.min(100,+e.target.value||0));save();synCalc()}});
document.addEventListener('change',e=>{if(e.target.dataset.pmapsel){state.pmapVs=e.target.value;save();return pmap()} if(e.target.dataset.capcvs){state.capCvs=e.target.value;save();return capabilities()} if(e.target.dataset.af!==undefined){state.appF[e.target.dataset.af]=e.target.value;save();apps()}});

// ---------- chrome
$('#banner').innerHTML=`<span>ⓘ</span><div><b>Reference model for ${esc(D.meta.organisation)}</b>, as of ${D.meta.as_of}. Each application and supplier shows its data confidence: ${Object.entries(CONF_VAR).map(([k,v])=>`<span class="conf" style="margin-left:6px"><i style="background:var(${v})"></i>${k}</span>`).join('')}. ${esc(D.meta.disclaimer||'')}</div>`;
$('#brandname').textContent=D.meta.dashboard_title||(ORGS+' Atlas');
$('#verbadge').textContent=`v${D.meta.version} · ${D.meta.release_date}`;
$('#railfoot').innerHTML=D.meta.context.map(c=>`<p style="margin:0 0 8px">${esc(c)}</p>`).join('');
render();
</script>
