<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>ArchiSurance Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of views + working canvas; a right-hand detail drawer opens for any entity so every view stays one click from traceability. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8FAFC; --ink:#152030; --muted:#5B6879; --line:#DCE2EA;
  --accent:#0D6E6A; --accent-ink:#FFFFFF; --accent-soft:#DDF1EF;
  --invest:#2D7A4E; --tolerate:#A86F12; --migrate:#3C5AA8; --eliminate:#B53A3A;
  --ok:#2D7A4E; --warn:#A86F12; --crit:#B53A3A;
  --c-cust:#2D7A4E; --c-pub:#3C5AA8; --c-part:#A86F12; --c-ill:#7A8595;
  --r:#0D6E6A; --a:#152030; --c:#3C5AA8; --i:#7A8595;
  --shadow:0 8px 30px rgba(21,32,48,.12); --moon:inline; --sun:none;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#151C26; --surface-2:#1A2230; --ink:#E5EAF1; --muted:#98A4B4; --line:#2A3443;
  --accent:#4DBDB5; --accent-ink:#0E131A; --accent-soft:#163331;
  --invest:#5DBB84; --tolerate:#E2A94B; --migrate:#8299E3; --eliminate:#E46F6F;
  --ok:#5DBB84; --warn:#E2A94B; --crit:#E46F6F;
  --c-cust:#5DBB84; --c-pub:#8299E3; --c-part:#E2A94B; --c-ill:#8C97A8;
  --r:#4DBDB5; --a:#E5EAF1; --c:#8299E3; --i:#8C97A8;
  --shadow:0 8px 30px rgba(0,0,0,.45); --moon:none; --sun:inline; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C26; --surface-2:#1A2230; --ink:#E5EAF1; --muted:#98A4B4; --line:#2A3443;
  --accent:#4DBDB5; --accent-ink:#0E131A; --accent-soft:#163331;
  --invest:#5DBB84; --tolerate:#E2A94B; --migrate:#8299E3; --eliminate:#E46F6F;
  --ok:#5DBB84; --warn:#E2A94B; --crit:#E46F6F;
  --c-cust:#5DBB84; --c-pub:#8299E3; --c-part:#E2A94B; --c-ill:#8C97A8;
  --r:#4DBDB5; --a:#E5EAF1; --c:#8299E3; --i:#8C97A8;
  --shadow:0 8px 30px rgba(0,0,0,.45); --moon:none; --sun:inline; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.app{transition:grid-template-columns .18s ease}
.rail{position:relative}
.rail-toggle{all:unset;cursor:pointer;position:absolute;top:14px;right:10px;display:flex;align-items:center;gap:4px;padding:5px 7px;border-radius:7px;color:var(--muted);font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;z-index:2}
.rail-toggle .rt-l{display:none}
.rail-toggle:hover .rt-l,.rail-toggle:focus-visible .rt-l{display:inline}
.rail-toggle:hover,.rail-toggle:focus-visible{background:var(--surface-2);color:var(--ink)}
.rail-toggle:focus-visible,.rail-mini:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rail-mini{display:none}
.app.rail-collapsed{grid-template-columns:52px minmax(0,1fr)}
.app.rail-collapsed .rail{padding:14px 6px;overflow:hidden}
.app.rail-collapsed .brand,.app.rail-collapsed .nav,.app.rail-collapsed .rail-foot{display:none}
.app.rail-collapsed .rail-toggle{position:static;justify-content:center;padding:8px 0;width:100%}
.app.rail-collapsed .rail-toggle svg{transform:rotate(180deg)}
.app.rail-collapsed .rail-toggle .rt-l{display:none}
.app.rail-collapsed .rail-mini{all:unset;cursor:pointer;display:flex;flex:1;justify-content:center;align-items:flex-start;padding-top:10px;border-radius:8px;color:var(--muted);font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.12em}
.app.rail-collapsed .rail-mini span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.app.rail-collapsed .rail-mini:hover{background:var(--surface-2);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.app{transition:none}}
/* rail */
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{font:700 19px/1.1 var(--f-display);letter-spacing:-.01em}
.brand span{font:500 11px/1.3 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 8px 4px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:7px;color:var(--ink);font-weight:500}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.nav button small{font:500 11px var(--f-mono);color:var(--muted)}
.rail-foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 6px;line-height:1.45}
/* main */
main{padding-block:22px 60px;padding-inline:28px;min-width:0}
.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:700 clamp(22px,3vw,30px)/1.1 var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.search{position:relative;width:min(360px,100%)}
.top-tools{display:flex;gap:8px;align-items:center;width:min(410px,100%)}
.top-tools .search{flex:1;width:auto;min-width:0}
.theme-btn{all:unset;cursor:pointer;flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.theme-btn:hover{color:var(--accent);border-color:var(--accent)}
.theme-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme-btn .i-moon{display:var(--moon)} .theme-btn .i-sun{display:var(--sun)}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow:auto}
.results button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:8px 12px;width:100%;box-sizing:border-box}
.results button:hover,.results button:focus{background:var(--surface-2)}
.results em{font:500 10.5px var(--f-mono);color:var(--muted);font-style:normal;min-width:62px;text-transform:uppercase}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:12.5px;margin-bottom:18px}
.banner b{color:var(--ink)}
/* generic */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile-bar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:-6px 0 6px;font-size:12px}
.tile-bar[hidden]{display:none}
#kpi-grid .kpi{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#kpi-grid .kpi.dragging{opacity:.5;border:1px dashed var(--accent);pointer-events:none;transform:scale(.98)}
body.tile-dragging,body.tile-dragging *{cursor:grabbing!important}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{font:600 15px/1.3 var(--f-display);margin:0 0 4px;letter-spacing:-.005em}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi label{display:block;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{display:block;font:700 28px/1.15 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.warn b{color:var(--warn)} .kpi.crit b{color:var(--crit)}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font:500 11.5px/1.7 var(--f-body);white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-Invest{color:var(--invest);background:color-mix(in oklab,var(--invest) 12%,var(--surface))}
.t-Tolerate{color:var(--tolerate);background:color-mix(in oklab,var(--tolerate) 13%,var(--surface))}
.t-Migrate{color:var(--migrate);background:color-mix(in oklab,var(--migrate) 12%,var(--surface))}
.t-Eliminate{color:var(--eliminate);background:color-mix(in oklab,var(--eliminate) 12%,var(--surface))}
.s-ok{color:var(--ok);background:color-mix(in oklab,var(--ok) 12%,var(--surface))}
.s-warn{color:var(--warn);background:color-mix(in oklab,var(--warn) 13%,var(--surface))}
.s-crit{color:var(--crit);background:color-mix(in oklab,var(--crit) 12%,var(--surface))}
.s-neutral{color:var(--muted);background:var(--surface-2)}
.conf{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--f-mono);white-space:nowrap}
.conf i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;padding:3px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:12.5px;line-height:1.4;max-width:100%}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip code{font:500 10.5px var(--f-mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
th[data-sort]{cursor:pointer} th[data-sort]:hover{color:var(--ink)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr[data-ent]{cursor:pointer}
tbody tr[data-ent]:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
.filters label{display:flex;flex-direction:column;gap:3px;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.filters select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:13px var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:12.5px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* stacked bar */
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.stack span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
/* attention list */
.att{display:flex;flex-direction:column}
.att > div{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.att > div:last-child{border-bottom:0}
.att .stripe{align-self:stretch;border-radius:2px}
.att .what{min-width:0}
.att .what b{font-weight:600}
.att .what div{font-size:12px;color:var(--muted)}
/* capability map */
.capmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.l1{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.l1 header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:2px 4px 6px}
.l1 header b{font:600 13.5px/1.25 var(--f-display)}
.l1 header code{font:500 10.5px var(--f-mono);color:var(--muted)}
.l2{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 9px;border-radius:7px;font-size:12.5px;line-height:1.3;border:1px solid transparent}
.l2:hover{border-color:var(--ink)}
.l3s{display:flex;flex-direction:column;gap:2px;margin:-2px 0 4px 10px;padding-left:8px;border-left:2px solid var(--line)}
.l3{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 6px;border-radius:5px;font-size:11.5px;line-height:1.3;color:var(--ink)}
.l3:hover,.l3:focus-visible{background:color-mix(in oklab,var(--accent) 10%,var(--surface))}
.l3 small{font:500 10.5px var(--f-mono);color:var(--muted)}
.l3.gap small{color:var(--crit);font-weight:600}
.gd-hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.gd-h{font:600 15px/1.3 var(--f-display);margin:22px 0 10px}
.gd-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gd-card h4{margin:8px 0 6px;font:600 14px var(--f-display)}
.gd-card p{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.5}
.gd-card code,.panel dd code{font:500 11.5px var(--f-mono);background:var(--surface-2);padding:2px 6px;border-radius:5px;word-break:break-all}
.gd-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--surface);font:600 12px var(--f-mono);flex:none}
.gd-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.gd-flow li{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative}
.gd-flow b{font:600 13.5px var(--f-display)}
.gd-flow p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.gd-asks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}
.gd-ask{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:13px;line-height:1.45}
.gd-ask:hover,.gd-ask:focus-visible{border-color:var(--accent)}
.gd-ask small{font:500 10.5px var(--f-mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.gd-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
.gd-dl{margin:0;display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:8px 14px;font-size:13px;line-height:1.5}
.gd-dl dt{font-weight:600}
.gd-dl dd{margin:0;color:var(--muted)}
@media (max-width:560px){.gd-dl{grid-template-columns:1fr}.gd-dl dd{margin-bottom:6px}}
.ft-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.ft-kpis .kpi b{font-size:22px}
.ft-kpis .kpi span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ft-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.ft-h{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 6px}
.ft-ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.ft-flags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ft-flag{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13px;line-height:1.5;padding:7px 10px;border-radius:8px;background:var(--surface-2)}
.ft-flag.crit{background:color-mix(in oklab,var(--crit) 10%,var(--surface))}
.ft-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0;text-transform:none;letter-spacing:0;font:13px var(--f-body);color:var(--ink)}
.ft-row > span{flex:1;min-width:140px}
.ft-row select{font:13px var(--f-body);padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.ft-row select#ft-addapps,.ft-row select#ft-addcaps,.ft-row select#ft-addsteps,.ft-row select#ft-adddrivers,.ft-row select#ft-adddepends{flex:1;min-width:200px}
.ft-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
.ft-four{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px}
.ft-road td{vertical-align:top;min-width:86px}
.ft-road td:first-child{min-width:200px}
.ft-pill{all:unset;cursor:pointer;display:inline-block;margin:2px;padding:2px 7px;border-radius:6px;font:600 11px var(--f-mono);border:1px solid var(--line);background:var(--surface)}
.ft-pill:focus-visible{outline:2px solid var(--accent)}
.lv-low{border-left:4px solid var(--ok)} .lv-medium{border-left:4px solid var(--muted)} .lv-high{border-left:4px solid var(--warn)} .lv-critical{border-left:4px solid var(--crit)}
.ft-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.d-low{background:var(--ok)} .d-medium{background:var(--muted)} .d-high{background:var(--warn)} .d-critical{background:var(--crit)}
.sc-f .chips,.sc-f .ft-row,.sc-f .empty{text-transform:none;letter-spacing:0;font:13px var(--f-body);color:var(--ink)}
.ft-row select{width:auto!important}
.ft-row select[id^="ft-add"]:not(#ft-addch){flex:1;min-width:200px}
@media (max-width:820px){#ft-body .sc-main{order:-1} #ft-body .sc-list{max-height:360px}}
.linklike{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.linklike:focus-visible{outline:2px solid var(--accent)}
.drawer-actions{display:flex;gap:8px;flex-wrap:wrap}
.wi-menu{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.wi-menu .k{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wi-opt{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.wi-opt:hover,.wi-opt:focus-visible{border-color:var(--accent)}
.wi-opt b{font:600 13px var(--f-body)} .wi-opt span{grid-column:2;font-size:12px;color:var(--muted)}
.wi-opt i{grid-row:1/3;font-style:normal;font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);align-self:center;min-width:64px}
.l2 small{font:500 11px var(--f-mono);font-variant-numeric:tabular-nums;opacity:.85}

.ms .m span{font:500 10.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.ms .today{position:absolute;top:4px;bottom:24px;width:2px;background:var(--warn)}
.ms-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:6px;font-size:12.5px}
.ms-list div{display:flex;gap:8px}
.ms-list b{font:600 11px var(--f-mono);color:var(--accent);min-width:16px}
.syn input{width:58px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:right;font:13px var(--f-mono)}
.dec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.dec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dec header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dec h3{margin:0;font:600 15px/1.3 var(--f-display)}
.dec h3 button{all:unset;cursor:pointer} .dec h3 button:hover{color:var(--accent)}
.dec .blast{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.dec .blast div{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.dec .blast b{font:700 17px/1.1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.dec p{margin:0;font-size:12.5px}
.road{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px;min-width:680px}
.road > div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.road h4{margin:0 0 4px;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
/* value stream cards */
.cvs-card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;background:var(--surface-2)}
.cvs-card.enabling{border-top-color:var(--muted)}
.cvs-card:hover{border-color:var(--accent)}
.cvs-card .k,.cvs-bar .k{display:block;font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.cvs-card b{font:700 18px/1.2 var(--f-display)}
.cvs-card .facts{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12.5px;color:var(--muted)}
.cvs-card .facts em{font-style:normal;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cvs-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px;margin-bottom:10px}
.cvs-bar button{all:unset;cursor:pointer;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:600 15px/1.25 var(--f-display)}
.cvs-bar button:hover{border-color:var(--accent)}
.cvs-bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cvs-bar button[aria-pressed="true"] .k{color:var(--accent-ink);opacity:.8}
/* role matrix */
.matrix td,.matrix th{padding:6px 8px;text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left;white-space:nowrap}
/* scatter */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .q{font:600 12px var(--f-display);fill:var(--muted);opacity:.7}
.chart circle{cursor:pointer;stroke:var(--surface);stroke-width:1.5}
.chart circle:hover{stroke:var(--ink)}
/* bars */
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12.5px}
.hbar:hover .nm{color:var(--accent)}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .trk{height:12px;background:var(--surface-2);border-radius:3px;position:relative;overflow:visible}
.hbar .fil{height:100%;border-radius:3px;background:var(--accent)}
.hbar .v{text-align:right;font:500 12px var(--f-mono);font-variant-numeric:tabular-nums}
.hbar .cap100{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
/* timeline */
.tl{position:relative}
.tl-axis{display:grid;font:500 10.5px var(--f-mono);color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;margin-left:190px}
.tl-row{all:unset;cursor:pointer;display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px;align-items:center;padding:5px 0;font-size:12.5px;border-bottom:1px dashed var(--line);width:100%}
.tl-row:hover .nm{color:var(--accent)}
.tl-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:18px}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.7}
.tl-dot{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--surface)}
.tl-span{position:absolute;top:7px;height:4px;border-radius:2px;background:color-mix(in oklab,var(--warn) 40%,transparent)}
.tl-diamond{position:absolute;top:4px;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);background:var(--ink)}
/* trace */
.trace-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px}
.trace{position:relative;display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:34px;min-width:980px}
.trace svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.trace svg path{fill:none;stroke:var(--line);stroke-width:1.3}
.trace svg path.hot{stroke:var(--accent);stroke-width:1.8}
.tcol{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.tcol > h4{margin:0 0 4px;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tnode{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.3;display:flex;flex-direction:column;gap:1px}
.tnode code{font:500 10px var(--f-mono);color:var(--muted)}
.tnode:hover{border-color:var(--accent)}
.tnode.focus{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.tmore{font-size:11.5px;color:var(--muted);padding:2px 4px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.32);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header .t{flex:1;min-width:0}
.drawer header .k{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.drawer header h2{margin:3px 0 6px;font:700 20px/1.2 var(--f-display);text-wrap:balance}
.drawer .x{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line)}
.drawer .x:hover{border-color:var(--ink)}
.drawer .body{overflow:auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:18px}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13px}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sec h3{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:12.5px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.callout{border-left:3px solid var(--warn);background:color-mix(in oklab,var(--warn) 8%,var(--surface));padding:10px 12px;border-radius:0 8px 8px 0;font-size:12.5px}
a{color:var(--accent)}
.empty{color:var(--muted);font-size:12.5px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand span,.rail-foot,.nav-group{display:none}
  .rail-toggle,.rail-mini{display:none!important}
  .app.rail-collapsed{grid-template-columns:minmax(0,1fr)}
  .app.rail-collapsed .brand,.app.rail-collapsed .nav{display:flex}
  .app.rail-collapsed .rail{padding:10px 16px}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  .nav button small{display:none}
  main{padding-inline:16px}
  .dl{grid-template-columns:120px minmax(0,1fr)}
  .tl-row{grid-template-columns:110px minmax(0,1fr)} .tl-axis{margin-left:120px}
  .hbar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 56px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

vised reporting and SFCR","summary":"Adapt quantitative reporting templates and split the SFCR into a policyholder part and a market part.","articles":"","caps":["C10.02","C11.05"],"size":"M","deadline":"application","kind":"Change","apps":["A21","A19"],"procs":["P5.3"]},{"id":"SII-05","area":"Proportionality","short":"Small and non-complex undertaking criteria","summary":"Assess whether the insurer qualifies for proportionality measures and adapt processes if so.","articles":"","caps":["C08.05"],"size":"S","deadline":"application","kind":"Change","apps":[],"procs":["P5.5"]}]},{"id":"AIACT","name":"EU Artificial Intelligence Act","short":"EU AI Act","status":"In force since August 2024. Stand-alone high-risk obligations moved to 2 December 2027 under the 2026 provisional agreement (to confirm).","dates":{"high_risk":"2027-12-02"},"date_labels":{"high_risk":"High-risk obligations apply (to confirm)"},"main_date":"high_risk","date_note":"Dates follow the 2026 digital omnibus agreement; confirm the final adopted text.","articles_note":"AI used for risk assessment and pricing in life and health insurance is listed as high-risk.","sources":[{"title":"Sidley: provisional agreement to delay key EU AI Act obligations","url":"https://datamatters.sidley.com/2026/06/22/eu-lawmakers-reach-provisional-agreement-to-delay-key-eu-ai-act-obligations/"}],"requirements":[{"id":"AI-01","area":"Governance","short":"AI system inventory and risk classification","summary":"Keep an inventory of AI systems and classify each by risk category.","articles":"","caps":["C11.10"],"size":"S","deadline":"high_risk","kind":"New capability","apps":["A19"],"procs":["P8.3"]},{"id":"AI-02","area":"High-risk systems","short":"Risk management and human oversight for high-risk AI","summary":"For high-risk uses such as life and health pricing, run risk management, data governance, logging and human oversight.","articles":"","caps":["C11.10","C03.02"],"size":"M","deadline":"high_risk","kind":"Change","apps":["A14","A08","A18"],"procs":["P4.2"]},{"id":"AI-03","area":"Transparency","short":"Transparency for customer-facing AI","summary":"Tell customers when they interact with an AI system such as a chatbot.","articles":"","caps":["C02.02","C02.01"],"size":"S","deadline":"high_risk","kind":"Change","apps":["A01"],"procs":["P3.1"]}]}],"example_scenarios":[{"id":"EX-MF","name":"Mainframe outage","type":"platform_failure","targets":["A29"],"likelihood":2,"description":"The mainframe with CICS, DBMS and message queuing fails. Home & Away policies, claims records and the CRM run on it.","mitigation":"Fail over to the recovery site; test the runbook twice a year; reduce the mainframe footprint through the consolidation programme."},{"id":"EX-DC1","name":"Loss of the head office data centre","type":"dc_loss","targets":["DC1"],"likelihood":2,"description":"The head office data centre is unavailable. All in-house applications need a site failover to the recovery site.","mitigation":"Annual full-site failover test; recovery order by tier; contract terms with the recovery site provider."},{"id":"EX-BIBIT","name":"Loss of the BIBIT payment network","type":"supplier_failure","targets":["S12"],"likelihood":2,"description":"The payment network is unavailable, so premiums cannot be collected and claims cannot be paid electronically.","mitigation":"Second payment route through the customer's bank; manual payment fallback for urgent claims."},{"id":"EX-UNIX","name":"Unix server farm failure","type":"platform_failure","targets":["A30"],"likelihood":2,"description":"The Unix server farm fails. The web portal, call centre, rating, the car and legal aid systems and the financial application run on it.","mitigation":"Clustered servers; tested failover to the recovery site; move suitable workloads to cloud."},{"id":"EX-RETCAR","name":"Retire Car Policy Administration","type":"decommission","targets":["A11"],"description":"Car policies move to the Home & Away platform and the legacy car system is retired.","mitigation":"Migrate in product waves; run in parallel for one renewal cycle; keep a read-only archive."},{"id":"EX-MFPRICE","name":"Mainframe vendor price rise","type":"price_change","targets":["S02"],"pct":15,"description":"The mainframe vendor raises licence and support prices by 15 per cent at renewal.","mitigation":"Benchmark; reduce MIPS through the consolidation programme; negotiate a multi-year cap."},{"id":"EX-SII","name":"Solvency II review","type":"regulatory_change","regulation":"SII-REV","targets":[],"likelihood":5,"description":"Mandatory. Amended Solvency II rules apply from 30 January 2027.","mitigation":"Programme under the Chief Risk Officer; vendor roadmaps for actuarial and reporting tools."},{"id":"EX-AI","name":"EU AI Act high-risk obligations","type":"regulatory_change","regulation":"AIACT","targets":[],"likelihood":5,"description":"AI used in pricing and fraud must meet AI Act obligations by the application date.","mitigation":"AI inventory first, then risk management and human oversight for high-risk uses."},{"id":"EX-DORA","name":"DORA remediation","type":"regulatory_change","regulation":"DORA","targets":[],"likelihood":5,"description":"DORA already applies. Close the remaining gaps in testing, third-party contracts and recovery.","mitigation":"Remediation plan under the IT resilience and DR manager, reported to the Board."}],"taxonomy":[{"domain":"Business","element":"Value stream","level":"L0","prefix":"CVS","definition":"A customer-facing outcome ArchiSurance organises itself around.","example":"Be insured","parent":""},{"domain":"Business","element":"Journey","level":"L1","prefix":"VS","definition":"An end-to-end customer or business journey inside a value stream, from trigger to outcome.","example":"Handle a claim","parent":"Value stream"},{"domain":"Business","element":"Process step","level":"L3","prefix":"VSnn.n","definition":"One activity in a journey. Carries RACI, the applications used and the capabilities it realises.","example":"Valuate the damage","parent":"Journey"},{"domain":"Business","element":"Process category","level":"L0","prefix":"","definition":"The top tier of the process hierarchy: Operate (serves customers), Manage (directs and controls), Support (keeps the insurer running).","example":"Operate","parent":""},{"domain":"Business","element":"Process group","level":"L1","prefix":"P","definition":"A group of related processes, aligned to APQC PCF (insurance).","example":"Manage risk and compliance","parent":"Process category"},{"domain":"Business","element":"Process","level":"L2","prefix":"Pn.n","definition":"A repeatable business process with an owner, applications and capabilities. Operate processes link to journeys.","example":"Prudential reporting","parent":"Process group"},{"domain":"Business","element":"Capability domain","level":"L1","prefix":"Cnn","definition":"A broad area of what the insurer does, independent of organisation and systems.","example":"Claims","parent":""},{"domain":"Business","element":"Capability","level":"L2","prefix":"Cnn.nn","definition":"A specific ability the insurer needs, aligned to an ACORD-style insurance capability model. Stable over time even when processes and systems change.","example":"First Notification of Loss","parent":"Capability domain"},{"domain":"Business","element":"Capability (L3)","level":"L3","prefix":"Cnn.nn.nn","definition":"A specific ability inside an L2 capability, mapped to the applications that realise it; an L3 with no application is a gap.","example":"Claim registration","parent":"Capability"},{"domain":"Change","element":"Epic","level":"","prefix":"EPnn","definition":"A large piece of change that serves one or more strategic initiatives, regulatory requirements or consolidation decision, delivered as several features.","example":"Consolidate policy administration","parent":""},{"domain":"Change","element":"Feature","level":"","prefix":"Fnnn","definition":"A deliverable change with a target quarter and status. Its footprint names the applications it changes and how (new, enhance, configure, integrate, replace, retire), the L3 capabilities and the journey steps whose way of working changes. The atlas traces its impact from that footprint.","example":"Online claim notification","parent":"Epic"},{"domain":"Business","element":"Role","level":"","prefix":"R","definition":"A job role or external party that performs process steps. Linked through RACI.","example":"Claims handler","parent":""},{"domain":"Technology","element":"Application","level":"","prefix":"A","definition":"A software system or service the insurer uses or depends on, including platforms and partner-hosted services.","example":"Policy administration system","parent":""},{"domain":"Technology","element":"Platform application","level":"","prefix":"A","definition":"An application other applications run on. Linked through 'runs on' with a status.","example":"Mainframe","parent":"Application"},{"domain":"Technology","element":"Interface","level":"","prefix":"I","definition":"A data flow from one application to another, with its data, integration type and frequency.","example":"Policy data to finance (file)","parent":""},{"domain":"Technology","element":"Data domain","level":"","prefix":"D","definition":"A business data subject with one system of record and several consumers.","example":"Insurance policy","parent":""},{"domain":"Technology","element":"Data centre","level":"","prefix":"DC","definition":"A physical site that hosts ArchiSurance workloads.","example":"Primary data centre","parent":""},{"domain":"Commercial","element":"Supplier","level":"","prefix":"S","definition":"A third party that provides software, services, hosting or a partnership.","example":"Payment service provider","parent":""},{"domain":"Commercial","element":"Contract","level":"","prefix":"K","definition":"The master agreement with a supplier: term, notice, renewal and key clauses.","example":"K001 master agreement","parent":"Supplier"},{"domain":"Commercial","element":"Licence","level":"","prefix":"L","definition":"The licence or subscription for one application: model, metric, entitlement, usage and cost.","example":"Per-core subscription","parent":"Contract"},{"domain":"Commercial","element":"Support agreement","level":"","prefix":"SP","definition":"How one application is supported: resolver groups, hours, SLAs and vendor end of support.","example":"Vendor (L3) + ArchiSurance service desk (L1)","parent":"Application"},{"domain":"Strategy","element":"Strategic pillar","level":"","prefix":"SP","definition":"One of ArchiSurance's strategic priorities or goals.","example":"Client satisfaction","parent":""},{"domain":"Strategy","element":"Strategic initiative","level":"","prefix":"SI","definition":"A strategic achievement or programme under a pillar, traced to the journeys, processes, capabilities and applications it depends on.","example":"One-stop customer service","parent":"Strategic pillar"},{"domain":"Strategy","element":"Scenario","level":"","prefix":"EX / sc","definition":"A modelled disruption, change or regulation, with the items it affects. The impact is computed from the repository, so it stays current as the data changes.","example":"Mainframe outage","parent":""},{"domain":"Strategy","element":"Regulatory requirement","level":"","prefix":"REG-nn","definition":"One obligation from a regulation, mapped to the applications, capabilities and processes that must change.","example":"ICT incident reporting","parent":"Scenario"},{"domain":"Strategy","element":"Consolidation decision","level":"","prefix":"BD","definition":"A key platform decision raised by the consolidation programme, with options, an EA hypothesis, a phase and a blast radius.","example":"Single policy administration platform","parent":""},{"domain":"Strategy","element":"Programme principle","level":"","prefix":"","definition":"A stated position or commitment, paraphrased, with its architecture implication.","example":"One back office for all product lines","parent":""}],"relationships":[{"source":"Epic","verb":"serves","target":"Strategic initiative, Regulatory requirement or Consolidation decision"},{"source":"Epic","verb":"is delivered by","target":"Feature"},{"source":"Feature","verb":"changes","target":"Application (with a change type)"},{"source":"Feature","verb":"creates or changes","target":"Capability (L3)"},{"source":"Feature","verb":"changes the way of working in","target":"Process step"},{"source":"Feature","verb":"depends on","target":"Feature"},{"source":"Value stream","verb":"contains","target":"Journey"},{"source":"Journey","verb":"is made of","target":"Process step"},{"source":"Role","verb":"is R, A, C or I for","target":"Process step"},{"source":"Process step","verb":"realises","target":"Capability"},{"source":"Process step","verb":"uses","target":"Application"},{"source":"Process","verb":"covers","target":"Journey"},{"source":"Process","verb":"is supported by","target":"Application"},{"source":"Application","verb":"supports","target":"Capability"},{"source":"Application","verb":"runs on","target":"Platform application"},{"source":"Application","verb":"is hosted in","target":"Data centre"},{"source":"Application","verb":"is supplied by","target":"Supplier (vendor, SI, AMS, hosting, platform)"},{"source":"Application","verb":"sends data to","target":"Application (Interface)"},{"source":"Data domain","verb":"has system of record","target":"Application"},{"source":"Supplier","verb":"is governed by","target":"Contract"},{"source":"Contract","verb":"covers","target":"Licence"},{"source":"Application","verb":"is covered by","target":"Support agreement"},{"source":"Consolidation decision","verb":"affects","target":"Application"}],"glossary":[{"id":"G001","term":"Capability gap / overlap","category":"Application portfolio","definition":"A gap is a capability with no supporting application. Overlap is a capability served by three or more applications."},{"id":"G002","term":"Criticality tier","category":"Application portfolio","definition":"Tier 0: the organisation cannot operate without it. Tier 1: major customer or regulatory impact. Tier 2: significant internal impact. Tier 3: low impact."},{"id":"G003","term":"Data confidence","category":"Application portfolio","definition":"How far a record can be trusted. Customer-provided: confirmed by the organisation. Public: from a public source. Partly confirmed: capability confirmed, product assumed. Illustrative: placeholder."},{"id":"G004","term":"End-user computing (EUC)","category":"Application portfolio","definition":"Business-built tools such as spreadsheets and desktop databases. They carry control risk when used for critical processes."},{"id":"G005","term":"Functional fit","category":"Application portfolio","definition":"How well an application meets business needs, scored 1 to 5."},{"id":"G006","term":"Lifecycle","category":"Application portfolio","definition":"Where an application is in its life: Production, Migrating, Phase-out."},{"id":"G007","term":"Run cost","category":"Application portfolio","definition":"Annual licence plus support cost for an application. Illustrative until supplied."},{"id":"G008","term":"TIME rating","category":"Application portfolio","definition":"Gartner model for portfolio decisions. Tolerate: keep, minimal spend. Invest: strategic, develop further. Migrate: valuable function on weak technology, move it. Eliminate: retire."},{"id":"G009","term":"Technical health","category":"Application portfolio","definition":"How sound an application's technology is (supportability, currency, resilience), scored 1 to 5."},{"id":"G010","term":"APQC PCF","category":"Architecture method","definition":"APQC Process Classification Framework. A widely used process taxonomy with cross-industry and industry editions."},{"id":"G011","term":"ArchiMate","category":"Architecture method","definition":"The Open Group modelling language for enterprise architecture. Models from tools such as Archi can be imported into the atlas."},{"id":"G012","term":"Blast radius","category":"Architecture method","definition":"Everything affected if an application or decision changes: value streams, journeys, capabilities, interfaces and cost."},{"id":"G013","term":"Business capability","category":"Architecture method","definition":"What the organisation must be able to do, described independently of who does it or which system supports it."},{"id":"G014","term":"Business process","category":"Architecture method","definition":"How work is done: a repeatable set of steps with an owner, inputs and outputs."},{"id":"G015","term":"Enterprise architecture (EA)","category":"Architecture method","definition":"The practice of describing how the organisation's business, data, applications and technology fit together, so change can be planned and its impact understood."},{"id":"G016","term":"Handoff","category":"Architecture method","definition":"A point in a process map where work passes from one role to another. More handoffs usually mean more delay and more risk of error."},{"id":"G017","term":"Journey","category":"Architecture method","definition":"An end-to-end path a customer or colleague follows within a value stream, from a trigger to an outcome."},{"id":"G018","term":"Metamodel","category":"Architecture method","definition":"The set of element types and the relationships allowed between them. It is the structure behind this repository."},{"id":"G019","term":"Operate / Manage / Support","category":"Architecture method","definition":"The three tiers of the process hierarchy. Operate serves customers, Manage directs and controls the organisation, Support keeps it running."},{"id":"G020","term":"Process map / swimlane","category":"Architecture method","definition":"A diagram of a journey where each lane is a role, boxes are steps in sequence, and a systems lane shows the applications used."},{"id":"G021","term":"RACI","category":"Architecture method","definition":"Responsible (does the work), Accountable (owns the outcome, one per step), Consulted (gives input), Informed (kept up to date)."},{"id":"G022","term":"Strategic pillar","category":"Architecture method","definition":"One of the organisation's strategic priorities or goals, under which initiatives are grouped."},{"id":"G023","term":"Strategy-to-portfolio alignment","category":"Architecture method","definition":"Whether the applications a strategic initiative depends on are rated to support it. An initiative is flagged Watch when a Tier 0 or Tier 1 application behind it is rated Migrate or Eliminate, or scores below 3 for technical health."},{"id":"G024","term":"System of record","category":"Architecture method","definition":"The application that holds the authoritative version of a data domain."},{"id":"G025","term":"TOGAF","category":"Architecture method","definition":"The Open Group Architecture Framework. A method for developing and governing enterprise architecture."},{"id":"G026","term":"Taxonomy","category":"Architecture method","definition":"The agreed hierarchy and names for each element type, so the same thing is always described the same way."},{"id":"G027","term":"Traceability","category":"Architecture method","definition":"The ability to follow links from a role to its steps, capabilities, applications and suppliers, and back again."},{"id":"G028","term":"Value stream","category":"Architecture method","definition":"A sequence of activities that delivers an outcome a customer values."},{"id":"G029","term":"Change contention","category":"Change portfolio","definition":"Several features changing the same application within one quarter, competing for release slots, environments and testing."},{"id":"G030","term":"Change footprint","category":"Change portfolio","definition":"What a feature changes: applications with a change type, L3 capabilities, journey steps, drivers and dependencies. The impact is derived from it."},{"id":"G031","term":"Change impact","category":"Change portfolio","definition":"How far a feature or epic reaches across the organisation: applications changed and their criticality, integrations to rework or retest, journeys, people to retrain, critical services, customer exposure and new integrations. Rated Low, Medium, High or Critical."},{"id":"G032","term":"Change twice risk","category":"Change portfolio","definition":"Building on an application that a programme decision may replace or converge soon after, so the work may have to be redone."},{"id":"G033","term":"Regression test","category":"Change portfolio","definition":"Retesting a connected application whose interface is unchanged, to confirm a change elsewhere has not broken it."},{"id":"G034","term":"Change-of-control clause","category":"Commercial and third-party risk","definition":"A contract term that gives the supplier rights (for example to terminate or renegotiate) when the customer's ownership changes."},{"id":"G035","term":"End of support (EoS)","category":"Commercial and third-party risk","definition":"The date after which the vendor stops fixes and security patches for a version."},{"id":"G036","term":"Exit plan","category":"Commercial and third-party risk","definition":"A documented and ideally tested plan to leave a supplier without disrupting service."},{"id":"G037","term":"Licence metric","category":"Commercial and third-party risk","definition":"What a licence is charged on: named users, cores, processors, policies, accounts, transactions or capacity."},{"id":"G038","term":"Notice deadline","category":"Commercial and third-party risk","definition":"The last date to serve notice before a contract renews or ends: the term end minus the notice period."},{"id":"G039","term":"Over-deployed","category":"Commercial and third-party risk","definition":"Usage above licence entitlement. A compliance and audit exposure."},{"id":"G040","term":"SI / AMS","category":"Commercial and third-party risk","definition":"Systems integrator (builds and changes systems) and application management services (runs and supports them)."},{"id":"G041","term":"SLA","category":"Commercial and third-party risk","definition":"Service level agreement. Here: availability target and P1 response and resolution times."},{"id":"G042","term":"SaaS","category":"Commercial and third-party risk","definition":"Software as a service. The vendor hosts and runs the application; the customer subscribes."},{"id":"G043","term":"Shelfware","category":"Commercial and third-party risk","definition":"Licences paid for but not used. Flagged here when utilisation is below 65%."},{"id":"G044","term":"Version currency","category":"Commercial and third-party risk","definition":"How up to date a deployed version is: Current, N-1 (one behind), N-2 or older."},{"id":"G045","term":"Aggregator","category":"Insurance","definition":"A price comparison website that collects quotes from several insurers."},{"id":"G046","term":"Bordereau","category":"Insurance","definition":"A periodic report of policies or claims written under delegated authority."},{"id":"G047","term":"Combined ratio","category":"Insurance","definition":"Loss ratio plus expense ratio. Below 100% means an underwriting profit."},{"id":"G048","term":"Delegated authority","category":"Insurance","definition":"An arrangement where a coverholder or managing general agent underwrites or settles claims on the insurer's behalf."},{"id":"G049","term":"First notification of loss (FNOL)","category":"Insurance","definition":"The first report of a claim, when the basic facts are captured."},{"id":"G050","term":"IBNR","category":"Insurance","definition":"Incurred but not reported: claims for events that have happened but have not yet been notified."},{"id":"G051","term":"Insured / insurant","category":"Insurance","definition":"The person or property covered by the policy. Often the policyholder, but not always."},{"id":"G052","term":"Intermediary / broker","category":"Insurance","definition":"A firm that arranges insurance on behalf of customers and is paid commission or fees."},{"id":"G053","term":"Lapse","category":"Insurance","definition":"A policy that ends because the premium was not paid or the customer did not renew."},{"id":"G054","term":"Legal expenses insurance","category":"Insurance","definition":"Cover for the cost of legal advice and action, also called legal aid insurance in some markets."},{"id":"G055","term":"Loss adjuster","category":"Insurance","definition":"An independent expert who investigates and values a claim for the insurer."},{"id":"G056","term":"Loss ratio","category":"Insurance","definition":"Claims incurred divided by premiums earned."},{"id":"G057","term":"Mid-term adjustment (MTA)","category":"Insurance","definition":"A change to a policy during its term, such as a new address or added cover."},{"id":"G058","term":"Policyholder","category":"Insurance","definition":"The person or organisation that owns the insurance contract and pays the premium."},{"id":"G059","term":"Premium","category":"Insurance","definition":"The price paid for cover, usually annually or in instalments."},{"id":"G060","term":"Rating factor","category":"Insurance","definition":"A characteristic used to price a risk, such as age, location or claims history."},{"id":"G061","term":"Reinsurance","category":"Insurance","definition":"Insurance bought by an insurer to transfer part of its risk. Treaty covers a portfolio; facultative covers one risk."},{"id":"G062","term":"Renewal","category":"Insurance","definition":"Offering and agreeing cover for a further term."},{"id":"G063","term":"Reserve","category":"Insurance","definition":"Money set aside for claims that have been reported but not yet paid (case reserve) or not yet reported (IBNR)."},{"id":"G064","term":"Subrogation","category":"Insurance","definition":"The insurer's right to recover a claim payment from the party responsible for the loss."},{"id":"G065","term":"Underwriting","category":"Insurance","definition":"Deciding whether to accept a risk and on what terms and price."},{"id":"G066","term":"API gateway","category":"Integration and technology","definition":"The control point for APIs: security, throttling and routing."},{"id":"G067","term":"CDC","category":"Integration and technology","definition":"Change data capture. Streams changes from a database as events."},{"id":"G068","term":"Container platform / Kubernetes","category":"Integration and technology","definition":"A platform that runs applications in containers and manages them automatically."},{"id":"G069","term":"Event streaming","category":"Integration and technology","definition":"A platform for publishing and consuming streams of events in real time, such as Apache Kafka."},{"id":"G070","term":"GRC","category":"Integration and technology","definition":"Governance, risk and compliance tooling: risk registers, controls and policies."},{"id":"G071","term":"IAM / PAM","category":"Integration and technology","definition":"Identity and access management, and privileged access management for administrator accounts."},{"id":"G072","term":"ITSM / CMDB","category":"Integration and technology","definition":"IT service management (incident, change, problem) and the configuration management database."},{"id":"G073","term":"Mainframe","category":"Integration and technology","definition":"A large central computer for high-volume transaction processing."},{"id":"G074","term":"Message queuing","category":"Integration and technology","definition":"Middleware for reliable system-to-system messaging, such as IBM MQ or RabbitMQ."},{"id":"G075","term":"SIEM / SOC","category":"Integration and technology","definition":"Security information and event management, and the security operations centre that uses it."},{"id":"G076","term":"Virtualisation","category":"Integration and technology","definition":"Software that runs many virtual servers on shared hardware."},{"id":"G077","term":"ArchiSurance","category":"Organisation","definition":"A fictional insurer used by The Open Group and the Archi tool to illustrate ArchiMate. This atlas is built from the Archi sample model."},{"id":"G078","term":"BIBIT","category":"Organisation","definition":"The payment network in the Archi model that connects ArchiSurance's Bank System with customers' banks."},{"id":"G079","term":"Document Processing SSC","category":"Organisation","definition":"ArchiSurance's shared service centre that turns paper claim forms and contracts into electronic documents."},{"id":"G080","term":"GIM","category":"Organisation","definition":"The business interface intermediaries use to reach ArchiSurance in the Archi model, shown here as the Intermediary Portal."},{"id":"G081","term":"Day 1 / Wave","category":"Programme","definition":"Day 1 is the legal or operational start of a programme such as completion of a merger. Waves are later phases."},{"id":"G082","term":"Programme lens","category":"Programme","definition":"EA hypothesis for each application under a major programme such as a merger, acquisition or transformation. Typical values: Retain, Assess, Likely converge, Key decision, Replace / decommission."},{"id":"G083","term":"Synergy","category":"Programme","definition":"Cost saved by combining operations, systems or suppliers."},{"id":"G084","term":"Critical or important function (CIF)","category":"Regulation","definition":"A function whose disruption would materially impair the insurer's performance, compliance or continuity. Used by DORA and by Solvency II outsourcing rules."},{"id":"G085","term":"DORA","category":"Regulation","definition":"EU Digital Operational Resilience Act, applying since 17 January 2025. Covers ICT risk management, incident reporting, resilience testing and ICT third-party risk for insurers and other financial entities."},{"id":"G086","term":"DORA Article 30","category":"Regulation","definition":"The DORA article listing the key contract terms required for ICT services, such as service descriptions, locations, audit rights and exit."},{"id":"G087","term":"EU AI Act","category":"Regulation","definition":"EU regulation on artificial intelligence. AI used for risk assessment and pricing in life and health insurance is high-risk. A provisional agreement in 2026 moved stand-alone high-risk obligations to 2 December 2027 (to confirm)."},{"id":"G088","term":"GDPR","category":"Regulation","definition":"EU General Data Protection Regulation. Rules on processing personal data, including lawful basis, data subject rights, breach notification and records of processing."},{"id":"G089","term":"IDD","category":"Regulation","definition":"EU Insurance Distribution Directive: rules on how insurance is sold, including demands and needs, product oversight and governance, and conflicts of interest."},{"id":"G090","term":"IFRS 17","category":"Regulation","definition":"The accounting standard for insurance contracts, effective from January 2023."},{"id":"G091","term":"ISO/IEC 27001","category":"Regulation","definition":"International standard for information security management systems."},{"id":"G092","term":"NIS2","category":"Regulation","definition":"EU Network and Information Security Directive 2. Cyber risk management and incident reporting duties for essential and important entities."},{"id":"G093","term":"ORSA","category":"Regulation","definition":"Own risk and solvency assessment: the insurer's own view of its risks and capital needs."},{"id":"G094","term":"Outsourcing of critical functions","category":"Regulation","definition":"Under Solvency II, outsourcing a critical or important function needs prior notification to the supervisor and stronger contract terms and oversight."},{"id":"G095","term":"Product oversight and governance (POG)","category":"Regulation","definition":"IDD rules requiring insurers to design, approve and review products for a defined target market."},{"id":"G096","term":"QRT / SFCR / RSR","category":"Regulation","definition":"Solvency II reporting: quantitative reporting templates, the public solvency and financial condition report, and the regular supervisory report."},{"id":"G097","term":"Register of information","category":"Regulation","definition":"The DORA register of all ICT third-party arrangements that each financial entity must keep and report."},{"id":"G098","term":"SCR / MCR","category":"Regulation","definition":"Solvency capital requirement and minimum capital requirement under Solvency II."},{"id":"G099","term":"Solvency II","category":"Regulation","definition":"EU prudential framework for insurers: capital requirements (Pillar 1), governance and risk management including ORSA (Pillar 2), and reporting and disclosure (Pillar 3)."},{"id":"G100","term":"Solvency II review","category":"Regulation","definition":"Amendments to the Solvency II Directive published in January 2025, applying at the latest from 30 January 2027. Changes cover proportionality, Pillar 1 calibration, macroprudential tools, sustainability risks and reporting."},{"id":"G101","term":"Active-active","category":"Resilience","definition":"Both sites run live at the same time and share load."},{"id":"G102","term":"Active-passive","category":"Resilience","definition":"One site runs live while the other is on standby and takes over only after a failover."},{"id":"G103","term":"DR test","category":"Resilience","definition":"A disaster recovery exercise that proves a service can be recovered within its RTO and RPO."},{"id":"G104","term":"Impact tolerance","category":"Resilience","definition":"The maximum tolerable disruption to an important business service."},{"id":"G105","term":"RPO","category":"Resilience","definition":"Recovery point objective. The maximum data loss allowed, measured as time before the failure."},{"id":"G106","term":"RTO","category":"Resilience","definition":"Recovery time objective. The maximum time a service may be down before it must be restored."},{"id":"G107","term":"Site failover","category":"Resilience","definition":"Moving live service from the primary site to the secondary after a failure or for a test."},{"id":"G108","term":"At risk","category":"Scenario analysis","definition":"An application that keeps running but loses its fallback, such as its standby site or hosting."},{"id":"G109","term":"Change size","category":"Scenario analysis","definition":"Small, Medium, Large or Very large. The impact level for change and regulatory scenarios, which are planned rather than disruptive."},{"id":"G110","term":"Degraded","category":"Scenario analysis","definition":"An application that still runs but loses a data flow or dependency, such as a feed from a failed system or messaging through a failed platform."},{"id":"G111","term":"Down","category":"Scenario analysis","definition":"An application that is unavailable in the scenario, directly or because something it runs on has failed."},{"id":"G112","term":"Effort points","category":"Scenario analysis","definition":"An illustrative sizing of a regulatory change: each requirement scores 1 (S), 3 (M) or 8 (L)."},{"id":"G113","term":"Impact level","category":"Scenario analysis","definition":"Low, Medium, High or Critical, computed from Tier 0 applications down, critical services affected, value streams and journeys hit."},{"id":"G114","term":"Likelihood","category":"Scenario analysis","definition":"How probable a disruption is, from 1 (Rare) to 5 (Almost certain). Set by the person who writes the scenario."},{"id":"G115","term":"Readiness","category":"Scenario analysis","definition":"For a regulation with a deadline: Not planned (no feature serves the requirement), Late (lands after the deadline), On track or Done. Derived from the change backlog."},{"id":"G116","term":"Risk rating","category":"Scenario analysis","definition":"Likelihood combined with impact level. Shown on the risk matrix."},{"id":"G117","term":"Scenario","category":"Scenario analysis","definition":"A described event or change that the atlas traces through the repository to show what it affects. ffice consolidation","noun":"consolidation programme","kind":"Merger integration","lens_label":"Consolidation lens","decision_label":"Consolidation decision","commitment_label":"Programme principle","summary_title":"The programme","summary":"In The Open Group's ArchiSurance case study the company was formed by merging three insurers, one per product line. Each kept its own back office and systems. This illustrative programme moves home, travel, car and legal aid onto shared customer, policy and claims components, following the Component and One Stop principles in the Archi model.","view_sub":"What the consolidation means for the architecture: programme principles, the addressable run cost, contract exposure and the key platform decisions.","timeline_title":"Programme timeline","completion":"2028-06-30","completion_label":"Consolidation complete","timeline":["2026-01-01","2028-12-31"],"milestones":[{"date":"2026-03-31","label":"Board approves the consolidation programme","status":"done"},{"date":"2026-12-31","label":"Single customer view live","status":"next"},{"date":"2027-09-30","label":"Car policies migrated to the Home & Away platform","status":"planned"},{"date":"2028-03-31","label":"Legal aid migrated","status":"planned"},{"date":"2028-06-30","label":"Legacy car and legal aid systems retired","status":"planned"}],"phases":[{"name":"Phase 1 (2026-27)","start":"2026-Q4"},{"name":"Phase 2 (2027-28)","start":"2027-Q3"},{"name":"Phase 3 (2028)","start":"2028-Q1"}],"phase_notes":{"Phase 1 (2026-27)":"Plus: programme governance, data migration approach, product mapping between lines."},"decisions":[{"id":"BD01","title":"Single policy administration platform","apps":["A04","A05","A06","A11","A12"],"phase":"Phase 1 (2026-27)","criticality":"Critical","options":"Extend the Home & Away platform to all lines · Buy a new policy administration package · Keep separate systems behind a shared customer layer","hypothesis":"Extend Home & Away. It already holds the shared customer and policy components named in the Archi model. Widest blast radius in the estate, and it runs on the mainframe."},{"id":"BD02","title":"One CRM and contact centre platform","apps":["A02","A03"],"phase":"Phase 1 (2026-27)","criticality":"High","options":"Replace both with one SaaS platform · Keep the CRM, replace the call centre application","hypothesis":"Replace the agent desktop first, then decide on the CRM once the single customer view is live."},{"id":"BD03","title":"Mainframe future","apps":["A29","A04","A07","A03"],"phase":"Phase 3 (2028)","criticality":"Critical","options":"Retain and modernise · Rehost on standard platforms · Retire together with a policy administration replacement","hypothesis":"Retain through the consolidation; decide after the policy platform decision, because it sets most of the mainframe workload."},{"id":"BD04","title":"Claims platform","apps":["A07","A13"],"phase":"Phase 2 (2027-28)","criticality":"High","options":"Claims workflow on top of Claim Data Management · Full claims system replacement","hypothesis":"Grow the claims workflow and shrink Claim Data Management to a record store."},{"id":"BD05","title":"Shared document processing","apps":["A16","A17"],"phase":"Phase 2 (2027-28)","criticality":"Medium","options":"Keep the Document Processing SSC tools · Move to a digital mailroom service","hypothesis":"Digital mailroom; the SSC already serves all lines."}],"commitments":[{"topic":"One Stop","stated":"Customers have one point of contact for all products and claims.","source":"Archi sample model (principle)","ref":"https://github.com/archimatetool/archi","implication":"Shared customer data and one contact centre platform; product-line systems must feed the CRM.","apps":["A02","A03","A05"]},{"topic":"Component","stated":"Product lines share application components instead of running their own.","source":"Archi sample model (principle)","ref":"https://github.com/archimatetool/archi","implication":"Car and legal aid move to the shared policy and customer components; legacy systems retire.","apps":["A04","A11","A12"]},{"topic":"Infrastructure","stated":"Applications run on a small set of standard platforms.","source":"Archi sample model (principle)","ref":"https://github.com/archimatetool/archi","implication":"Mainframe and Unix farm consolidate; new workloads go to cloud.","apps":["A29","A30"]},{"topic":"Licence","stated":"Fewer products and vendors, licensed for real use.","source":"Archi sample model (principle)","ref":"https://github.com/archimatetool/archi","implication":"Retiring the legacy systems removes two vendors and their support contracts.","apps":["A11","A12"]}],"commitments_title":"Programme principles and what they mean for the architecture","commitments_sub":"Principles from the Archi sample model, paraphrased. Implications are EA analysis.","synergy_title":"Savings scenario","synergy_note":"Set an indicative saving per lens to size the run-cost opportunity. Illustrative: excludes one-off migration cost and dual running.","synergy_defaults":{"Likely converge":25,"Key decision":20,"Assess":10,"Replace / decommission":80,"Retain":0},"lens_order":["Likely converge","Key decision","Assess","Replace / decommission","Retain"],"converge_sub":"to shared platforms","partner_suppliers":[],"sources":{"archi":"https://github.com/archimatetool/archi"}},"business_processes":[{"id":"P1","name":"Be insured","category":"Operate","parent":"","owner":"R27","capabilities":[],"apps":[],"journeys":[],"roles":[],"source":"Public (Archi sample model)","level":1},{"id":"P1.1","name":"New business and contracting","category":"Operate","parent":"P1","owner":"R27","capabilities":["C04.02","C05.01","C02.03"],"apps":["A01","A15","A08","A14","A04","A06","A11","A12"],"journeys":["VS01"],"roles":["R06","R07","R08","R36"],"source":"Public (Archi sample model) (Close Contract)","level":2},{"id":"P1.2","name":"Policy servicing and changes","category":"Operate","parent":"P1","owner":"R28","capabilities":["C05.02"," <script>
const D = JSON.parse(document.getElementById('data').textContent);
const TODAY = new Date(D.meta.as_of+"T00:00:00");
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const by = (arr,k='id')=>Object.fromEntries(arr.map(x=>[x[k],x]));
const GL=by(D.glossary), BP=by(D.business_processes), CVS=by(D.customer_value_streams), CAP=by([...D.capabilities,...(D.capabilities_l3||[])]), VS=by(D.value_streams), ST=by(D.steps), RO=by(D.roles), AP=by(D.apps), SU=by(D.suppliers), K=by(D.contracts);
const LIC=by(D.licences,'app'), SUP=by(D.support,'app'), RES=by(D.resilience,'app');
const L1=D.capabilities.filter(c=>c.level===1), L2=D.capabilities.filter(c=>c.level===2), L3=D.capabilities_l3||[], L3of={}; L3.forEach(c=>(L3of[c.parent]=L3of[c.parent]||[]).push(c));
const P=D.meta.profile||{}, CR=Object.assign({label:'Critical service',short:'Critical service',plural:'critical services',abbr:'CRIT'},P.criticality||{}), TPR=Object.assign({material_label:'Critical supplier',material_abbr:'CS',terms_label:'Required contract terms'},P.third_party||{});
const PG=D.programme||null, ORGS=D.meta.short_name||D.meta.organisation, NOUN=P.org_noun||'organisation', VSL=P.value_stream_label||'Value stream';
const CUR=(D.meta.currency||{}).symbol||'€', CURC=(D.meta.currency||{}).code||'EUR', SKEY=D.meta.storage_key||'atlas';
const CUST=D.meta.customer_role||'';
const CRN=n=>n===1?(CR.short||'critical service').toLowerCase():CR.plural;
const CRB=()=>` <span class="mono muted" title="${esc(CR.label)}">${esc(CR.abbr)}</span>`;
const fmtM = v=>CUR+(v>=1?v.toFixed(1)+'m':(v*1000).toFixed(0)+'k');
const months = d=>Math.round((new Date(d+"T00:00:00")-TODAY)/(864e5*30.44));
const isDate = s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');

// ---- derived indexes
const appCost = id => (LIC[id]?.annual_cost_m||0)+(SUP[id]?.annual_support_cost_m||0);
const capApps={}, capSteps={}, appSteps={}, roleSteps={}, appSups={}, supApps={};
L2.forEach(c=>{capApps[c.id]=[];capSteps[c.id]=[]});
D.apps.forEach(a=>{a.capabilities.forEach(c=>capApps[c].push(a.id)); appSteps[a.id]=[]; appSups[a.id]=[]});
D.steps.forEach(s=>{
  s.capabilities.forEach(c=>capSteps[c].push(s.id));
  s.apps.forEach(a=>appSteps[a].push(s.id));
  const add=(r,l)=>{(roleSteps[r]=roleSteps[r]||[]).push({step:s.id,raci:l})};
  s.R.forEach(r=>add(r,'R')); add(s.A,'A'); s.C.forEach(r=>add(r,'C')); s.I.forEach(r=>add(r,'I'));
});
D.app_supplier.forEach(x=>{appSups[x.app].push(x); (supApps[x.supplier]=supApps[x.supplier]||[]).push(x)});
const supSpend = sid => (supApps[sid]||[]).filter(x=>AP[x.app].vendor===sid).reduce((t,x)=>t+appCost(x.app),0);
const supCaps = sid => [...new Set((supApps[sid]||[]).flatMap(x=>AP[x.app].capabilities))];
const supSteps = sid => [...new Set((supApps[sid]||[]).flatMap(x=>appSteps[x.app]))];
const appRoles = aid => [...new Set(appSteps[aid].flatMap(s=>{const t=ST[s];return [...t.R,t.A,...t.C]}))];
const contractOf = sid => D.contracts.find(k=>k.supplier===sid);
const LENS_ORDER=(PG&&PG.lens_order)||['Likely converge','Key decision','Assess','Replace / decommission','Retain'];
const LENS_VAR=Object.assign({'Likely converge':'--migrate','Key decision':'--crit','Assess':'--warn','Replace / decommission':'--eliminate','Retain':'--ok'},(PG&&PG.lens_colours)||{});
const lensKey = l => {l=l||''; const k=LENS_ORDER.find(k=>l.toLowerCase().startsWith(k.split(/[ /]/)[0].toLowerCase())); return k||(l?LENS_ORDER[LENS_ORDER.length-1]:'Not assessed')};
const PLABEL=(PG&&PG.lens_label)||'Programme lens', PNAME=(PG&&PG.name)||'Programme', PDEC=(PG&&PG.decision_label)||'Programme decision';

const CONF_VAR={'Customer-provided':'--c-cust','Public':'--c-pub','Partly confirmed':'--c-part','Illustrative':'--c-ill'};
const conf = c=>`<span class="conf" title="Data confidence"><i style="background:var(${CONF_VAR[c]})"></i>${esc(c)}</span>`;
const time = t=>`<span class="pill t-${t}">${t}</span>`;

  D.suppliers.filter(s=>s.material&&!/tested/.test(s.exit_plan.replace('untested','x'))).forEach(s=>
    items.push({sev:s.exit_plan==='Not documented'?'crit':'warn',title:`${s.name}: exit plan ${s.exit_plan.toLowerCase()}`,detail:`${TPR.material_label} · ${(supApps[s.id]||[]).filter(x=>AP[x.app].crit).length} apps supporting ${CR.plural}`,ent:'sup:'+s.id,tag:'Exit plan'}));

function wrap(t,n){const w=t.split(' '),out=[];let l='';w.forEach(x=>{if((l+' '+x).trim().length>n){out.push(l.trim());l=x}else l+=' '+x});if(l.trim())out.push(l.trim());return out}
function pmap(){
  const v=VS[state.pmapVs], steps=D.steps.filter(s=>s.vs===v.id);
  const laneOf=s=>s.R.length?s.R[0]:s.A;
  const lanes=[];const add=r=>{if(!lanes.includes(r))lanes.push(r)};
  if(CUST&&steps.some(s=>[...s.R].includes(CUST))) add(CUST);
  steps.forEach(s=>{add(laneOf(s));s.R.forEach(add)});
  const LW=176,CW=200,BW=166,BH=60,LH=84,T=8;
  const maxApps=Math.max(...steps.map(s=>s.apps.length)), SH=24+maxApps*20;
  const W=LW+CW*(steps.length+1)+20, H=T+lanes.length*LH+SH+16;
  const cx=i=>LW+CW*(i+0.5)+CW/2, ly=r=>T+lanes.indexOf(r)*LH+LH/2;
  let g='';
  lanes.forEach((r,i)=>{const y=T+i*LH;g+=`<rect x="0" y="${y}" width="${W}" height="${LH}" fill="${i%2?'var(--surface-2)':'var(--surface)'}"/><line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/>
    <g data-ent="role:${r}" style="cursor:pointer">${wrap(RO[r].name,20).slice(0,2).map((t,j,a)=>`<text x="14" y="${y+LH/2+(j-(a.length-1)/2)*15+4}" class="lane-t">${esc(t)}</text>`).join('')}<text x="14" y="${y+LH/2+ (wrap(RO[r].name,20).length>1?26:18)}" class="lane-s">${esc(RO[r].family)}</text></g>`});
  const sy=T+lanes.length*LH;
  g+=`<rect x="0" y="${sy}" width="${W}" height="${SH}" fill="var(--accent-soft)"/><line x1="0" x2="${W}" y1="${sy}" y2="${sy}" stroke="var(--line)"/><text x="14" y="${sy+22}" class="lane-t">Systems</text>`;
  g+=`<line x1="${LW}" x2="${LW}" y1="${T}" y2="${sy+SH}" stroke="var(--line)"/>`;
  // start / end events
  const s0=steps[0], sl=steps[steps.length-1];
  g+=`<circle cx="${LW+CW*0.5-30}" cy="${ly(laneOf(s0))}" r="11" fill="var(--surface)" stroke="var(--ok)" stroke-width="2"><title>Start: ${esc(v.trigger)}</title></circle>`;
  g+=`<path d="M${LW+CW*0.5-19},${ly(laneOf(s0))} H${cx(0)-BW/2-2}" class="flow" marker-end="url(#arr)"/>`;
  const ex=cx(steps.length-1)+BW/2+34;
  g+=`<circle cx="${ex}" cy="${ly(laneOf(sl))}" r="11" fill="var(--surface)" stroke="var(--crit)" stroke-width="3.5"><title>End: ${esc(v.outcome)}</title></circle>`;
  g+=`<path d="M${cx(steps.length-1)+BW/2},${ly(laneOf(sl))} H${ex-13}" class="flow" marker-end="url(#arr)"/>`;
  let handoffs=0;
  steps.forEach((s,i)=>{
    const x=cx(i), y=ly(laneOf(s));
    if(i<steps.length-1){const n=steps[i+1],x2=cx(i+1),y2=ly(laneOf(n));
      if(y2===y) g+=`<path d="M${x+BW/2},${y} H${x2-BW/2-2}" class="flow" marker-end="url(#arr)"/>`;
      else {handoffs++;const mx=x+BW/2+(CW-BW)/2;g+=`<path d="M${x+BW/2},${y} H${mx} V${y2} H${x2-BW/2-2}" class="flow" marker-end="url(#arr)"/>`}}
    // other responsible lanes
    s.R.slice(1).forEach(r=>{const yy=ly(r);g+=`<line x1="${x}" x2="${x}" y1="${y+(yy>y?BH/2:-BH/2)}" y2="${yy+(yy>y?-14:14)}" class="assoc"/><rect x="${x-46}" y="${yy-14}" width="92" height="28" rx="14" class="part" data-ent="step:${s.id}"><title>Also responsible: ${esc(RO[r].name)}</title></rect><text x="${x}" y="${yy+4}" text-anchor="middle" class="part-t">also R</text>`});
    const lines=wrap(s.name,24).slice(0,3);
    g+=`<g class="task" data-ent="step:${s.id}"><rect x="${x-BW/2}" y="${y-BH/2}" width="${BW}" height="${BH}" rx="8"/><text x="${x-BW/2+8}" y="${y-BH/2+14}" class="task-n">${s.seq}</text>
      ${lines.map((t,j)=>`<text x="${x}" y="${y+(j-(lines.length-1)/2)*14+4}" text-anchor="middle" class="task-t">${esc(t)}</text>`).join('')}<title>${esc(s.name)} · Accountable: ${esc(RO[s.A].name)}</title></g>`;
    // systems
    g+=`<line x1="${x}" x2="${x}" y1="${sy}" y2="${sy+6}" stroke="var(--accent)"/>`;
    s.apps.forEach((a,j)=>{g+=`<g class="sys" data-ent="app:${a}"><rect x="${x-BW/2}" y="${sy+10+j*20}" width="${BW}" height="17" rx="4"/><circle cx="${x-BW/2+8}" cy="${sy+18.5+j*20}" r="3.5" fill="var(--${AP[a].time.toLowerCase()})"/><text x="${x-BW/2+16}" y="${sy+22.5+j*20}" class="sys-t">${esc(AP[a].name.length>24?AP[a].name.slice(0,23)+'…':AP[a].name)}</text><title>${esc(AP[a].name)} · ${esc(AP[a].product)} · ${AP[a].time}</title></g>`});
  });
  const apps=[...new Set(steps.flatMap(s=>s.apps))], bpOf=D.business_processes.find(b=>b.journeys.includes(v.id));
  const opts=CVS_ORDER.map(c=>`<optgroup label="${esc(CVS[c].name)}">${D.value_streams.filter(x=>x.parent===c).map(x=>`<option value="${x.id}" ${x.id===v.id?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`).join('');
  $('#view').innerHTML=`<div class="filters"><label>Journey <select id="pmap-sel" data-pmapsel="1">${opts}</select></label>
    <div class="chips" style="align-self:flex-end">${chip('cvs',v.parent,CVS[v.parent].name,false)}${bpOf?chip('bp',bpOf.id,bpOf.name):''}${chip('role',v.owner,'Owner: '+RO[v.owner].name,false)}</div></div>
   <div class="grid g-kpi" style="margin-bottom:14px">
